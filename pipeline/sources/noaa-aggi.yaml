# NOAA Annual Greenhouse Gas Index (AGGI): effective radiative forcing from long-lived greenhouse gases since 1750.
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("NOAA Annual Greenhouse Gas Index (AGGI)");
# verifier verdict "confirmed" (Hofmann et al. 2006 DOI verified; the source-links TXT is stale 2023-vintage; HFC-23
# comes from AGAGE; the page text and the files differ slightly on 2024 CO2 because of revisions).
# Licence evidence checked 2026-10-04: GML's "Disclaimer and Terms of Reference" page (linked from every GML page,
# HTTP 200) is the GML-wide data-use statement; the AGGI page itself states no separate terms. Its conditions are
# carried below as no_endorsement and the notice; its requested acknowledgement is the citation text. The same page
# asks that works consisting predominantly of NOAA material identify it and state it is not subject to copyright
# (17 U.S.C. 403), hence the notice.
# Artifacts checked 2026-10-04 (all HTTP 200 with ETag and Last-Modified):
#   AGGI_Table.csv: 2,919 bytes, Last-Modified 5 Jan 2026; last row
#     2024,2.333,0.567,0.226,0.298,0.060,0.055,3.539,539,1.538,2.3 (the page still reads "Updated Fall 2025").
#   NOAA_Annual_Mean_MoleFractions.csv: 11,400 bytes, Last-Modified 29 Sep 2025.
#   NOAA_Source_Data_Web_Links_and_doi_Citations.txt (HTTP 200, Last-Modified 23 Sep 2024) lists 2023-vintage
#     component versions, so it is not registered as an artifact.
id: noaa-aggi
title: NOAA Annual Greenhouse Gas Index
publisher: NOAA Global Monitoring Laboratory
landing_url: https://gml.noaa.gov/aggi/aggi.html
description: >-
  Global effective radiative forcing (W/m2, relative to 1750) from 22 long-lived greenhouse gases measured by NOAA,
  grouped as CO2, CH4, N2O, CFC* (CFCs plus CCl4, CH3CCl3 and halons, 8 gases; CFCs were 95% of the group's forcing in
  2024), HCFCs (HCFC-22, -141b, -142b) and HFC* (seven HFCs plus SF6), with the CO2-equivalent mixing ratio (ppm) and
  the index itself (1990 = 1), annually from 1979. Also the global annual mean mole fractions used. Covers long-lived
  gases only: no aerosols, ozone or land-use forcing. Since the 2023 update all years use the IPCC AR6 effective
  radiative forcing expressions. The vintage is the page's "Updated" label.
