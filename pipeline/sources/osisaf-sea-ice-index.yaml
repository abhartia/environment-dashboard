# EUMETSAT OSI SAF Sea-Ice Index v3.0 (OSI-420-a): sea ice extent and area, hemispheric, global and regional, from
# October 1978. An independent European counterpart to the NSIDC Sea Ice Index.
# Evidence: docs/research/sources-ocean-and-ice.json ("EUMETSAT OSI SAF Sea-Ice Index v3.0 (OSI-420-a)"); verifier
# verdict "corrected": the THREDDS link in the research (osisaf_420siiv3p0.html) returns 404 (the product page's is
# thredds.met.no/thredds/catalog/osisaf/osisaf_seaiceindex.html, HTTP 200 on 2026-10-04); monthly rows have five
# fields although the "# Format" line lists six; the file header names the source CDR DOIs, cited in the description.
# The research's claim that the v2.3 feed ended on 1 June 2026 is unconfirmed: the product page lists v2.3 "on the FTP
# server since 01/09/2025" and v3.0 since 4 May 2026, with no end date for v2.3.
# Licence evidence checked 2026-10-04: the OSI-420-a product page (HTTP 200) shows "Licensed under CC BY 4.0 by
# EUMETSAT", "Licence : CC BY 4.0 Attribution : You must include attribution to EUMETSAT OSI SAF" and the
# recommended citation, plus the site-wide licence statement quoted below. DataCite for doi:10.15770/EUM_SAF_OSI_0026
# gives rights "Creative Commons Attribution 4.0 International" (cc-by-4.0), title "Sea Ice Index version 3.0 -
# Multimission", version 3.0, created 2026-05-04.
# Artifacts checked 2026-10-04 (HTTP 200, Last-Modified 4 Oct 2026 10:22 UTC, no ETag; If-Modified-Since answers 304):
#   nh monthly 17,861 bytes ("# Creation date: 2026-10-04 09:36:46"; last row 2026.7068 2026 09 16 5341947);
#   nh daily 685,383 bytes (last row 2026-10-03, 6,249,935 km2, source OSI438AFT); sh monthly 17,837 bytes; sh daily
#   684,332 bytes. Months before November 1978 are -999.
# citation.text: the product page's "Recommended citation", verbatim.
id: osisaf-sea-ice-index
title: EUMETSAT OSI SAF Sea-Ice Index v3.0 (OSI-420-a)
publisher: EUMETSAT Ocean and Sea Ice SAF (OSI SAF), produced by the Norwegian Meteorological Institute
landing_url: https://osi-saf.eumetsat.int/products/osi-420-a
description: >-
  Sea ice extent (area with concentration above 15%) and sea ice area in km2, daily and monthly, for the Northern and
  Southern Hemispheres (plus global and about 25 regional seas in the same archive), from October 1978 with one day of
  latency. Derived from the OSI SAF sea ice concentration climate data records OSI-450-a1, OSI-430-a and OSI-438
  (doi:10.15770/EUM_SAF_OSI_0023, 10.15770/EUM_SAF_OSI_2014, 10.15770/EUM_SAF_OSI_0024). Text files: '#' header lines,
  then decimal year, year, month, day and extent (km2), with a source code column in the daily files only; -999 marks
  missing values. Uses a different algorithm from NSIDC's Sea Ice Index, so its values differ (September 2026 Arctic
  mean: 5.34 million km2 here, 4.81 in NSIDC's); the two are never mixed in one series.
