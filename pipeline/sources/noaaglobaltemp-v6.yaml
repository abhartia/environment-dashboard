status:
  state: active
  note: >-
    Version 6.1.0 published 23 March 2026 (NCEI ISO record; DOI registered 27 March 2026), switching to ERSST version 6
    and a 1991–2020 base. NCEI is moving its data to the cloud and warns of temporary access delays. NCEI is a NOAA line
    office exposed to the proposed FY2027 NOAA budget cut.
  us_federal: true
update_cadence: Monthly, with NOAA NCEI's global climate report (around the 8th–10th)
next_release:
