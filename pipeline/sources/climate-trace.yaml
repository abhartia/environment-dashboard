# Climate TRACE Emissions Inventory, V5.10.0 (Zenodo record 22919723, published 27 August 2026), country level.
# Evidence: docs/research/sources-zero-sectors-2026-10-08.json, candidates[0] (rank 1) and gates_mapping.
#
# Terms (https://climatetrace.org/terms, read 2026-10-08, HTTP 200; the quote below is matched on every fetch): CC BY
# 4.0 "with the exception of external datasets listed below". The page lists, as "Country-level emissions estimates"
# with "Source: EDGAR": Other energy use, Railways, Other transportation, Other onsite fuel usage, Other Solid fuels,
# Other fossil fuel operations, Other manufacturing, Solid waste disposal, Biological treatment of solid waste,
# Incineration and open burning of waste, Fluorinated gases; with "Source: FAOSTAT": Rice cultivation (in some
# geographies), Other Agricultural Soil Emissions, Enteric Fermentation - Other, Manure Management - Other, Other
# onsite fuel usage; and plant-level estimates in Other manufacturing (European PRTR, US EPA FLIGHT, Israel PRTR) and
# in Solid waste disposal (US EPA FLIGHT, US EPA LMOP, Canada GHGRP, European PRTR). The data guide inside every
# V5.10.0 zip (ABOUT_THE_DATA/about_the_data_v5_10_0.pdf) names the EDGAR source as "comprising IEA-EDGAR CO2, EDGAR
# CH4, EDGAR N2O, EDGAR F-GASES version 8.0" plus CEDS v_2024_07_08, and adds Solid fuel transformation and Cropland
# fires (country and source level) to that list. The Zenodo record's licence field is cc-by-4.0.
#
# How each part is classed (the transform envdash/transforms/emissions/climate_trace.py applies it):
# - Climate TRACE's own subsectors: open, CC BY 4.0. Owner decision 2026-10-08: this includes the subsectors that
#   the terms do not list as external datasets but whose country totals Climate TRACE's methodology builds from
#   IEA-based inputs: road-transportation ("Country level data derived from EDGAR", and a scale factor to EDGAR
#   v2025 road CO2 in the JHU APL road methodology), residential- and non-residential-onsite-fuel-usage (EDGAR v8
#   super-resolved, Duke buildings methodology), heat-plants (IEA World Energy Balances), glass, lime,
#   food-beverage-tobacco, textiles-leather-apparel (EDGAR, CEDS, USGS or UNIDO), other-chemicals, other-metals,
#   wood-and-wood-products and other-mining-quarrying (CEDS country totals; CEDS uses IEA energy statistics). The same
#   reasoning as for FAO's own calculations from IEA inputs (docs/sources.md): the producer that publishes the
#   values licenses them CC BY 4.0. Whether IEA agreed is an open question for Climate TRACE and the IEA (not yet
#   asked).
# - Listed EDGAR subsectors: their carbon dioxide is IEA-EDGAR CO2 (CC BY-NC-ND 4.0, see edgar-2026-ghg.yaml), so their
#   co2 and co2e files are never fetched. Their ch4 and n2o files (EDGAR CH4 and N2O, CC BY 4.0, "© European Union")
#   are, and the transform converts them to CO2-equivalent. Fluorinated gases (EDGAR F-gases, CC BY 4.0) exist only as
#   CO2-equivalent and their co2e file is fetched. Cropland fires is in the data guide's EDGAR list and is treated
#   the same way. Other onsite fuel usage is on both lists; its carbon dioxide cannot be assigned to one of them, so
#   it is treated as EDGAR.
# - Listed FAOSTAT subsectors: FAO's CC BY 4.0 (FAO Statistical Database Terms of Use); the farm items Climate TRACE
#   reproduces are FAO's own Tier 1 estimates. Rice cultivation mixes Climate TRACE's satellite model and FAOSTAT,
#   both CC BY 4.0.
# - Other manufacturing is not fetched: IEA-EDGAR CO2, and non-CO2 values mixed with Israel PRTR plant reports whose
#   terms have not been read.
# - Solid waste disposal: EDGAR CH4 plus plant reports from US EPA FLIGHT and LMOP (US federal works), Canada's GHGRP
#   (Open Government Licence - Canada) and the European PRTR (EEA, CC BY 4.0), all attribution-only; credited in the
#   notice. Its carbon dioxide is 0 in every V5.10.0 row; only ch4 and n2o are read.
#
# Artifacts. Each subsector zip on Zenodo is up to 4.9 GB (71 files, 39.6 GB in all), so only the country-level CSV is
# read from each, by HTTP Range requests (Artifact.zip_member; envdash/zipmember.py): about 0.5 MB per member, three or
# four requests per zip, every member's CRC-32 checked. Zenodo answers Range with 206 (checked 2026-10-08) and allows
# 133 requests a minute to anonymous clients. Zenodo gives each zip's md5 only; the snapshot sha256 is the member's.
# The same country files are on downloads.climatetrace.org/v5.10.0/sector_packages/co2e_100yr/<sector>.zip (3.5 GB in
# all for co2e_100yr), which is not DOI-pinned; Zenodo is the producer's own stable copy.
#
# Open questions (not yet asked): (1) Climate TRACE: may the IEA-lineage subsectors above be redistributed and
# regrouped under CC BY 4.0, and did the IEA agree; (2) IEA (compliance@iea.org): the same, from the IEA's side;
# (3) Climate TRACE: the terms page and the data guide list different external datasets (Solid fuel transformation,
# Cropland fires, CEDS) - which governs; (4) Israel PRTR terms, for other manufacturing; (5) whether EDGAR's CH4 and
# N2O from fuel combustion, which EDGAR computes from IEA activity data, are as open as JRC's CC BY label says (this
# entry follows JRC's label, as edgar-2026-ghg.yaml does).
id: climate-trace
title: Climate TRACE Emissions Inventory (country level)
publisher: Climate TRACE coalition
landing_url: https://zenodo.org/records/22919723
description: >-
  Climate TRACE's estimates of greenhouse gas emissions for every country, 2015 to the latest month, in about 70
  subsectors under ten sectors (power, manufacturing, mineral extraction, fossil fuel operations, transportation,
  buildings, agriculture, waste, fluorinated gases, forestry and land use), by gas (carbon dioxide, methane, nitrous
  oxide) and as CO2-equivalent at IPCC AR6 100-year and 20-year global warming potentials, in tonnes. The estimates are
  modelled from satellite and other remote sensing, facility data and other inputs by a coalition of organisations,
  and revised every month; some subsectors are reproduced from EDGAR and FAOSTAT. International aviation and shipping
  are assigned to countries. Only the annual country-level files of the pinned Zenodo version are read.
