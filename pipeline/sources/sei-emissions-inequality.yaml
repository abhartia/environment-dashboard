# SEI Emissions Inequality Dashboard: consumption CO2 by global income percentile, from its public JSON API.
# Evidence: docs/research/sources-solutions-and-action.json ("SEI Emissions Inequality Dashboard"; verdict confirmed).
# Checked 2026-10-04:
#   - emissions-inequality.org/about/ -> 200 with the licence text quoted below. The verifier recorded the licence as
#     unversioned "CC BY". In the page source, "CC BY" links to https://creativecommons.org/licenses/by/4.0/, so this
#     entry records CC BY 4.0.
#   - emissions-inequality.org/api/ (200) lists the endpoints on www.sei-eqtrans-dev.net. Without year parameters each
#     returns all years: globalHistoricalDataByYear 200, 877,309 bytes, 4,318 records, 1990-2023;
#     globalDataByYear 200, 3,359 bytes; countryTotals 200, 3,909 bytes. A query for 2024-2025 returns 404 "No products
#     found." No ETag or Last-Modified headers, so conditional is false. CORS: access-control-allow-origin *.
#   - Re-computed from the API for 2023: top 10% EmissionShare 0.4708, top 1% 0.1655, bottom 50% 0.0842 (matches the
#     research). PercentileValue is the width of each slice (0.01, 0.001, ... 0.00001), not its upper bound.
id: sei-emissions-inequality
title: Emissions Inequality Dashboard
publisher: Stockholm Environment Institute (SEI)
landing_url: https://emissions-inequality.org/
description: >-
  Each global income percentile's share of world income, population and consumption-based carbon dioxide emissions,
  for every year from 1990 to 2023, with the richest 1% split into finer slices down to the top 0.001%. Built from
  national consumption emissions spread across each country's income distribution for 117 countries. Covers carbon
  dioxide only, and the split depends on SEI's assumed link between income and emissions (its elasticity). Also
  global and covered-country totals of emissions, population and GDP for each year.
