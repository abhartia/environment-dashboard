# UMD/Hansen Global Forest Change v1.13 tree cover loss (2001-2025), tabulated by country by World Resources Institute
# and served through the Global Forest Watch (now Global Nature Watch) Data API, with the WRI/Google DeepMind
# dominant-driver classes, UMD/GLAD loss due to fire and the UMD primary humid tropical forest mask.
# Evidence: docs/research/sources-food-land-nature.json ("Global Forest Change v1.13 (Hansen/UMD) via GFW / Global
# Nature Watch Data API"); verdict "corrected" (pin the table version; /latest is an older version; new landing URL),
# final_redistribution open-attribution.
# Terms checked 2026-10-04:
# - Hansen download page (GFC-2025-v1.13/download.html): HTTP 200, Last-Modified 2026-04-29; quote below, plus "Use the
#   following credit when these data are displayed: Source: Hansen/UMD/Google/USGS/NASA".
# - GFW Data API metadata (api): umd_tree_cover_loss license "[CC BY 4.0](http://creativecommons.org/licenses/by/4.0/)",
#   versions v1.8-v1.13; umd_tree_cover_loss_from_fires "CC by 4.0"; wri_google_tree_cover_loss_drivers "CC by 4.0"
#   (v1.13, is_latest true) with display credit "Tree cover loss by dominant driver". WRI/Google DeepMind. The
#   gadm__tcl__iso_change table itself carries no licence field; its columns derive from those datasets.
# - umd_regional_primary_forest_2001 has an empty licence field in the API. GLAD's page
#   (glad.umd.edu/dataset/primary-forest-humid-tropics, HTTP 200) asks only for the Turubanova et al. (2018) credit;
#   the Earth Engine catalogue entry UMD/GLAD/PRIMARY_HUMID_TROPICAL_FORESTS/v1 states "The data may be used by anyone,
#   anywhere, anytime without permission, license or royalty payment. Attribution using the recommended citation is
#   requested." We credit Turubanova et al. wherever primary-forest loss appears.
# - Global Nature Watch terms (globalforestwatch.org/terms 301 -> globalnaturewatch.org/terms/, HTTP 200): "each
#   dataset carries its own license and restrictions" and "each request to an API must include one of Your Account's
#   unique API keys". So every request sends the key (header x-api-key, per the API's openapi.json: security scheme
#   APIKeyOriginHeader, apiKey in header "x-api-key", re-read 2026-10-04; access.key_header below). The keyless
#   requests that worked in research and in this check are not a documented entitlement. The owner created the key
#   on 2026-10-06 through the Data API (POST /auth/sign-up, /auth/token, /auth/apikey with no domain restriction,
#   alias envdash); it lives in the Keychain item gfw-api-key (docs/runbook.md) and the first keyed fetch succeeded
#   that day. The terms also point to Resource Watch "Attribution Requirements" (resourcewatch.org, a site WRI says
#   is being archived), which ask websites built on the Resource Watch API for a "powered by Resource Watch" logo; the
#   GFW Data API is a separate service, so we credit Global Nature Watch in the attribution instead. Owner to confirm
#   with WRI if in doubt.
# - The country breakdown uses GADM boundaries inside WRI's table; we take only the tabulated statistics, never GADM
#   polygons. The table also has WDPA, KBA, Landmark and other third-party columns, which we do not query.
# Artifacts checked 2026-10-04 (GET, no key): all four return HTTP 200 text/csv, cache-control max-age=7200, no ETag or
# Last-Modified (conditional false). Global: 26 lines, 2025 loss 25,528,555.5 ha, fire 10,751,917.9 ha, 2024
# 29,592,479.1 ha. Country: 4,976 lines. Primary forest at >=30% canopy: 2025 4,286,331.3 ha, 2024 6,731,252.7 ha.
# Drivers: 32,015 lines, 2001-2025 total 542.8 Mha (permanent agriculture 172.3, wildfire 162.7, logging 134.6,
# shifting cultivation 52.9, other natural 8.4, hard commodities 5.1, settlements 4.9, unknown 1.9). These reproduce the
# verified research figures. The table version v20260424 has is_latest false; /latest 307-redirects to v20250515,
# which stops at 2024 (2024 loss 29,594,885 ha there). Pin and cite the version.
id: gfw-tree-cover-loss
title: Tree cover loss, Global Forest Change v1.13 (via Global Nature Watch)
publisher: University of Maryland GLAD lab with Google, USGS and NASA; tabulated and served by World Resources Institute
landing_url: https://globalnaturewatch.org/dashboards/global/
description: >-
  Annual tree cover loss (stand-replacing disturbance of vegetation taller than 5 m) from Landsat at 30 m, 2001-2025,
  summed by country by WRI for areas with at least 30% tree canopy cover in 2000. Includes the share caused by fire,
  loss inside humid tropical primary forest, and the dominant driver of loss in each 1 km cell (permanent agriculture,
  hard commodities, shifting cultivation, logging, wildfire, settlements and infrastructure, other natural
  disturbances). Tree cover loss is not deforestation: it includes plantation harvest, fire and natural disturbance.
  Method changes from 2011 and 2015 onward make early and late years less comparable.
