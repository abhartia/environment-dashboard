# National contributions to climate change due to historical emissions of CO2, CH4 and N2O (Jones et al.), v2025.1.
# Evidence: docs/research/sources-emissions.json ("National contributions to climate change ... version 2025.1").
# The research and its verifier class this as open (CC BY 4.0) on the assumption that its CH4 and N2O come from
# PRIMAP-hist v2.6 (CC BY). That assumption is wrong, so this entry is noncommercial. Checked 2026-10-04:
#   - Zenodo record 16640595 (v2025.1, 2025-11-13, 25 files) is labelled cc-by-4.0, and /versions/latest resolves to it.
#   - Its own reference list (zenodo.org/records/16640595) cites "Gütschow, J., Busch, D. & Pflüger, M. (2025): The
#     PRIMAP-hist national historical emissions time series (1750-2024) v2.7". The earlier versions cite v2.6 (2024.2),
#     v2.5.1 (2024.1) and v2.4 (2023.x). The description text still says "(Gütschow et al., 2024)".
#   - The CH4 and N2O series run to 2024 (EMISSIONS_ANNUAL_1830-2024.csv: China CH4 Total 2024 = 54.555951 Tg). Only
#     PRIMAP-hist v2.7 covers 2024; v2.6.1 (zenodo 15016289, CC BY 4.0) ends in 2023.
#   - PRIMAP-hist v2.7 (zenodo 17090760) is CC BY-NC-SA 4.0. Its commercial licence covers only the country-reported
#     (CR) series, and Jones uses the third-party (HISTTP) series. So the CH4, N2O and 3-GHG values, and the warming
#     derived from them, are adaptations of NC-SA data. The deposit's CC BY label cannot lift that. This entry takes the
#     stricter terms (noncommercial: BY-NC-SA downloads), and the evidence quotes the upstream terms that decide the
#     class. The CO2-only components come from GCB (CC BY) but share the same files.
#   - Every artifact URL: ranged GET -> 206. DataCite 10.5281/zenodo.16640595 rights: "Creative Commons Attribution 4.0
#     International".
#   - citation.text is Zenodo's "Cite as" text for the record (APA), copied verbatim.
id: jones-2025-national-contributions
title: National contributions to climate change due to historical emissions of carbon dioxide, methane and nitrous oxide
publisher: Jones et al. (University of East Anglia, CICERO and others)
landing_url: https://zenodo.org/records/16640595
description: >-
  The change in global mean surface temperature caused by each country's emissions of carbon dioxide, methane and
  nitrous oxide from fossil fuels and from land use, from 1851 to 2024 (reference year 1850). The files also give the
  annual emissions it is computed from (from 1830) and cumulative CO2-equivalent emissions (GWP*), for countries and for
  groups such as Annex I, the OECD, the EU27 and the least developed countries. Warming uses the IPCC AR6 best-estimate
  transient climate response to cumulative emissions. Aerosols and fluorinated gases are not included, so the total
  warming here is larger than the observed human-induced warming.
