# Net Zero Tracker: the dataset behind the Net Zero Stocktake 2025, deposited on Zenodo by the Tracker's own team.
# Evidence: docs/research/sources-zero-levers-and-adaptation-2026-10-08.json, candidates "1. From 51 billion to zero:
# net-zero targets", item "Net Zero Tracker – Net Zero Stocktake 2025 underlying dataset (Zenodo)".
# Licence, read 2026-10-08. The producer's two statements disagree:
#   - The Tracker's data terms (https://zerotracker.net/data-terms-of-use, page dated 26 FEB 2025, GET 200 to the
#     pipeline's client) say "Net Zero Tracker datasets are licensed under the Attribution-NonCommercial 4.0
#     International (CC BY-NC 4.0) license." and "The Current Snapshot dataset was available for download under a CC
#     BY 4.0 license up until 2 December 2024." (quoted below).
#   - The Zenodo record (https://zenodo.org/api/records/17143240, deposited 17 September 2025 by Helen Tatlow, Diego
#     Manya and Denise Siu, who lead the Tracker's data update) gives "license": {"id": "cc-by-4.0"}.
#   Owner decision (2026-10-08): where a producer's website and its own Zenodo deposit disagree, use the stricter
#   class. So this entry is noncommercial, CC BY-NC 4.0, until the Tracker confirms which applies.
# What is used, and what is not:
#   - Only the target fields of rows with Entity_type "Country" (198 rows, the European Union among them as EUU):
#     End_target, End_target_year, Status_of_end_target, Date_of_last_status_update, and the Tracker's own flags
#     data_is_nzt and "No target at all".
#   - Not used: the context columns GDP, Population, GHG_emissions, "GDP PPP 2021", GHG_Country_2019 and "Pop (2021
#     for countries)". The Tracker's methodology page says national emissions come from "the ClimateWatch CAIT
#     dataset (2021)", whose fuel-combustion values are the IEA's; GDP comes from the World Bank. No share of world
#     emissions, GDP or population covered by targets is computed (the Stocktake's 74%, 77% and 79% are the report's
#     own, from a method the file cannot reproduce).
#   - mirror_raw false: the raw CSV carries those third-party columns.
# The file is cp1252-encoded, 8,534,432 bytes, md5 68515520c574f51bf5d69af4d493ca57 (as the Zenodo record lists it),
# sha256 fd2471cfb041c02e24f09291edaa2d77c5367edcb16f2123994d1be0b31bd54b. Zenodo's record JSON is not registered: it
# carries view and download counts that change daily, so its bytes would be a new snapshot each week.
# The live Current Snapshot on zerotracker.net is behind a form with Google reCAPTCHA; it is not fetched.
id: net-zero-tracker-2025
title: Net Zero Stocktake 2025 dataset
publisher: Net Zero Tracker (Energy and Climate Intelligence Unit, Data-Driven EnviroLab, NewClimate Institute, Oxford Net Zero)
landing_url: https://zenodo.org/records/17143240
description: >-
  The Net Zero Tracker's record of net zero and other end targets for 4,083 entities (198 national governments
  including the European Union, 712 regions, 1,186 cities and 1,987 companies), as collected for the Net Zero
  Stocktake 2025: each target's type, year, legal status (in law, in a policy document, a declaration or pledge,
  proposed or in discussion, or achieved by the entity's own account), interim targets, coverage and plans. Coded by
  the Tracker's volunteer coders from public documents and checked by a second coder. Only the national target fields
  are used here.
