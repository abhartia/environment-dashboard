      Annual anomalies for the globe, both hemispheres and eight latitude bands (including 64N–90N) from 1880, °C
      relative to 1951–1980. Complete years only.
status:
  state: at-risk
  note: >-
    Still publishing monthly (August 2026 data posted 8–11 September 2026). NASA cancelled the lease on GISS's New York
    building from 31 May 2025 and staff work remotely. The inputs are NOAA GHCN v4 and ERSST v5, so cuts at NOAA NCEI
    would also stop GISTEMP. GISTEMP still uses ERSST v5 while NOAAGlobalTemp 6.1 moved to ERSST v6.
  us_federal: true
update_cadence: Monthly, around the 10th, on the same day as NOAA NCEI's global analysis
next_release:
  expected: 2026-10-09
  note: >-
