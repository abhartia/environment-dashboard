# EFFIS (European Forest Fire Information System) burnt-area estimates for Europe, from the JSON API behind the EFFIS
# Statistics Portal, plus the JRC's Advance report on the 2025 fire season.
# Evidence: docs/research/sources-impacts.json, verification.missing_sources item 1 (EFFIS, CC BY 4.0 verified on
# /about-effis/data-license; the primary source for Europe's 2025 record, Advance report doi:10.2760/3859043), and the
# "State of Wildfires 2025-26" verdict (the Europe figure quoted there is EFFIS's, not State of Wildfires').
# Checked 2026-10-04:
#   - forest-fire.emergency.copernicus.eu/about-effis/data-license -> 200, CC BY 4.0 text quoted below; "logos and
#     names" are excluded from the reuse policy (no_logo). The Advance report's imprint (PDF p. 2) says the same:
#     "Unless otherwise noted, the reuse of this document is authorised under the Creative Commons Attribution 4.0
#     International (CC BY 4.0) licence". No third-party photo credits found in the PDF text.
#   - The API is undocumented. The URLs are those the Statistics Portal (apps/effis.statistics/estimates) requests,
#     read from its network requests; countries per area come from /statistics/utils/countriesbyaoi?aoi=effis (EU: 27
#     members; Non_EU: ALB, AND, BIH, XKO, MNE, MKD, NOR, SRB, CHE, TUR, UKR, GBR). All three return 200 JSON with
#     no ETag or Last-Modified (conditional false). Not yet run from a GitHub runner.
#   - estimatesbycountry returns the same values with or without firesize=30; the portal labels them "Fires mapped in
#     EFFIS of approx. 30 ha or larger". The series include the current year to date (2026: EU 689,324 ha on
#     2026-10-04), which is a partial year. In the 2025 country overview the per-country values sum exactly to the EU
#     (1,034,552 ha) and Non_EU (1,006,799 ha) totals; seven countries (AND, CZE, EST, LTU, LUX, MLT, CHE) have null
#     ba, which the portal shows as blank.
#   - Advance report PDF via the Publications Office download handler (Cellar id 15c8033e-2c3e-11f1-906d-01aa75ed71a1):
#     200, application/pdf, 12,361,294 bytes, sha256 6e0a50e90ede5d507f34dbc00a567a63760d927252473f365ed41bae76082353,
#     75 pages. Its abstract says the complete 2025 analysis with the EFFIS country network follows "in the last
#     quarter of 2026" (no date, so no next_release).
#   - citation.text: "How to cite this report" from the Advance report (p. 2). The authors are the 16 the DOI's CSL
#     record lists (it also lists "European Commission. Joint Research Centre" as an institutional author).
id: effis
title: European Forest Fire Information System (EFFIS) burnt-area estimates
publisher: European Commission, Joint Research Centre (JRC), Copernicus Emergency Management Service
landing_url: https://forest-fire.emergency.copernicus.eu/apps/effis.statistics/estimates
description: >-
  Area burnt (hectares) and number of fires mapped by EFFIS from satellite imagery, for fires of about 30 hectares or
  larger, every year from 2006. Two series: the 27 EU member states together, and 12 other European countries
  together (including Türkiye, Ukraine and the United Kingdom). A third file gives each of those 39 countries' 2025
  total next to its 2006-2024 average. Fires burning natural land are counted, including prescribed burns; values
  differ from national statistics, and from GWIS's MODIS-based Europe totals. The Advance report gives the JRC's
  analysis of the 2025 season.
