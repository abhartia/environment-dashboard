# OECD: government budget allocations for R&D (GBARD) by socio-economic objective (NABS 2007), from the OECD's SDMX
# API (dataflow OECD.STI.STP,DSD_RDS_GOV@DF_GBARD_NABS07,1.0).
# Evidence: docs/research/sources-zero-levers-and-adaptation-2026-10-08.json, candidates "4. Innovation: public energy
# RD&D and venture funding", item "OECD Government budget allocations for R&D by socio-economic objective (NABS
# 2007), objective 'Energy'".
# Owner decision (2026-10-08): research budgets come from OECD and Eurostat GBARD only; the IEA's Energy Technology
# RD&D Budgets (product or explorer) are not used.
# Licence, read 2026-10-08. www.oecd.org answers HTTP 403 to scripts, so the terms were read from the Internet Archive
# capture https://web.archive.org/web/20261006151414/https://www.oecd.org/en/about/terms-conditions.html (sha256 of
# the raw page cec832554d09fc2f0142c440b66d93cd308020fbc8ae5d07b973d647ee8119e1) and terms_check is manual. Section
# "3. Data":
#   - "Data may be subject to restrictions beyond the scope of these Terms and Conditions, either because specific
#     terms apply to those Data or because third parties may have ownership interests. It is the user's
#     responsibility to verify, either directly in the metadata or ... whether the Data is fully or partially owned
#     by third parties". The dataflow's structure (?references=all) names no third-party owner and no other terms.
#   - "Permitted Use" (quoted below), and: "When sharing or licensing work created using the Data, you agree to include
#     the same acknowledgment requirement in any sub-licenses that you grant" (notice below).
#   - The dataflow carries the annotation NonProductionDataflow "true", which the OECD does not explain; the data are
#     served by the public API and listed in the Data Explorer. To be asked.
# Unit: US dollars converted at purchasing power parities, constant prices of 2020 (UNIT_MEASURE USD_PPP, PRICE_BASE
# Q, BASE_PER 2020, UNIT_MULT 6: millions), the OECD's own conversion. Nothing is converted here.
id: oecd-gbard
title: Government budget allocations for R&D (GBARD), by socio-economic objective
publisher: OECD Directorate for Science, Technology and Innovation
landing_url: https://data-explorer.oecd.org/vis?df[ds]=dsDisseminateFinalDMZ&df[id]=DSD_RDS_GOV%40DF_GBARD_NABS07&df[ag]=OECD.STI.STP
description: >-
  Government budget allocations for research and development, by the socio-economic objective of the spending
  (NABS 2007), for OECD members and partner economies, from 1981. Here the objective Energy (NABS05) is used, in
  millions of US dollars at purchasing power parities and constant 2020 prices, as converted by the OECD. Energy is
  an objective covering every form of energy, so it includes research on fossil fuels and nuclear power as well as
  renewables and efficiency: it is all energy R&D in government budgets, not clean-energy research alone. The OECD's
  flags (estimated, provisional, break in series, definition differs) are kept. Budgets are plans for spending, not
  money spent.
