  note: >-
    Version 2026-1 was released by IUCN on 9 July 2026 and published on GBIF on 28 July 2026. IUCN is on the list of
    organisations the US is withdrawing from (Presidential memorandum of 7 January 2026, FR Doc 2026-00976); no effect
    on Red List releases so far. Not a US federal programme.
  us_federal: false
