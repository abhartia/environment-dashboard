# Wynes & Nicholas (2017), Environ. Res. Lett. 12 074024: emission reductions of individual lifestyle actions in
# developed countries, with the published comments, corrigendum and replies that critique it.
# Evidence: docs/research/sources-solutions-and-action.json ("Wynes & Nicholas 2017 ..."); verdict "confirmed",
# final_redistribution open-attribution, with the reply's article number (048002) added to the citations.
# Checked 2026-10-04:
#   - Crossref lists licence http://creativecommons.org/licenses/by/3.0/ for all six items: the paper (aa7541, ERL 12
#     074024), the comment by van Basshuysen & Brandstedt (aab213, ERL 13 048001), its corrigendum (aac2ee, ERL 13
#     069501), the reply by Wynes & Nicholas (aab210, ERL 13 048002), a second comment by Laycock Pedersen & Lam
#     (aac9d0, ERL 13 068001) and the reply to it (aac9cf, ERL 13 068002). The research listed only the first three;
#     the corrigendum, the second comment and its reply were found through Crossref and the comment's own "Related
#     content" box.
#   - iopscience.iop.org sends scripted requests for these articles to a "Radware Bot Manager Captcha" page (302 to
#     validate.perfdrive.com), so every file is acquired by hand and terms_check is manual.
#   - The licence quote was read on page 2 of the paper's PDF in the Internet Archive copy captured 2026-10-01
#     (https://web.archive.org/web/20261001103343/https://iopscience.iop.org/article/10.1088/1748-9326/aa7541/pdf,
#     1,081,381 bytes, 10 pages). The same sentence, with "Attribution 3.0", is in the archived PDFs of the comment,
#     the corrigendum, both replies and the second comment. IOP adds a per-download cover page, so each person's
#     download has its own sha256.
#   - Supplementary data: ERL_12_7_074024_suppdata.pdf (named on the Internet Archive copy of the /data page,
#     2026-08-13), served from a signed, expiring S3 URL.
#   - An open copy of the comment is on LSE Research Online (HTTP 200, 666,427 bytes); its LSE cover page labels it
#     "Creative Commons: Attribution 4.0", but the article itself says Attribution 3.0, and the publisher's statement
#     is the one relied on here.
# The "one fewer child" value (58.6 t per year) counts emissions of descendants (Murtaugh & Schlax accounting); the
# comment argues this multiple-counts emissions and excludes net-zero trajectories. The site shows the critique next
# to that value and does not headline it.
id: wynes-nicholas-2017
title: The climate mitigation gap (Wynes & Nicholas 2017), with comments and replies
publisher: >-
  Seth Wynes and Kimberly A. Nicholas (Lund University, University of British Columbia); published in Environmental
  Research Letters (IOP Publishing)
landing_url: https://doi.org/10.1088/1748-9326/aa7541
description: >-
  Annual emission reductions per person (tonnes of CO2-equivalent) for lifestyle actions in developed countries, based
  on 148 scenarios from 39 sources, compared with the actions recommended by ten Canadian high-school science
  textbooks and by government resources from the EU, USA, Canada and Australia. The four high-impact actions in the
  abstract: one fewer child (58.6 t per year, an average for developed countries), living car-free (2.4 t per year),
  avoiding air travel (1.6 t per round-trip transatlantic flight) and a plant-based diet (0.8 t per year). Published
  with a comment (2018) disputing the child figure's accounting, a corrigendum to that comment, a second comment on
  how the recommendations were framed, and the authors' replies to both.
