# Indicators of Global Climate Change 2025 (IGCC; Forster et al. 2026): human-induced warming, effective radiative
# forcing by agent, GHG concentrations, observed GMST, GHG emissions and remaining carbon budgets.
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("Indicators of Global Climate Change 2025");
# verifier verdict "confirmed" (minor correction: the Zenodo record is titled "Indicators of Global Climate Change
# 2025", creators Smith, Walsh, Gillett, Hauser et al.). Also docs/research/sources-emissions.json missing_sources 1.
# Licence evidence checked 2026-10-04: DataCite record for the pinned version doi:10.5281/zenodo.21494229 has rights
# "Creative Commons Attribution 4.0 International" (rightsIdentifier cc-by-4.0); the Zenodo API gives license cc-by-4.0;
# the GitHub repo ClimateIndicator/data reports spdx CC-BY-4.0; the ESSD paper's Section 13 says "Data are provided
# under the CC-BY 4.0 License." Exception inside the repo: HadEX3 extremes inputs are Crown Copyright under the Open
# Government Licence v2 (ESSD Section 13); we do not use the extremes files.
# Artifact checked 2026-10-04: Zenodo API file URL HTTP 200, 1,495,354 bytes, md5 0ad608c0adb5aed35136d7f1f318c80a
# (matches the record), no ETag or Last-Modified (so conditional: false). IGCC-2025a (record 21494229, 22 Jul 2026)
# is the latest version of concept doi:10.5281/zenodo.7883757. The zip unpacks to ClimateIndicator-data-0f2765d/.
# The ESSD paper's data statement cites the earlier v2026.06.02 release; the verifier found the paper's headline
# values (1.37 C SR15 row, ERF 3.1035 W/m2 anthropogenic in 2025) unchanged at IGCC-2025a.
# citation.text: the ESSD "How to cite" text verbatim, then the data citation DataCite returns for the pinned DOI.
id: igcc-2025
title: Indicators of Global Climate Change 2025
publisher: Indicators of Global Climate Change (IGCC) consortium, led by the University of Leeds
landing_url: https://doi.org/10.5281/zenodo.21494229
description: >-
  Annual update of the IPCC AR6 assessment of key climate indicators. Human-induced warming relative to 1850-1900,
  split into greenhouse gases, other human forcings and natural forcings; effective radiative forcing by agent from
  1750 to 2025 (W/m2, best estimate with 5th and 95th percentiles); greenhouse gas concentrations 1750-2025; observed
  global mean surface temperature (multi-dataset mean); global GHG emissions by gas (GtCO2e, AR6 GWP100, including
  LULUCF); Earth's energy imbalance; and remaining carbon budgets in 0.1 degree steps. Pinned to data release
  IGCC-2025a. The headline warming file has two rows per period; the paper's headline uses the row noted "SR15
  definition".
