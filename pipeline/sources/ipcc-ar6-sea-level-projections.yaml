#     the authors under a Creative Commons Attribution 4.0 International License" (quoted below), and the Zenodo and
#     DataCite licence fields for doi:10.5281/zenodo.6382554 say cc-by-4.0 / "Creative Commons Attribution 4.0
#     International".
#   - The same description makes citation a condition: "users of the projections are obligated to cite chapter 9 of
#     Working Group 1 contribution to the the IPCC Sixth Assessment Report, the Framework for Assessment of Changes To
#     Sea-level (FACTS) model description paper, and the version of the data set used", and asks for the
#     acknowledgement used as the notice below. citation.text is the dataset citation exactly as given there, with
#     "[YYYY-MM-DD]" written as {date_accessed}; the attribution carries all three required citations.
#   - The concept DOI 10.5281/zenodo.5914709 and the version DOI 10.5281/zenodo.6382554 both resolve to this record;
#     its only other version (5914710) is the same 20210809 release. The version DOI is pinned.
#   - Files: ar6.zip 889,784,792 bytes (md5 6ae2f0206bcc687b2dadb1eb997d4234), ar6-regional-confidence.zip
#     9,243,771,601 bytes, ar6-regional_novlm-confidence.zip 8,746,266,026 bytes, location_list.lst 2,659,137 bytes.
#     The file URL returns 200 without login and supports ranged GETs (206); If-Modified-Since is ignored.
#   - ar6.zip's central directory (read by ranged GET) lists ar6/global/confidence_output_files/medium_confidence/
#     {ssp119,ssp126,ssp245,ssp370,ssp585,tlim*} and low_confidence/{ssp126,ssp245,ssp585}, each with AIS, GIS,
#     glaciers, landwaterstorage, oceandynamics and total *_values.nc. Two extracted files: sea_level_change in mm,
#     107 quantiles; total_ssp245_medium years 2020-2150, total_ssp585_low years 2020-2300, by decade.
#   - Acquisition manual: the release is frozen (static until AR7) and ar6.zip is 890 MB, so a weekly fetch would
#     re-download it every run. A person downloads it once and records it; mirror_raw is false because Zenodo already
#     keeps the file permanently under its DOI, so it is linked, not re-hosted.
#   - sealevel.nasa.gov/ipcc-ar6-sea-level-projection-tool (named in the Zenodo description) returns 404; the NASA
#     tool's material is now under earth.gov/sealevel (200).
id: ipcc-ar6-sea-level-projections
title: IPCC AR6 Sea Level Projections
publisher: IPCC AR6 Working Group I Chapter 9 authors (Garner, Kopp et al.), on Zenodo
landing_url: https://doi.org/10.5281/zenodo.6382554
description: >-
  The sea-level projections assessed in the IPCC Sixth Assessment Report (2021). Global mean sea-level change in
  millimetres, every ten years from 2020, at 107 quantiles, relative to 1995-2014 (the AR6 reference period, which the
  files themselves do not state). Medium-confidence projections run to 2150 for SSP1-1.9, SSP1-2.6, SSP2-4.5,
  SSP3-7.0 and SSP5-8.5 and for warming levels; low-confidence projections, which add ice-sheet processes whose
  likelihood is poorly known, run to 2300 for SSP1-2.6, SSP2-4.5 and SSP5-8.5. Totals come with their components:
  ocean dynamics (including thermal expansion), glaciers, the Greenland and Antarctic ice sheets, and land water
  storage. The record also holds regional and tide-gauge projections.
