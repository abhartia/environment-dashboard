description: >-
  EIA's answer to how many nuclear power plants and reactors operate in the United States and where, with the
  largest and smallest plants and their nameplate and net summer generating capacity in megawatts, as of the month the
  answer names. Net summer capacity is the most a plant can supply to the grid in summer conditions, after its own
  use; nameplate capacity is the generators' rated output.
