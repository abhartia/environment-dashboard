# GWIS (Global Wildfire Information System) Country Profile: yearly burned area by land cover from NASA MODIS MCD64A1,
# for the world and the five continents, from the JSON API behind gwis.jrc.ec.europa.eu/apps/country.profile.
# Evidence: docs/research/sources-impacts.json ("Global Wildfire Information System (GWIS): country profiles ...";
# verdict "confirmed", open-attribution) and the OWID entry in the same file (verdict "corrected"; OWID's GWIS series is
# only a mirror and is not used: the licence comes from GWIS's own page).
# Checked 2026-10-04:
#   - gwis.jrc.ec.europa.eu/about-gwis/data-license -> 200, CC BY 4.0 text quoted below. The same page excludes
#     "logos and names" from the reuse policy (no_logo).
#   - The bulk file the app's Data downloads page lists, MCD64A1_burned_area_full_dataset_2002_2024.zip on
#     effis-gwis-cms.s3.eu-west-1.amazonaws.com, returns 404 (as do the GlobFire, GFED, FAO and GFAS zips, the user
#     guide, and 2002_2025 variants). Country values for all 251 countries are therefore not in this entry: the API
#     serves one country per request, and the page offers no working bulk file. Adding countries waits for JRC to
#     restore the zip or document the API (jrc-effis@ec.europa.eu).
#   - The API is undocumented. The URLs below are exactly what the app requests (read from the app's network
#     requests: level=ADM0&value=ITA&year=2024&yearFrom=2002&yearTo=2024&env=PROD for a country), with level=AOI for
#     the areas the app lists (/api/v3/aoi?env=PROD: UN_AFR, UN_AME, UN_ASI, UN_EUR, UN_OCE, WORLD and others).
#     All six return 200 JSON (125-134 kB) with no ETag or Last-Modified, so conditional is false. Not yet run from a
#     GitHub runner.
#   - The app currently shows 2002-2024; the API also returns 2025 when asked (yearTo=2025). In 2025 rows the
#     GlobFire fields ba_area_ha, ba_count and firesize are 0.0 because that product has not been processed for 2025;
#     those zeros are not measurements. The land-cover fields (lc1..lc5, lc_tot) come from MCD64A1 and are filled for
#     2025. WORLD lc_tot for 2025 is 332,928,197.5 ha, the value OWID republishes.
#   - Land-cover classes, from the app's own labels: lc1 Forest, lc2 Savannas, lc3 Shrublands/Grasslands,
#     lc4 Croplands, lc5 Other. Values are hectares; lc1p..lc5p are percentages of lc_tot.
#   - GWIS gives no recommended citation for this dataset (the downloads page's citation field for it is empty), so
#     citation.text names the app and adds the upstream product's citation as DataCite returns it for
#     doi:10.5067/MODIS/MCD64A1.061. MCD64A1 is a NASA product with no use restrictions.
#   - Country and sub-national units in GWIS are GADM boundaries; only burned-area statistics are used here, never
#     GADM geometry.
id: gwis-burned-area
title: "GWIS Country Profile: yearly burned area by land cover (MODIS MCD64A1)"
publisher: European Commission, Joint Research Centre (JRC), Global Wildfire Information System (GWIS)
landing_url: https://gwis.jrc.ec.europa.eu/apps/country.profile
description: >-
  Area burned each year from 2002, in hectares, for the world and for each continent (Africa, Americas, Asia, Europe,
  Oceania), split by land cover: forest, savannas, shrublands and grasslands, croplands and other. Mapped from NASA's
  MODIS MCD64A1 Collection 6.1 monthly burned-area product at 500 metre resolution, which misses many small fires
  and much cropland burning, so totals are lower than finer-resolution estimates. Each response also carries monthly
  values and the 2002-2024 monthly range. Calendar years, unlike the March-February fire seasons of State of
  Wildfires.
