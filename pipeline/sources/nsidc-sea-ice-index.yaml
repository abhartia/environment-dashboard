# NOAA@NSIDC Sea Ice Index, Version 4 (G02135): Arctic and Antarctic sea ice extent, daily from October 1978.
# Evidence: docs/research/sources-ocean-and-ice.json ("Sea Ice Index, Version 4 (G02135)"); verifier verdict
# "corrected": not public domain, because the landing page makes citation a condition of use (class open with
# attribution). Also from the verifier: each daily value comes from a 3-day centred window of input files, so the
# newest one or two days are revised; the daily CSV header still names NSIDC-0081/0051 although rows from 1 January
# 2025 come from NSIDC-0803 (AMSR2), so the per-row Source Data column is the one to read.
# Licence evidence checked 2026-10-04: the G02135 v4 landing page (HTTP 200) states the condition quoted below. NSIDC's
# Citation Policies page (nsidc.org/about/data-use-and-copyright) repeats "As a condition of use, NSIDC requests that
# authors include a data citation"; its Data Policies page says "Most of the data held by NSIDC are government-funded
# and in the public domain" and that NSIDC flags any copyright restriction in the data set documentation. Neither the
# landing page nor the v4 user guide states a restriction on copying or redistribution, so the raw files may be
# mirrored with the citation.
# Artifacts checked 2026-10-04 (all HTTP 200 with ETag and Last-Modified, answer If-None-Match with 304):
#   north and south daily extent CSVs: 1,902,460 and 1,830,606 bytes, Last-Modified 4 Oct 2026 10:44 UTC; the north
#     file's last row is 2026-10-03, 5.771 million km2.
#   north and south 1981-2010 daily climatology CSVs: 34,520 bytes each, Last-Modified 2 Oct 2026.
#   monthly CSVs N_03, N_09, S_02, S_09: 2,352 bytes each, Last-Modified 2 Oct 2026; N_09 runs 1979 (7.05) to 2026
#     (4.81, NSIDC-0803); S_09 2026 = 17.32.
# The v4 user guide (g02135-v004-userguide.pdf) says AMSR2 data are the input from 1 January 2025, and NSIDC's own
# daily analysis uses a 5-day trailing mean. Corrected 2026-10-05 after re-reading the guide's section 3.1.6: the
# monthly extent in the N_mm/S_mm files is "obtained by simply averaging the daily extents over the month" (the mean
# concentration field is what the monthly images use), not computed from a monthly mean concentration field.
# citation.text: the landing page's citation with "[ describe subset used if applicable ]" filled and "Date Accessed"
# given as {date_accessed}.
id: nsidc-sea-ice-index
title: Sea Ice Index, Version 4 (G02135)
publisher: NOAA@NSIDC, National Snow and Ice Data Center (CIRES, University of Colorado Boulder)
landing_url: https://nsidc.org/data/g02135/versions/4
description: >-
  Sea ice extent (area of ocean with at least 15% ice concentration) and sea ice area, in million km2, for the Northern
  and Southern Hemispheres, from passive microwave satellite data on a 25 km grid: every other day from 26 October
  1978 to 20 August 1987, daily after that (no data from 3 December 1987 to 13 January 1988). Daily files carry extent
  and a 1981-2010 daily climatology (mean, standard deviation
  and percentiles); monthly files give one value per year for a calendar month. From 1 January 2025 the input is JAXA's
  AMSR2 (NSIDC-0803) instead of the DMSP SSMIS record (NSIDC-0051), which the source column of each row records.
  Recent daily values are revised for a day or two. Not interchangeable with OSI SAF's index, which uses a different
  algorithm; the two are shown as separate lines.
