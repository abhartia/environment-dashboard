# IRENA Renewable Capacity Statistics 2026 (published 31 March 2026): installed capacity by country and technology.
# Evidence: docs/research/sources-energy.json ("IRENA – Renewable Capacity Statistics 2026 and IRENASTAT"), re-checked
# 2026-10-04. irena.org HTML pages return 403 to scripts; files under /-/media/ return 200.
# Licence: page 2 of the publication PDF (terms_url), read 2026-10-04. It also says: "Material contained in this
# publication attributed to third parties may be subject to third party copyright and separate terms of use and
# restrictions, including restrictions in relation to any commercial use." No table in the PDF is attributed to a
# third party (the only "Source:" line credits the UN M49 country list).
# IRENASTAT (PxWeb) is not registered as an artifact, for two reasons found on 2026-10-04:
#   1. Its API (https://pxweb.irena.org/api/v1/en/IRENASTAT) returns data only to a POST query, and Artifact.access
#      allows GET only. Its newer tables (Country_ELECSTAT_2026_H2_PX.px, updated 2026-09-28) put World renewable
#      capacity for 2025 at 5,155,007 MW against 5,149,280 MW in this PDF.
#   2. Its terms differ: the table metadata says "Copyright: No" and cites "IRENA (2026), Renewable Energy Statistics
#      2026", while the site footer reads "© IRENA - International Renewable Energy Agency. All Rights Reserved."
#      Adding it needs POST support in the fetcher and written confirmation of the terms from IRENA.
id: irena-capacity-2026
title: Renewable capacity statistics 2026
publisher: International Renewable Energy Agency (IRENA)
landing_url: https://www.irena.org/Publications/2026/Mar/Renewable-capacity-statistics-2026
description: >-
  Installed renewable electrical capacity (megawatts) by country, region and technology (hydropower and pure pumped
  storage, marine, onshore and offshore wind, solar PV and concentrated solar, bioenergy by fuel, geothermal), 2016
  to 2025, in trilingual tables (English, French, Spanish). Fossil capacity is not covered. World renewable
  capacity at the end of 2025 is 5,149,280 MW (5,149 GW), up 692 GW (15.5%) in 2025. Capacity is maximum net
  generating capacity at year end, rounded to the nearest megawatt; it is not generation. Figures marked "o" come
  from official sources, "u" from unofficial sources such as industry associations and news, and "e" are IRENA
  estimates; the flag is kept with each value. Values are revised between editions and in IRENASTAT's half-yearly tables, so every value
  carries this edition's label. The renewable share of total electricity capacity is its own table (World 2025:
  49.4%); the tables hold no fossil capacity to recompute it from.
