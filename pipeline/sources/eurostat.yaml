    format: html
    description: >-
      Statistics Explained glossary entry "Candidate countries", which lists the official EU candidate countries with
      their Eurostat codes.
status:
  state: active
  note: >-
    nrg_ind_fecf is updated once a year with the energy balances (data to 2024, updated 16 July 2026); gba_nabsfin07
    several times a year (updated 25 September 2026, provisional 2025 and 2026 budgets for some countries). Not a US
    federal product.
  us_federal: false
update_cadence: Energy indicators yearly (early in the year and July); GBARD several times a year
twins: [oecd-gbard]
