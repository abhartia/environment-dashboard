# NASA GISS Surface Temperature Analysis, version 4 (GISTEMP v4).
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("NASA GISS Surface Temperature Analysis (GISTEMP v4)")
# and docs/research/sources-country-and-local.json (same name; verifier corrected the licence basis to 17 U.S.C. §105).
#
# Baseline (checked 2026-10-04): GISS publishes no observed series referenced to 1850-1900. The tables are anomalies
# from 1951-1980. The only GISS file on a 1850-1900 basis is the GMSTA page's forecast CSV
# (https://data.giss.nasa.gov/gistemp/gmsta/data/Annual_GISTEMP_GMSTA_Predictions_202609.csv, HTTP 200): predictions
# for 2026 and 2027, not observations. The GISTEMP FAQ gives a method instead: rebase 1951-1980 to 1880-1899, then add
# "about 0.038ºC" taken from the average of HadCRUT, NOAA and Berkeley Earth ("equivalent (as of Jan 2025), of adding
# ~0.19ºC"). The GMSTA page describes the same step as starting from "the GISTEMP anomaly for 1880-1900". Following the
# plan, the site shows GISTEMP against its own late-19th-century mean, labelled with the exact years used.
id: gistemp-v4
title: GISS Surface Temperature Analysis, version 4 (GISTEMP v4)
publisher: NASA Goddard Institute for Space Studies
landing_url: https://data.giss.nasa.gov/gistemp/
description: >-
  Monthly, seasonal and annual global, hemispheric and zonal land-ocean temperature anomalies from 1880, combining
  NOAA GHCN v4 weather-station data with NOAA ERSST v5 sea-surface temperatures. Anomalies are in degrees Celsius
  relative to the 1951–1980 mean. GISS publishes no observed series relative to 1850–1900; its FAQ describes a
  conversion through 1880–1899 plus about 0.038 °C borrowed from other datasets, so the site uses GISTEMP's own
  late-19th-century mean, labelled with its years. Earlier months are revised slightly each month as late reports
  arrive.
