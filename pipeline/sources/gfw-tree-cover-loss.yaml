artifacts:
  - id: loss-global-annual
    url: https://data-api.globalforestwatch.org/dataset/gadm__tcl__iso_change/v20260424/download/csv?sql=SELECT%20umd_tree_cover_loss__year%2C%20SUM%28umd_tree_cover_loss__ha%29%20AS%20umd_tree_cover_loss__ha%2C%20SUM%28umd_tree_cover_loss_from_fires__ha%29%20AS%20umd_tree_cover_loss_from_fires__ha%20FROM%20data%20WHERE%20umd_tree_cover_density_2000__threshold%20%3D%2030%20GROUP%20BY%20umd_tree_cover_loss__year%20ORDER%20BY%20umd_tree_cover_loss__year
    format: csv
    description: >-
      World tree cover loss and loss due to fire by year (ha), 2001-2025, at >=30% canopy cover in 2000; the sum of
      WRI's country table.
    access: {auth: api-key, auth_env: GFW_API_KEY, key_header: x-api-key, conditional: false}
  - id: loss-country-annual
    url: https://data-api.globalforestwatch.org/dataset/gadm__tcl__iso_change/v20260424/download/csv?sql=SELECT%20iso%2C%20umd_tree_cover_loss__year%2C%20SUM%28umd_tree_cover_loss__ha%29%20AS%20umd_tree_cover_loss__ha%2C%20SUM%28umd_tree_cover_loss_from_fires__ha%29%20AS%20umd_tree_cover_loss_from_fires__ha%20FROM%20data%20WHERE%20umd_tree_cover_density_2000__threshold%20%3D%2030%20GROUP%20BY%20iso%2C%20umd_tree_cover_loss__year%20ORDER%20BY%20iso%2C%20umd_tree_cover_loss__year
    format: csv
    description: >-
      Tree cover loss and loss due to fire by country (GADM ISO3 code) and year (ha), 2001-2025, at >=30% canopy cover
      in 2000.
    access: {auth: api-key, auth_env: GFW_API_KEY, key_header: x-api-key, conditional: false}
  - id: loss-primary-forest-country-annual
    url: https://data-api.globalforestwatch.org/dataset/gadm__tcl__iso_change/v20260424/download/csv?sql=SELECT%20iso%2C%20umd_tree_cover_loss__year%2C%20SUM%28umd_tree_cover_loss__ha%29%20AS%20umd_tree_cover_loss__ha%20FROM%20data%20WHERE%20umd_tree_cover_density_2000__threshold%20%3D%2030%20AND%20is__umd_regional_primary_forest_2001%20%3D%20true%20GROUP%20BY%20iso%2C%20umd_tree_cover_loss__year%20ORDER%20BY%20iso%2C%20umd_tree_cover_loss__year
    format: csv
    description: >-
      Tree cover loss inside the 2001 humid tropical primary forest extent (Turubanova et al. 2018) by country and year
      (ha), 2001-2025, at >=30% canopy cover in 2000. Without the canopy filter the table double-counts across
      thresholds.
    access: {auth: api-key, auth_env: GFW_API_KEY, key_header: x-api-key, conditional: false}
  - id: loss-drivers-country-annual
    url: https://data-api.globalforestwatch.org/dataset/gadm__tcl__iso_change/v20260424/download/csv?sql=SELECT%20iso%2C%20wri_google_tree_cover_loss_drivers__driver%2C%20umd_tree_cover_loss__year%2C%20SUM%28umd_tree_cover_loss__ha%29%20AS%20umd_tree_cover_loss__ha%20FROM%20data%20WHERE%20umd_tree_cover_density_2000__threshold%20%3D%2030%20GROUP%20BY%20iso%2C%20wri_google_tree_cover_loss_drivers__driver%2C%20umd_tree_cover_loss__year%20ORDER%20BY%20iso%2C%20wri_google_tree_cover_loss_drivers__driver%2C%20umd_tree_cover_loss__year
    format: csv
    description: >-
      Tree cover loss by country, WRI/Google DeepMind dominant driver class (eight classes including "Unknown") and
      year (ha), 2001-2025, at >=30% canopy cover in 2000. WRI counts permanent agriculture, hard commodities and
      settlements and infrastructure as permanent conversion to non-forest land use.
    access: {auth: api-key, auth_env: GFW_API_KEY, key_header: x-api-key, conditional: false}
status:
  state: active
  note: >-
    GFC v1.13 (2025 loss) was released with WRI's analysis on 29 April 2026; GFC-2026-v1.14 does not exist yet. The
    pinned country table v20260424 is not flagged latest by the API. Global Forest Watch is rebranding as Global Nature
    Watch (the dashboard and terms URLs already redirect), so URLs may change. The product depends on Landsat (USGS and
    NASA), which is exposed to US science funding cuts; UMD's GLAD lab is not itself a federal programme.
  us_federal: false
update_cadence: Annual, around April-May (2025 loss released 29 April 2026)
