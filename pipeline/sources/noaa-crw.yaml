# NOAA Coral Reef Watch (CRW): global 5 km coral bleaching heat stress (Degree Heating Weeks) and CRW's published
# statistics on the fourth global coral bleaching event.
# Evidence: docs/research/sources-ocean-and-ice.json ("NOAA Coral Reef Watch (5 km DHW/Bleaching Alert, Marine
# Heatwave Watch v1.0.1, Regional Virtual Stations)"), verdict "confirmed"; and docs/research/sources-impacts.json
# ("NOAA Coral Reef Watch (CRW): global 5 km Degree Heating Week and the fourth global coral bleaching event
# statistics"), verdict "corrected": neither NOAA page gives a reef-area percentage for the 1998 or 2010 events (the
# status page still only says they "occurred in 1998 and 2010"), so no such bars without another primary source.
# Licence evidence checked 2026-10-04: CRW's "Disclaimer and Recommendations for Citing" page (HTTP 200) states the
# public-domain terms quoted below and asks for credit to "NOAA Coral Reef Watch". The NetCDF files' license attribute
# says the data "are available for use without restriction" with the same credit request. A NOAA NESDIS/STAR programme,
# so a US federal government work.
# Artifacts checked 2026-10-04:
#   status page coral_bleaching_report.php: HTTP 200, 25,234 bytes, byte-identical on two fetches, no ETag or
#     Last-Modified (so conditional: false); "(Updated: June 2, 2026)"; "From 1 January 2023 to 30 September 2025,
#     bleaching-level heat stress has impacted ~84.4% of the world's coral reef area and mass coral bleaching has been
#     documented in at least 83 countries and territories"; 68.2% for 2014-2017.
#   annual composites ct5km_dhw-max_v3.1_<year>.nc: HTTP 200 with ETag, answer If-None-Match with 304; 2023 14,413,522
#     bytes (Last-Modified 3 Jan 2024), 2024 15,778,551 bytes (2 Jan 2025), 2025 14,551,455 bytes (1 Jan 2026). The
#     2025 file: 3600 x 7200 grid (0.05 degree), degree_heating_week scaled by 0.01 (degree C weeks), plus the date of
#     the first occurrence of the maximum and a pixel classification mask. Annual names are fixed per year, unlike the
#     daily files (ct5km_dhw_v3.1_YYYYMMDD.nc), which take a new name each day.
# citation.text: CRW's recommended form for Version 3.1 DHW data ("Sample 2" on the citing page) with our dates and
# directory filled in, then the methods paper CRW recommends for the 5 km product suite, verbatim.
id: noaa-crw
title: NOAA Coral Reef Watch coral bleaching heat stress and global bleaching status
publisher: NOAA NESDIS Center for Satellite Applications and Research, Coral Reef Watch
landing_url: https://coralreefwatch.noaa.gov/
description: >-
  Coral bleaching heat stress from Coral Reef Watch's daily global 5 km satellite product suite, version 3.1 (CoralTemp
  sea surface temperature, from 1985). Degree Heating Weeks (DHW, in degree Celsius-weeks) accumulate, over the past 12
  weeks, the days when the sea was more than 1 °C warmer than its usual warmest-month average, weighted by how much
  warmer; CRW says values over 4 °C-weeks have caused significant bleaching and over 8 °C-weeks severe bleaching and
  significant mortality. Registered here: the annual maximum DHW maps for 2023, 2024 and 2025, the years of the fourth
  global bleaching event, and CRW's global bleaching status page, which publishes the share of the world's coral reef
  area that had bleaching-level heat stress (about 84.4% from 1 January 2023 to 30 September 2025; 68.2% in 2014-2017).
  Those percentages are CRW's published values; recomputing them needs CRW's reef-pixel definition. Heat stress is a
  measure of risk, not of observed bleaching or coral death.
