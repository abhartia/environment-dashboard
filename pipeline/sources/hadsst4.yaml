# Met Office Hadley Centre sea-surface temperature data set HadSST.4.2.0.0.
# Evidence: docs/research/sources-ocean-and-ice.json (verification.missing_sources item 4, "Met Office HadSST.4.2.0.0").
#
# Checked 2026-10-04: landing, download and terms pages all "Last updated: 15/09/2026"; both CSVs HTTP 200
# (Last-Modified 15 Sep 2026, ETag present); the annual GLOBE file's md5 (73f8fd76d949004cd5082bb681e06d9f) matches the
# download page. Version 4.2.0.0 has been current since September 2025 (Product User Guide, section 5.1), so the
# "[year of first publication]" in the acknowledgement is 2025 for this version. HadCRUT.5.2.0.0 is built on
# HadSST.4.1.1.0, not this version; the two are separate releases.
id: hadsst4
title: HadSST.4 sea-surface temperature anomalies
publisher: Met Office Hadley Centre
landing_url: https://www.metoffice.gov.uk/hadobs/hadsst4/
description: >-
  Monthly and annual sea-surface temperature anomalies from January 1850, from ship and buoy measurements (ICOADS,
  Met Office GTS ship data and Copernicus Marine drifting buoys) adjusted for changes in how SST was measured. Not
  interpolated. Anomalies are in kelvin (equal to degrees Celsius) relative to 1961–1990, with uncertainty split into
  measurement, sampling, bias and coverage parts. The global annual file holds complete years only (to 2025 on
  2026-10-04).
