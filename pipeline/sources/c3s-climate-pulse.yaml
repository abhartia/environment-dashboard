# Copernicus Climate Change Service (C3S) Climate Pulse: daily global surface air temperature and sea-surface
# temperature from ERA5, about two days after the fact.
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("Copernicus C3S ERA5 global temperature and Climate
# Pulse"; verifier corrected the licence to CC BY 4.0 and added the EC/ECMWF disclaimer).
#
# Licence: the CSVs carry no licence line. Their headers name the source as ERA5 hourly data on single levels on the
# C3S Climate Data Store, whose catalogue entry is licensed CC BY 4.0 (the quote below). The Climate Pulse "Credits"
# panel (in the app bundle, checked 2026-10-04) says "All users of Copernicus Products must provide clear and visible
# attribution to the Copernicus programme" and asks users to cite ERA5 hourly (doi:10.24381/cds.adbb2d47) and monthly
# (doi:10.24381/cds.f17050d7). The CDS "Citation and attribution" text adds the Copernicus attribution and the EC/ECMWF
# disclaimer "in addition to the requirements of the applicable license(s)", so both are obligations here; they also
# meet clause 5 of the Licence to use Copernicus Products (rev. 12).
id: c3s-climate-pulse
title: C3S Climate Pulse daily global temperatures (ERA5)
publisher: Copernicus Climate Change Service (C3S), implemented by ECMWF for the European Commission
landing_url: https://pulse.climate.copernicus.eu/
description: >-
  Daily global-mean surface air temperature (2 metres) from 1 January 1940 and daily mean sea-surface temperature
  averaged over 60°S–60°N from 1 January 1979, from the ERA5 reanalysis, updated each day with data up to two days
  behind the present. Each row gives the absolute value, the smoothed 1991–2020 daily climatology, the anomaly from
  1991–2020 and a status. Days 2 to 5 behind the present use ERA5 data not yet released on the Climate Data Store, and
  rows marked PRELIMINARY (usually the newest day) are likely to change slightly; the site keeps that status and labels
  those days preliminary.
