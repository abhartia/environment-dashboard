artifacts:
  # Both HTTP 200 on 2026-10-04 (Last-Modified 04 Oct 2026 04:11 GMT, ETag present). Stable URLs; the app's own
  # download buttons point at these files.
  - id: air-temperature-daily
    url: https://sites.ecmwf.int/data/climatepulse/data/series/era5_daily_series_2t_global.csv
    format: csv
    description: >-
      Daily global-mean 2 m air temperature from 1 January 1940: columns date, 2t, clim_91-20, ano_91-20, status
      (FINAL or PRELIMINARY), °C, after a "#" header ending "Last updated: <date>". On 2026-10-04 the last row was
      2026-10-02, PRELIMINARY.
  - id: sea-surface-temperature-daily
    url: https://sites.ecmwf.int/data/climatepulse/data/series/era5_daily_series_sst_60S-60N_ocean.csv
    format: csv
    description: >-
      Daily mean sea-surface temperature over the 60°S–60°N ocean from 1 January 1979: columns date, sst, clim_91-20,
      ano_91-20, status, °C. ERA5 takes its SST from the Met Office OSTIA analysis (HadISST2 before September 2007).
status:
  state: active
  note: >-
    Updated once a day, usually before 05:00 UTC, with ERA5 data up to two days behind the present. EU Copernicus
    programme, implemented by ECMWF; not exposed to US federal cuts.
  us_federal: false
update_cadence: Daily, usually before 05:00 UTC
next_release:
