# Siegrist, Green, Michel & Mathys (2024), Food Research International 197, 115213: nutrition and prices of almost
# 2,600 meat and milk substitutes and about 7,500 conventional products in the web shops of 13 supermarket chains in
# France, Germany, Italy, the Netherlands, Spain and the UK (August and September 2023).
# Evidence: docs/research/sources-zero-green-premium-papers-2026-10-08.json ("Siegrist et al. 2024 ..."); verdict
# "quoted range". Green Premium work of 2026-10-08.
# Checked 2026-10-08:
#   - ScienceDirect does not serve scripts. The article is read from the version of record on the ETH Zurich Research
#     Collection (doi:10.3929/ethz-b-000701817; DSpace metadata ethz.version.deposit "publishedVersion",
#     dc.rights.license "Creative Commons Attribution 4.0 International"; bitstream 1-s2.0-S0963996924012833-main.pdf,
#     6,252,266 bytes as stored, MD5 4a3013f7e5870761f64503e78de731d3). Its second page is Elsevier's first page with
#     the licence line quoted below.
#   - The repository adds a cover page "generated automatically upon download", with the download time in the PDF's
#     CreationDate, so every download has different bytes (6,294,590 bytes on 2026-10-08; two downloads gave two
#     sha256 values). Fetching it on a schedule would record a new snapshot each time, so the source is manual: one
#     download is recorded with envdash snapshot add and kept.
#   - The prices are the authors' own collection from the retailers' web shops ("collected manually and
#     semiautomatically from web shops of 13 major retailers"); no price vendor is involved.
#   - What is used: the two per-country price ratios the text states (p. 6: Germany 0.95, Spain 2.15). The abstract's
#     range "24 to 115 % more expensive" and the text's "between 1.24 and 1.46" for the four other countries are
#     joint statements for several countries and are quoted, not published as values. The per-country ratios for
#     France, Italy, the Netherlands and the UK are in the supplementary material, which is on ScienceDirect only.
id: siegrist-2024
title: Prices of meat substitutes relative to meat in six European countries (Siegrist et al. 2024)
publisher: >-
  Armin Siegrist, Ashley Green, Fabienne Michel and Alexander Mathys (ETH Zurich); published in Food Research
  International (Elsevier)
landing_url: https://doi.org/10.1016/j.foodres.2024.115213
description: >-
  Prices per kilogram, main ingredients and nutrition of almost 2,600 meat and milk substitutes, and prices of about
  7,500 conventional meat and milk products, collected from the web shops of 13 major supermarket chains in France,
  Germany, Italy, the Netherlands, Spain and the United Kingdom in August and September 2023. For meat, the price
  ratio of substitutes to conventional products is averaged within each product category and weighted by the number
  of substitutes in each category, by country.
