  licence_quote: >-
    Unless specified otherwise in their metadata or webpage, all datasets disseminated through FAO corporate statistical
    databases (see examples in Annex 1) are licensed under the Creative Commons Attribution-4.0 International licence
    (CC BY 4.0)
  checked_on: 2026-10-04
  terms_check: page
obligations:
  attribution: >-
    FAO. {year}. FAOSTAT. Accessed on {date_accessed_long}. https://www.fao.org/faostat/en/#data Licence: CC-BY-4.0.
  attribution_modified: >-
    Calculated by Environment Dashboard from FAO. {year}. FAOSTAT. Accessed on {date_accessed_long}.
    https://www.fao.org/faostat/en/#data Licence: CC-BY-4.0.
  mirror_raw: true
  no_logo: true
  no_endorsement: true
acquisition: automatic
artifacts:
  - id: emissions-totals
    url: https://bulks-faostat.fao.org/production/Emissions_Totals_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      Climate Change: Agrifood systems emissions: Emissions totals (GT). Zipped normalized CSV (latin-1): Area, Item,
      Element, Year, Source, Unit, Value, Flag. Elements include "Emissions (CO2eq) (AR5)" in kt. Rows run 1961-2023
      plus projection years 2030 and 2050, which are not published.
  - id: emissions-livestock
    url: https://bulks-faostat.fao.org/production/Emissions_livestock_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      Climate Change: Agrifood systems emissions: Emissions from Livestock (GLE). Zipped normalized CSV (latin-1) of
      CH4 and N2O from enteric fermentation and manure (management, left on pasture, applied to soils) by species, with
      livestock numbers, Tier 1.
  - id: emissions-intensities
    url: https://bulks-faostat.fao.org/production/Environment_Emissions_intensities_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      Climate Change: Agrifood systems emissions: Emissions intensities (EI). Zipped normalized CSV: Area, Item Code,
      Item Code (CPC), Item, Element, Year, Unit, Value, Flag (no Source column). Elements 723113 "Emissions (CO2eq)
      (AR5)" in kt, 71761 "Emissions intensity" in kg CO2eq/kg of product and 5510 "Production" in t, for 14
      commodities, 1961-2023. Farm-gate emissions only: enteric CH4, manure management CH4 and N2O, N2O from manure
      left on pasture and applied to soils, and N2O from crop residues, their burning and synthetic fertiliser
      allocated to crops, plus rice paddy CH4; no on-farm energy, drained organic soils, savanna fires, land-use change
      or pre- and post-production. Methodological note: https://files-faostat.fao.org/production/EI/EI_e.pdf (release
      October 2025), which says the values should not be compared with life-cycle assessments.
  - id: land-use
    url: https://bulks-faostat.fao.org/production/Inputs_LandUse_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      Land, Inputs and Sustainability: Land Use (RL). Zipped normalized CSV (latin-1) of land-use areas in 1000 ha and
      shares, 1961-2024; forest land to 2025 is taken by FAO from FRA 2025.
  - id: sdg-indicators
    url: https://bulks-faostat.fao.org/production/SDG_BulkDownloads_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      SDG Indicators (SDGB). Zipped normalized CSV (latin-1) of all SDG series under FAO custodianship; we use item
      codes 24044 (12.3.1a food loss percentage, %) and 24045 (12.3.1a Global Food Loss Index), total and by commodity
      group, 2015-2024.
  - id: datasets-catalogue
    url: https://bulks-faostat.fao.org/production/datasets_E.json
    format: json
    description: >-
      FAOSTAT bulk-download catalogue: DatasetCode, DatasetName, DateUpdate, FileSize and FileLocation for every
      domain. Supplies {year} (DateUpdate) for the citation.
    max_bytes: 5000000
status:
  state: active
  note: >-
    Updated on FAO's annual cycle: Land Use on 2 October 2026 and SDG indicators on 29 September 2026; the emissions
    domains (GT, GLE) were last updated 28 October 2025 with data to 2023. FAO is not on the January 2026 US withdrawal
    memorandum (FR Doc 2026-00976); UNFCCC is, which concerns the "UNFCCC" source rows in GT.
  us_federal: false
update_cadence: >-
  Annual per domain; emissions domains each October-November, Land Use and SDG indicators around late September.
  DateUpdate in datasets_E.json changes with each release, but zips are sometimes re-uploaded later.
next_release:
  expected: 2026-10-31
  note: >-
    FAO's 2026 release calendar lists FAOSTAT Emissions totals and Emissions from Livestock (data to 2024) under
    October 2026 without a day; 31 October is the end of that window.
  url: https://www.fao.org/statistics/data-releases/upcoming-data-releases/en
twins: []
