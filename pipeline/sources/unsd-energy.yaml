  # application/vnd.sdmx.data+csv, no ETag or Last-Modified. Two pulls the same day were byte-identical
  # (sha256 7b119cab50a0346660a4b2ff6355bc25364a8d7fb7645857c8f832b3d2b049bb).
  - id: total-energy-supply-by-commodity
    url: https://data.un.org/ws/rest/data/UNSD,DF_UNDATA_ENERGY,1.2/A...GA/ALL/?format=csv
    format: csv
    description: >-
      Transaction GA (total energy supply) for every commodity, country and year: 147,557 rows with columns
      DATAFLOW, FREQ, REF_AREA, COMMODITY, TRANSACTION, TIME_PERIOD, OBS_VALUE, UNIT_MULT, UNIT_MEASURE, OBS_STATUS,
      CONVERSION_FACTOR.
    access:
      conditional: false
  # GET on 2026-10-04: 302 to the /legacy/ws/ path, then 200, 2,083,372 bytes, no ETag or Last-Modified
  # (sha256 729bf4faf8681567d63f31ba03d83573a94b31f2f05d924157b4ee3e1bb16764).
  - id: electricity-production-by-source
    url: https://data.un.org/ws/rest/data/UNSD,DF_UNDATA_ENERGY,1.2/A..7000+7000N+7000H+7000W+7000S+7000G+7000O+7000T.01/ALL/?format=csv
    format: csv
    description: >-
      Transaction 01 (production) of total, nuclear, hydro, wind, solar, geothermal, tide-wave-ocean and thermal
      electricity, in gigawatt-hours (28,514 rows).
    access:
      conditional: false
status:
