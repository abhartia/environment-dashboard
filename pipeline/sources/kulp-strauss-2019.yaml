# Kulp & Strauss (2019), Nature Communications 10: 4844: people living on land below the local high-tide line and
# below the local once-a-year coastal flood level, today and with the sea levels projected for 2050 and 2100, from the
# CoastalDEM elevation model (Supplementary Data 1).
# Evidence: docs/research/sources-consequences-2026-10-11.json (coasts, rank 1, verdict confirmed) and the critic's
# note that the coastal pairing should lead with this source rather than Lancet 2.3.3.
# Checked 2026-10-12:
#   - The article PDF on nature.com answered a scripted GET (303 to idp.nature.com, which sets a cookie and returns to
#     the PDF; final HTTP 200, application/pdf, 3,903,782 bytes, sha256
#     912692e7c7a388dfb735f5ec9b1dca5bd6d42b40ed11c88014594ba6b0dd6d3f, ETag "1745469cbb491e63418a5c0bd7b7bac7",
#     Last-Modified Mon, 04 Dec 2023 17:29:36 GMT), identical on two downloads. Page 1 is marked "Corrected: Author
#     correction"; the licence quoted below is on page 12. Europe PMC's full text (PMC6820795) carries the same licence
#     paragraph, and Crossref lists CC BY 4.0 for the version of record (vor and tdm, from 2019-10-29).
#   - Supplementary Data 1 (MOESM4_ESM.csv), as linked from the article page: HTTP 200, 253,535 bytes, sha256
#     37a6ab2fc25ec632f8dc7485346d0389d953754b591d6b015c45b5d6de4c0b81, ETag "8bda3a8ece191add7cff689b5d2893be",
#     Last-Modified Mon, 04 Dec 2023 17:29:34 GMT; it answers If-None-Match and If-Modified-Since with 304. The copy on
#     static-content.springer.com has the same bytes. 1,769 lines: a header and 13 sea levels (present day, then K14
#     and K17 under RCP2.6, 4.5 and 8.5 for 2050 and 2100) for each of 136 places (World, the small island developing
#     states together, and 134 countries), each with the 5th, 50th and 95th percentile for four elevation models.
#   - The descriptions of the supplementary files (MOESM3_ESM.pdf): HTTP 200, 65,044 bytes, sha256
#     2b98673da602184f06aa3d86a939ea6b977dfb847181cf979472349695a1a771, same Last-Modified.
#   - citation.text is the article page's "Cite this article" line, verbatim.
# The supplementary files carry no licence of their own, so the article's CC BY 4.0 covers them (Springer Nature
# practice; the data availability statement says the national exposure analyses "are available within this article
# and its supplementary information files"). The CoastalDEM elevation grid itself is a separate product: the same
# statement says it "is available at no cost from Climate Central for non-commercial research use". The grid is not
# registered, fetched or re-hosted here; only the article's own tables of people are used, so mirror_raw is true.
# Author Correction (doi:10.1038/s41467-019-13552-0, 12 December 2019): a code error fixed during peer review had
# left superseded numbers in the text. It changed text numbers (abstract: 230 M, not 250 M, below 1 m; 94 M, not 95 M;
# China 18-32%, not 15-28%; 7-20 M, not 10-25 M; 19 other countries, not 20) and one cell of Table 1 (K17, RCP8.5,
# annual flood, 2100: 480 (380-630), not 500 (390-640)), and says "The Supplementary Data were generated
# automatically during analysis and so were not affected." The publisher's PDF registered here is the corrected one;
# the transform refuses a PDF that still prints the superseded Table 1 cell.
# Not used: the SRTM, JAXA (AW3D30) and MERIT columns (the paper's point is that they understate exposure), the SIDS
# rows (the authors' own group, not a country), and Supplementary Data 2-5. The 134 country rows are used from
# 2026-10-12, their Place names mapped to entities by the alias table in envdash/geo.py (SOURCE_SCHEMES).
id: kulp-strauss-2019
title: People on land exposed to sea-level rise and coastal flooding (Kulp & Strauss 2019)
publisher: >-
  Scott A. Kulp and Benjamin H. Strauss (Climate Central); published in Nature Communications (Springer Nature)
landing_url: https://doi.org/10.1038/s41467-019-12808-z
description: >-
  Estimates of how many people live on land below the local high-tide line (mean higher-high water) and below the
  local once-a-year coastal flood level, at today's sea level and with the sea levels projected for 2050 and 2100
  under three emissions scenarios (RCP2.6, 4.5 and 8.5) by two sets of projections (Kopp et al. 2014 and 2017), for
  the world, the small island developing states and 134 countries. Elevations come from CoastalDEM, a correction of
  NASA's SRTM made with a neural network; people are counted where they lived in 2010 (LandScan). Coastal defences
  are not considered, so the figures measure exposure, not flooding.
