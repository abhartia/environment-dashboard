[extend]
useDefault = true

[allowlist]
description = "Public identifiers and checksums"
paths = [
  # The IndexNow key is public by design (served at /<key>.txt).
  '''web/public/[0-9a-f]{32}\.txt''',
  # sha256 digests of public data files, not secrets.
  '''data/SHA256SUMS''',
  '''pipeline/manifests/.*''',
]
# Indicator ids (quantity.source.variant, e.g. emissions.gcp-2025.fossil-co2-per-capita) are public names; a
# constant such as PER_CAPITA trips the generic-api-key rule on the "API" inside "CAPITA".
regexes = [
  '''^[a-z0-9-]+(\.[a-z0-9-]+){1,3}$''',
]
regexTarget = "secret"
