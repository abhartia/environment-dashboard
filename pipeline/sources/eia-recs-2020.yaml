id: eia-recs-2020
title: Residential Energy Consumption Survey 2020, household consumption (Table CE2.1)
publisher: U.S. Energy Information Administration
landing_url: https://www.eia.gov/consumption/residential/data/2020/index.php?view=consumption
description: >-
  Annual site energy consumption of US homes in 2020 by fuel, in physical units and in Btu, for all homes and by
  region, housing type, income and other characteristics: the number of housing units, total consumption, and average
  consumption per household using each fuel. For electricity, every home uses it, so the average is per home: about
  10,600 kilowatt-hours in 2020 for all 123.5 million primary occupied homes in the 50 states and the District of
  Columbia. Electricity from a home's own solar panels is included. The estimates come from a sample survey of
  households and their energy suppliers' bills for calendar year 2020; EIA publishes a relative standard error for
  each value.
