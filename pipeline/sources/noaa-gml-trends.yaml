  checked_on: 2026-10-04
  terms_check: page
obligations:
  attribution: >-
    NOAA Global Monitoring Laboratory (Lan, Tans & Thoning), version {version}, doi:10.15138/9N0H-ZH07. Mauna Loa
    data March 1958 to April 1974: C. David Keeling, Scripps Institution of Oceanography.
  attribution_modified: >-
    Calculated by Environment Dashboard from NOAA Global Monitoring Laboratory data (Lan, Tans & Thoning), version
    {version}, doi:10.15138/9N0H-ZH07. Mauna Loa data March 1958 to April 1974: C. David Keeling, Scripps Institution
    of Oceanography. Not official NOAA material.
  notice: >-
    The NOAA Global Monitoring Laboratory greenhouse gas trend values (Mauna Loa carbon dioxide from May 1974, and
    the global marine surface means) are US Government material and are not subject to copyright protection in the
    United States.
  no_endorsement: true
  mirror_raw: true
acquisition: automatic
artifacts:
  - id: co2-mm-mlo
    url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_mlo.csv
    format: csv
    description: Monthly mean CO2 at Mauna Loa, from March 1958 (ppm).
  - id: co2-annmean-mlo
    url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_annmean_mlo.csv
    format: csv
    description: Annual mean CO2 at Mauna Loa, from 1959 (ppm).
  - id: co2-annmean-gl
    url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_annmean_gl.csv
    format: csv
    description: Annual mean CO2 averaged over global marine surface sites, from 1979 (ppm).
  - id: co2-mm-gl
    url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_gl.csv
    format: csv
    description: Monthly mean CO2 averaged over global marine surface sites, from 1979 (ppm).
  - id: co2-gr-gl
    url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_gr_gl.csv
    format: csv
    description: Annual CO2 increase from January 1 to December 31, global marine surface sites (ppm per year).
  - id: ch4-annmean-gl
    url: https://gml.noaa.gov/webdata/ccgg/trends/ch4/ch4_annmean_gl.csv
    format: csv
    description: Annual mean methane averaged over global marine surface sites, from 1984 (ppb).
  - id: n2o-annmean-gl
    url: https://gml.noaa.gov/webdata/ccgg/trends/n2o/n2o_annmean_gl.csv
    format: csv
    description: Annual mean nitrous oxide averaged over global marine surface sites, from 2001 (ppb).
status:
  state: at-risk
  note: >-
    Still publishing monthly (the August 2026 value appeared on 5 September 2026). The FY2026 and FY2027 US budget
    requests proposed closing NOAA's research labs, including GML and Mauna Loa Observatory; Congress rejected the
    FY2026 closure. Mauna Loa has had no mains power since the 2022 eruption.
  us_federal: true
update_cadence: Monthly, around the 5th of the month
next_release:
  expected: 2026-10-05
  note: September 2026 monthly values.
twins: [scripps-co2]
research_ref: docs/research/sources-atmosphere-and-temperature.json#NOAA GML Trends in Atmospheric Carbon Dioxide
