# Eurostat (European Commission): energy and R&D budget statistics from the dissemination API (JSON-stat 2.0).
# Evidence: docs/research/sources-zero-levers-and-adaptation-2026-10-08.json, candidates "2. Electrify everything"
# (item "Eurostat share of fuels in final energy consumption (nrg_ind_fecf), electricity") and "4. Innovation" (item
# "Eurostat GBARD by socioeconomic objectives (gba_nabsfin07), NABS05 Energy").
# Licence, read 2026-10-08 from the copyright notice (terms_url, GET 200 to the pipeline's client):
#   - "Reuse of statistical data, metadata, publications, and other dissemination tools published on this website
#     for commercial or non-commercial purposes is authorised provided the source is acknowledged. The reuse policy of
#     the European Commission is implemented by the Decision of 12 December 2011." (Commission Decision 2011/833/EU).
#   - Its exceptions: "The following Eurostat data and documents may not be reused for commercial purposes, but
#     non-commercial reuse is possible without restriction: Data identified as belonging to sources other than
#     Eurostat. ... Data for countries other than: Member States of the European Union (EU) Member States of the
#     European Free Trade Association (EFTA) official EU acceding and candidate countries. Examples are data for the
#     United States of America, Japan or China."
#   - "When reuse involves translations of publications or modifications to the data or text, this must be stated
#     clearly to the end user of the information. A disclaimer regarding the non-responsibility of Eurostat shall be
#     included." (notice below).
#   - How to cite a customised dataset: "Source: [Eurostat dataset datacode link], [access date]".
# So that the class can be open, each query asks only for the EU27_2020 aggregate, the 27 member states, the four EFTA
# states and the nine official candidate countries listed on Eurostat's glossary page (artifact candidate-countries,
# read 2026-10-08: "At present there are nine official candidate countries": BA, ME, MD, MK, GE, AL, RS, TR, UA). The
# full datasets also hold the United Kingdom, Kosovo, Russia, the United States, Japan and South Korea, which are
# noncommercial under the exception and are not requested. The transforms stop on any other geo code, and re-read the
# glossary page at every build. gba_nabsfin07 names "Eurostat; Organisation for Economic Cooperation and Development
# (OECD)" as source institutions: the OECD collects the non-EU countries' GBARD, which are among those not requested.
# The API answers without ETag or Last-Modified; the JSON carries "updated" (date of the data) and the dataset's DOI.
id: eurostat
title: Eurostat energy and R&D budget statistics
publisher: Eurostat (European Commission)
landing_url: https://ec.europa.eu/eurostat/web/main/data/database
description: >-
  Two Eurostat datasets, as published, for the EU and the European countries whose data Eurostat licenses for any
  reuse. nrg_ind_fecf: the share of each fuel in final energy consumption (energy use only, excluding non-energy use
  of fuels); here electricity (SIEC E7000), 1990 onwards, a ratio Eurostat computes from its energy balances.
  gba_nabsfin07: government budget allocations for R&D (GBARD) by socio-economic objective (NABS 2007); here the
  objective Energy (NABS05), in million euro at current prices, 2004 onwards. Energy is a socio-economic objective
  covering every form of energy, so it includes research on fossil fuels and nuclear power as well as renewables and
  efficiency: it is all energy R&D in government budgets, not clean-energy research alone. Eurostat's flags
  (estimated, provisional, break in series, definition differs, confidential) are kept.
