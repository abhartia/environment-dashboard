artifacts:
  - id: estimates-eu
    url: https://api2.effis.emergency.copernicus.eu/statistics/v2/effis/estimatesbycountry?country=EU
    format: json
    description: >-
      EU-27 total, one object per year from 2006: year, ba (hectares burnt), nf (number of fires mapped). The last year
      is the current year to date.
    access:
      conditional: false
  - id: estimates-non-eu
    url: https://api2.effis.emergency.copernicus.eu/statistics/v2/effis/estimatesbycountry?country=Non_EU
    format: json
    description: >-
      Total for the 12 European countries outside the EU that EFFIS covers (ALB, AND, BIH, XKO, MNE, MKD, NOR, SRB,
      CHE, TUR, UKR, GBR), same structure as estimates-eu.
    access:
      conditional: false
  - id: overview-2025-europe
    url: https://api2.effis.emergency.copernicus.eu/statistics/v2/effis/estimatesoverview?countries=AUT,BEL,BGR,HRV,CYP,CZE,DNK,EST,FIN,FRA,DEU,GRC,HUN,IRL,ITA,LVA,LTU,LUX,MLT,NLD,POL,PRT,ROU,SVK,SVN,ESP,SWE,ALB,AND,BIH,XKO,MNE,MKD,NOR,SRB,CHE,TUR,UKR,GBR&year=2025&yearFrom=2006&yearTo=2024&firesize=30
    format: json
    description: >-
      One object per country for the 39 countries above: ba and nf in 2025, ba_avg and nf_avg over 2006-2024, the
      same as percentages of the country's area (ba_p, ba_avg_p), area_ha and min_year. A null ba means EFFIS shows
      no value for that country.
    access:
      conditional: false
  - id: advance-report-2025
    url: https://op.europa.eu/o/opportal-service/download-handler?identifier=15c8033e-2c3e-11f1-906d-01aa75ed71a1&format=pdf&language=en&productionSystem=cellar&part=
    format: pdf
    description: >-
      Advance report on forest fires in Europe, Middle East and North Africa 2025 (JRC146199, EUR 40665, 75 pages),
      for statements quoted with their page.
    access:
      conditional: false
status:
  state: active
  note: >-
    EFFIS is the European Commission's fire information service under Copernicus. The full 2025 report with national
    statistics from the EFFIS country network is due in the last quarter of 2026; the year in the overview URL must be
    moved on by hand. Not a US federal product.
  us_federal: false
update_cadence: >-
  Continuous during the fire season; an advance report on the past season early in the year and the full report in
  the last quarter
