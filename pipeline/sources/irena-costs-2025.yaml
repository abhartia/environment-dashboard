# IRENA Renewable Power Generation Costs in 2025 (published July 2026): the report's data file.
# Evidence: docs/research/sources-energy.json ("IRENA – Renewable Power Generation Costs in 2025"), re-checked
# 2026-10-04. irena.org HTML pages return 403 to scripts; files under /-/media/ return 200.
# Licence: page 2 of the executive summary PDF (terms_url), read 2026-10-04. It continues: "Material in this
# publication that is attributed to third parties may be subject to separate terms of use and restrictions, and
# appropriate permissions from these third parties may need to be secured before any use of such material." In the
# data file, sheets "Fig. 9.5" and "Fig. 9.7" (energy storage costs) are labelled "Based on BNEF data": they are never
# ingested, and for that reason the unmodified workbook is not mirrored.
# citation.text is verbatim from both the PDF and the workbook's Contents sheet ("This data should be cited as: ...").
id: irena-costs-2025
title: Renewable power generation costs in 2025
publisher: International Renewable Energy Agency (IRENA)
landing_url: https://www.irena.org/Publications/2026/Jul/Renewable-Power-Generation-Costs-in-2025
description: >-
  Global and country levelised cost of electricity (LCOE), total installed costs, capacity factors and auction
  prices for solar PV, onshore and offshore wind, concentrated solar, hydropower, geothermal and bioenergy, mostly
  2010 to 2025, in real 2025 US dollars. The workbook has one sheet per report figure or table ("Fig 1.1",
  "Table 2.1", ...), not a tidy table, and its layout changes each edition, so each sheet is parsed by a transform
  written for this vintage and checked against the report. Headline values from the executive summary: solar PV
  LCOE USD 44 per MWh in 2025 (unchanged from 2024), onshore wind USD 33, offshore wind USD 78, solar down 89%
  since 2010. Global weighted averages hide wide differences between countries, and LCOE excludes system
  integration costs.
