status:
  state: active
  note: >-
    In situ file updated in September 2026 (data through 19 September 2026); the flask delta-13C file still carries
    the archive of 6 June 2025 (data through December 2024). The programme is privately funded: "Scripps CO2
    measurements at Mauna Loa are currently supported by Schmidt Sciences with supplemental support from Earth
    Networks" (keelingcurve.ucsd.edu, 2026-10-04). It samples at NOAA's Mauna Loa Observatory, which the FY2026 and
    FY2027 US budget requests proposed closing with the rest of NOAA's research labs.
