# FAOSTAT (FAO Statistics Division): agrifood-system emissions (GT), livestock emissions (GLE), land use (RL) and the
# SDG 12.3.1a food loss series (SDGB domain).
# Evidence: docs/research/sources-food-land-nature.json ("FAOSTAT Climate Change: Agrifood systems emissions",
# "FAOSTAT Land Use (RL)", "FAOSTAT SDG Indicators - 12.3.1a Food Loss Percentage") and
# docs/research/sources-emissions.json ("FAOSTAT Climate Change: Agrifood systems emissions"); every verdict
# "confirmed", final_redistribution open-attribution.
# Terms checked 2026-10-04: the FAO Statistical Database Terms of Use page answers HTTP 200 and carries the CC BY 4.0
# sentence quoted below, the citation format, the no-endorsement clause and Annex 1 naming FAOSTAT. The terms
# incorporate FAO's "Terms and Conditions regarding the Reuse of Web content" (https://www.fao.org/contact-us/terms/en/,
# HTTP 200), which say the FAO logo "is prohibited without prior permission"; hence no_logo.
# Additional terms we meet: no use "in conjunction with the promotion of a commercial enterprise", no implied FAO
# endorsement, no misrepresentation. The citation's date is "D Month YYYY" (e.g. 4 October 2026): the
# {date_accessed_long} placeholder renders it.
# Conflict noted, not adopted: the GT methodological note (files-faostat.fao.org/production/GT/GT_en.pdf, release
# October 2023, Last-Modified 2025-09-18) ends with boilerplate "This work is made available under the Creative
# Commons Attribution-NonCommercial-ShareAlike 3.0 IGO license". That refers to the note itself; its "Copyright" row
# says FAOSTAT is in scope of the FAO Open Data Licensing Policy governed by the db-terms-of-use page (CC BY 4.0).
# Third-party content in GT (from that note): "UNFCCC" source rows are country inventory submissions disseminated
# "with permission, formalized via a FAO-UNFCCC Memorandum of Understanding"; pre/post-production estimates use UNSD
# and IEA activity data. No dataset-specific restriction is stated in the metadata. We use "FAO TIER 1" rows; never mix
# them with "UNFCCC" rows. The note names PRIMAP-hist v2.4 (CC BY 4.0) for GT's energy, IPPU, waste and other items,
# but the October 2025 values of those items are PRIMAP-hist v2.7 (CC BY-NC-SA 4.0): see
# pipeline/sources/faostat-all-sectors.yaml, which registers them and the all-sector totals as noncommercial, and the
# version evidence in docs/research/sources-ghg-food-personal-2026-10-05.json. This open entry does not publish them.
# Artifacts checked 2026-10-04 (HEAD): GT 200, 20,501,708 bytes, Last-Modified 2025-12-06 (catalogue DateUpdate
# 2025-10-28: the zip was re-uploaded after its DateUpdate, so the date alone does not identify the bytes; the GT
# transform takes DateUpdate as the vintage only after checking that the catalogue entry's FileLocation is this zip's
# URL and its FileRows equal the CSV's data rows, and stops otherwise); GLE 200, 55,881,712
# bytes, Last-Modified 2025-10-29; RL 200, 2,970,716 bytes, Last-Modified 2026-10-02; SDGB 200, 4,721,843 bytes,
# Last-Modified 2026-09-29 (contains items 24044 "12.3.1a Food loss percentage" and 24045 "12.3.1a Global food loss
# index", total and four commodity groups); datasets_E.json 200, 109,120 bytes. All serve ETag and Last-Modified.
# FAO's 2026 release calendar lists FAOSTAT "Emissions totals" and "Emissions from Livestock" under October 2026,
# without a day.
# Emissions intensities (EI), added 2026-10-05 (docs/research/sources-ghg-food-personal-2026-10-05.json, need B,
# candidate 2, verdict adopt-with-changes): HEAD 200, 3,640,396 bytes, Last-Modified Fri, 20 Feb 2026 15:00:03 GMT,
# ETag "35b5bf70d1fa8cf6d73beff11a963236"; catalogue DatasetCode EI, DateUpdate 2026-02-20, FileRows 409,511. Its
# methodological note (https://files-faostat.fao.org/production/EI/EI_e.pdf, "release October 2025", 338,957 bytes,
# read 2026-10-05) gives "Owner FAO Provider FAO Source FAO" and no licence or restriction of its own, so the database
# terms quoted below apply. Its inputs are FAOSTAT's own Emissions from crops (GCE), Emissions from livestock (GLE) and
# Production (QCL) only. The note says EI counts only emissions "generated within the farm gate", excludes upstream
# and downstream emissions, and "should not be compared" with life-cycle (LCA) values.
# Third-party inputs in GT that FAO's metadata names without restricting them (verifier, 2026-10-05): the GPP note
# (GPP_e.pdf) says pre- and post-production energy emissions use IEA data (for China and Russia) and IEA grid
# electricity emission factors (to 2022), and that cold-chain F-gases come from EDGAR v7; the GN note says on-farm
# energy use applies IEA grid electricity and heat factors and IEA fisheries energy data. FAO states no restriction for
# them, so the class stays open under FAO's own clause; docs/sources.md treats EDGAR's IEA-derived CO2 as restricted,
# so permission to redistribute these GT items should be confirmed with FAO (open question, not yet asked: the owner
# is to ask faostat@fao.org; see docs/runbook.md).
id: faostat
title: FAOSTAT agrifood emissions, livestock emissions, emissions intensities, land use and food loss
publisher: Food and Agriculture Organization of the United Nations (FAO), Statistics Division
landing_url: https://www.fao.org/faostat/en/
description: >-
  Five FAOSTAT domains. Emissions totals (GT): CO2, CH4, N2O and CO2-equivalent (AR5 GWP100) emissions in kilotonnes
  for agrifood systems (farm gate, land-use change, pre- and post-production) and for all IPCC sectors, by country and
  region, 1961-2023, with two sources per value ("FAO TIER 1" estimates and "UNFCCC" country submissions) and projection
  rows for 2030 and 2050 in the same file. Emissions from livestock (GLE): enteric fermentation and manure emissions by
  species, Tier 1. Emissions intensities (EI): farm-gate emissions (kt CO2eq, AR5) and emissions per kg of product
  for 14 commodities (meat and milk of cattle, buffalo, sheep and goats, pig and chicken meat, camel milk, hen eggs,
  rice and cereals excluding rice), 1961-2023. Land use (RL): agricultural land, cropland, permanent meadows and pastures, forest land (from FRA)
  and land area in 1000 ha, 1961-2024 (forest land to 2025). SDG indicators (SDGB): 12.3.1a food loss percentage
  (share of food lost from post-harvest up to, but not including, retail, weighted by economic value) and the Global
  Food Loss Index (2015 = 100), total and by commodity group, 2015-2024.
citation:
  type: dataset
  title: FAOSTAT
  author:
    - {literal: FAO}
  issued: "{year}"
  publisher: Food and Agriculture Organization of the United Nations
  URL: https://www.fao.org/faostat/en/
  # Format prescribed by the FAO Statistical Database Terms of Use, section 3, at database level ("Name of database").
  # {year} is the year of the dataset's last update (DateUpdate in datasets_E.json).
  text: >-
    FAO. {year}. FAOSTAT. Accessed on {date_accessed_long}. https://www.fao.org/faostat/en/#data Licence: CC-BY-4.0.
licence_class: open
licence:
