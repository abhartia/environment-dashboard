#     10.1038/s41586-025-08907-1. Crossref lists CC BY 4.0 for the version of record ("vor") from 2025-05-07 and no
#     correction (no update-to).
#   - nature.com answers scripts with a cookie handshake (HTTP 303 to idp.nature.com), so it is not the terms_url. With
#     cookies it serves the same text: its "Rights and permissions" section repeats the licence below, and its abstract
#     and Results sentences are those the transform checks.
#   - Third-party clause, from the same licence text: "The images or other third party material in this article are
#     included in the article’s Creative Commons licence, unless indicated otherwise in a credit line to the material."
#     Only sentences of the text are used, no figure or map.
#   - The values are the authors' own results (stated in the Results text and the abstract), computed from ISIMIP2b
#     simulations, Wittgenstein Centre cohort sizes, UN World Population Prospects life expectancy and AR6 Scenario
#     Explorer warming trajectories, all listed under Data availability; none is restricted.
#   - Not registered: the Supplementary Information PDF (41586_2025_8907_MOESM1_ESM.pdf on static-content.springer.com:
#     HTTP 200 application/pdf, 40,335,469 bytes, sha256
#     85c029406384526b7ddda7a4d6614b20d38501b18abd2c069865f6aa2014a3ca, Last-Modified Mon, 28 Apr 2025 09:19:11 GMT).
#     It has no licence line of its own and inherits the article's. Its Supplementary Tables 1-18 give each country's
#     cohort in thousands and as a share, per birth year (every ten years) and pathway (1.5, 2.5 and 3.5 °C), with no
#     world row. They are not used in this round: per-country views are not planned, and some cells need the authors'
#     reading first (Comoros, Cape Verde and Hong Kong print "0 (0)" for 2010 and 2020 after non-zero shares).
#   - Not used: the code (github.com/VUB-HYDR/2025_Grant_etal_Nature; the GitHub API reports no licence although the
