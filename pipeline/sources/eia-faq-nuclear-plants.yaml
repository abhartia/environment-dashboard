# US Energy Information Administration, Frequently Asked Question 207: "How many nuclear power plants are in the
# United States, and where are they located?" The FAQ states the capacity of the largest US nuclear power plant,
# Vogtle in Georgia, which the site uses as one named large power station on its power scale.
# Evidence: docs/research/sources-zero-space-and-power-2026-10-08.json (question b, rank 5).
# Licence: EIA "Copyrights and Reuse" page, as for eia-international.
# Checked 2026-10-08: GET 200 (text/html, 54,224 bytes); a HEAD request gets an Akamai 503, as for eia-international,
# so the artifact is read with GET only. The page's "Other FAQs" sidebar is shuffled on every request (two GETs a
# minute apart differ only there), so most weekly fetches record a new snapshot with the same FAQ text. The transform
# quotes the FAQ's own sentences, so a change to the stated capacity fails the build rather than passing silently.
# Why the FAQ and not Form EIA-860: EIA-860 lists Vogtle's four generators separately; a plant total would be our sum.
# The FAQ is EIA's own statement of the plant's capacity, as of the month it names. The page shows no publication
# date, so citation.text (EIA's acknowledgement form) carries the answer's own date ("As of March 2026").
