# UNEP Emissions Gap Report 2025: Off target (16th edition, November 2025). Quoted statements and the numbers in them.
# Evidence: docs/research/sources-solutions-and-action.json ("UNEP Emissions Gap Report 2025: 'Off Target'"; verdict
# "confirmed" but final_redistribution "unclear" because the imprint could not be read) and
# docs/research/sources-impacts.json ("UNEP Emissions Gap Report 2025: Off Target"; noncommercial-only from a search
# snippet).
# Checked 2026-10-04:
#   - wedocs.unep.org (the PDF and its handle page), www.unep.org and doi.org's target all return a Cloudflare 403 to
#     scripts. unepccc.org/publications/emissions-gap-report-2025/ (200) links the same wedocs PDF. Hence
#     terms_check manual and a manual artifact with no URL.
#   - The imprint (PDF p. 2) was read from the Internet Archive's capture of the wedocs PDF URL
#     (web.archive.org/web/20251116042014/https://wedocs.unep.org/bitstream/handle/20.500.11822/48854/EGR2025.pdf):
#     4,115,807 bytes, sha256 d5364c4761df1a88a39b942a982e24c6bfe205ad49ff3ed8b2af7a728992ff30, 76 pages, PDF created
#     4 November 2025. It carries "© 2025 United Nations Environment Programme", the quote below, and: "No use of this
#     publication may be made for resale or any other commercial purpose whatsoever without prior permission in
#     writing from the United Nations Environment Programme." It also says "The use of information from this document
#     for publicity or advertising is not permitted."
#   - Class display-only, as the plan assigns. The imprint permits reproduction only "for educational or non-profit
#     services", a narrower condition than non-commercial, and is the same standard UNEP notice the plan treats as
#     noncommercial for UNEP's Food Waste Index; the owner should settle one class for both. Until then the values
#     are quoted with page references, never downloaded or mirrored.
#   - citation.text: the "Suggested citation" on PDF p. 2 (the extracted text breaks the DOI as "20.500.11 822"; the
#     DOI is 10.59117/20.500.11822/48854, confirmed by Crossref: issued 2025-11, ISBN 9789280742398).
#   - No 2026 edition yet: unepccc.org/publications/emissions-gap-report-2026/ returns 404.
id: unep-egr-2025
title: "Emissions Gap Report 2025: Off target"
publisher: United Nations Environment Programme (UNEP)
landing_url: https://doi.org/10.59117/20.500.11822/48854
description: >-
  UNEP's sixteenth annual assessment of the gap between where global greenhouse gas emissions are heading and where
  they need to be to limit warming to 1.5 °C or 2 °C. It projects warming this century under current policies and
  under full implementation of national pledges, and states the cuts needed by 2030 and 2035 compared with 2019. Only
  short quoted statements and the numbers in them are shown, each with its page; the report's figures are never
  reproduced. Its emissions totals include land use, land-use change and forestry, unlike fossil-only totals.
