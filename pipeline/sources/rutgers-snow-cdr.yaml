# NOAA Climate Data Record of Northern Hemisphere snow cover extent (Rutgers Global Snow Lab for the NOAA CDR
# Program), weekly grids from October 1966, taken as the NetCDF that NCEI distributes.
# Evidence: docs/research/sources-ocean-and-ice.json ("Northern Hemisphere Snow Cover Extent CDR (Rutgers Global Snow
# Lab / NOAA NCEI)"); verifier verdict "confirmed", with the caveat that the "no restrictions" policy covers the NCEI
# CDR only: the Rutgers moncov.*.txt tables are Rutgers derivatives with no stated licence, so they are not used here
# (docs/research/plan-critique-2026-10-04.txt makes the same point).
# Licence evidence checked 2026-10-04: the CDR use agreement UseAgreement_01B-12.pdf (HTTP 200, 22,053 bytes) states
# the open data policy quoted below and gives acknowledgement and citation "examples" that it encourages rather than
# requires. The NetCDF's own global attribute reads license = "No restrictions on access or use". The NCEI record
# gov.noaa.ncdc:C00756 (where doi:10.7289/V5N014G9 resolves) lists update frequency "Monthly", the citation below and
# a liability disclaimer. The data are made by Rutgers University for NOAA, so the licence is the CDR policy rather
# than US-government public domain.
# Artifact checked 2026-10-04: nhsce_v01r01_19661004_20260831.nc, HTTP 200, 24,602,081 bytes, ETag
# "17765e1-65ab083eec103", Last-Modified 4 Sep 2026, answers If-None-Match with 304; date_created 2026-09-03T19:36:11Z,
# time_coverage 1966-10-04 to 2026-08-31, 3,126 weekly maps on an 88 x 88 grid, product_version v01r01.
# The file name carries the last week's date and NCEI keeps only the newest file: the access directory and the THREDDS
# catalogue (cdr/snowcover) list just this one, earlier names such as nhsce_v01r01_19661004_20260731.nc answer HTTP
# 404, and no "latest" alias exists. The AWS Open Data copy (noaa-cdr-snow-cover-ext-north-pds) stops at
# nhsce_v01r01_19661004_20210405.nc. So the file is found through `discover`: each fetch reads the access directory
# index and takes the nhsce_v01r01_19661004_<end date>.nc with the latest end date (envdash/discovery.py), and the
# snapshot manifest records the exact URL; on 2026-10-04 it resolved to the 20260831 file above.
# citation.text: the NCEI "Cite as" text, with "[indicate subset used]" filled and "[access date]" as {date_accessed}.
# The file's references attribute points to Estilow, Young and Robinson (2015), doi:10.5194/essd-7-137-2015.
id: rutgers-snow-cdr
title: Northern Hemisphere snow cover extent climate data record
publisher: NOAA National Centers for Environmental Information (data by the Rutgers University Global Snow Lab)
landing_url: https://www.ncei.noaa.gov/products/climate-data-records/snow-cover-extent
description: >-
  Weekly maps of snow cover over Northern Hemisphere land from the week of 4 October 1966, on an 88 x 88 polar
  stereographic grid whose cells cover 10,677 to 41,805 km2: one flag per cell and week (snow covered or not), with
  each cell's area and a land mask. Snow cover extent in km2 is not in the file; it is the summed area of land cells
  flagged as snow covered, computed by our transform. Before June 1999 the maps were drawn weekly by NOAA analysts from
  satellite imagery; since then they come from the US National Ice Center's Interactive Multisensor Snow and Ice
  Mapping System (IMS), processed at Rutgers. The early years are less reliable. The Rutgers Global Snow Lab's own monthly tables are not used because they carry no licence.
