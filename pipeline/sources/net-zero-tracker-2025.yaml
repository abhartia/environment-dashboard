status:
  state: active
  note: >-
    A fixed deposit for the Net Zero Stocktake 2025 (data collection to September 2025). The Tracker publishes a new
    stocktake about once a year, with its dataset on Zenodo; a new deposit needs a new registry entry. Not a US federal
    product.
  us_federal: false
update_cadence: Annual stocktake (the live tracker updates every four hours, but only behind a reCAPTCHA form)
next_release:
  expected: 2026-10-31
  note: >-
    The 2023, 2024 and 2025 stocktakes were published in September or October, each with a Zenodo deposit (records
    8021261, 13768013, 17143240). None for 2026 was found on 2026-10-08, so the end of October is a guess to look
    again, not an announced date.
