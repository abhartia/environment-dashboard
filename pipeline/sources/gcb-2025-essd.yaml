id: gcb-2025-essd
title: "Global Carbon Budget 2025 (Friedlingstein et al. 2026, Earth System Science Data)"
publisher: Global Carbon Project; published by Copernicus Publications in Earth System Science Data
landing_url: https://doi.org/10.5194/essd-18-3211-2026
description: >-
  The peer-reviewed description of the Global Carbon Budget 2025: how each part of the global carbon dioxide budget is
  estimated, the results to 2024, a projection for 2025 made from data for part of that year, and the remaining carbon
  budgets for limiting warming to 1.5, 1.7 and 2 °C. The yearly values themselves are in the Global Carbon Budget 2025
  data files; this paper is quoted for the statements those files do not carry.
