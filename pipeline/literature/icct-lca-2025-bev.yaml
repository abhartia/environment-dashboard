# ICCT (Negri & Bieker, July 2025), executive summary: life-cycle greenhouse gas emissions of a medium-segment battery
# electric car sold in the EU in 2025, on the projected 2025-2044 average EU electricity mix.
# The build checks that `quote` appears on PDF page 3 (printed page i) of the snapshot of icct-lca-2025/report-pdf.
# The same 63 g CO2e/km is repeated in the results (printed page 17) and conclusions (printed page 23).
