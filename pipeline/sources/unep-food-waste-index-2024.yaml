artifacts:
  - id: report-pdf
    url: null
    format: pdf
    description: >-
      The English report (193 pages in UNEP's August 2024 re-save): Table 1 and Table 23 give global food waste in 2022
      by sector (tonnes and kg per person per year); Annex 3 lists household estimates by country (M49 code, kg per
      person per year, tonnes per year, confidence). Country food service and retail tables are in the report's
      separate Appendix, which is not registered here. A person opens
      https://wedocs.unep.org/handle/20.500.11822/45230 in a web browser, chooses Download > English
      (food_waste_index_report_2024.pdf, not the _PT or _SP translations), and records it with
      `uv run envdash snapshot add --source unep-food-waste-index-2024 --artifact report-pdf
      --file food_waste_index_report_2024.pdf
      --note "downloaded by <who> from https://wedocs.unep.org/handle/20.500.11822/45230"`.
      The copy recorded on 2026-10-06 is 21,703,685 bytes with MD5 c673a628d92861c8c09f4d2bc3d492e5 (the repository's
      own checksum for the English file) and sha256 8f601d69958e811318374076d831858c5ec0f1a0e62549376d6e6172b8da2548;
      a different hash means UNEP has replaced the file, and the transform's page number must be checked again.
status:
  state: active
  note: >-
    Published 27 March 2024 with 2022 data; no later edition found on 2026-10-04 (editions so far: 2021 and 2024).
    UNEP is not on the January 2026 US withdrawal memorandum. The research behind the report was co-funded by the
    Swiss Federal Office for Agriculture and the US Environmental Protection Agency.
  us_federal: false
update_cadence: Irregular (2021 and 2024 editions)
