  licence_quote: >-
    Publishers are welcome to quote from this Review provided that they attribute the source to Energy Institute
    Statistical Review of World Energy 2026. However, for extensive reproduction of tables and/or charts, permission
    must first be obtained from:
  checked_on: 2026-10-04
  terms_check: manual
obligations:
  attribution: Energy Institute Statistical Review of World Energy 2026
  mirror_raw: false
acquisition: manual
artifacts:
  - id: report-pdf
    url: null
    format: pdf
    description: >-
      The full report PDF (88 pages). A person opens
      https://www.energyinst.org/statistical-review/resources-and-data-downloads in a browser, passes the Cloudflare
      check, and under "Key reports" clicks the PDF of "Statistical Review of World Energy". The file is served from
      https://www.energyinst.org/__data/assets/file/0004/1827616/Statistical-Review-of-World-Energy-PDF-Report.pdf
      (the page labels it 5.3 MB; the archived copy is 12,632,347 bytes). Record it with
      uv run envdash snapshot add --source energy-institute-review-2026 --file <path>, and check its sha256 against
      the archived copy noted above.
status:
  state: active
  note: >-
    Published annually; the 2026 edition is the 75th. All energyinst.org pages and files sit behind a Cloudflare bot
    challenge, so acquisition and terms checks are manual. Not exposed to US federal cuts.
  us_federal: false
update_cadence: Annual, late June
next_release:
  expected: 2027-06-30
  note: >-
    No 2027 date announced. The 2026 edition appeared at the end of June 2026; 30 June 2027 is the check-by date for
    the 2027 edition, not an announced date.
twins: [eia-international]
