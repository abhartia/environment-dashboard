# Andre, Boneva, Chopra & Falk (2024), Nature Climate Change 14:253-259: actual and perceived support for climate
# action in 125 countries (Global Climate Change Survey, run with the Gallup World Poll 2021/22).
# Evidence: docs/research/sources-solutions-and-action.json ("Andre, Boneva, Chopra & Falk 2024: Global Climate Change
# Survey ..."); verdict "corrected" (add volume 14(3), pages 253-259); final_redistribution open-attribution for the
# paper and its CC BY supplement only.
# Checked 2026-10-04:
#   - nature.com article page: HTTP 200 to the pipeline's own client (it first answers 303 to idp.nature.com, a cookie
#     check, and the client follows it). "Rights and permissions" carries the licence quoted below; "Cite this article"
#     gives the citation used here. Crossref lists https://creativecommons.org/licenses/by/4.0 (vor and tdm).
#   - Article PDF: HTTP 200 application/pdf, 4,095,859 bytes, through the same cookie redirect. The redirect adds a
#     one-time query string, so conditional is false.
#   - Supplementary Information (MOESM1, "Supplementary Figs. 1–4 and Tables 1–17"): HTTP 200, 822,967 bytes, ETag
#     "19642d405799b88c511d6f3625b651f8", Last-Modified 14 Mar 2024. Supplementary Table S4 gives national averages
#     for all 125 countries (willingness to contribute 1% of income, approval of pro-climate norms, demand for
#     political action, beliefs about others' willingness, share believing a majority would contribute); Table S5
#     gives world regions. These are the authors' published aggregates, covered by the article's CC BY licence.
# NOT ingested: the survey microdata on the IZA Data Service Center (doi:10.15185/gccs.1, version 5.0, 2024-04-30,
# Country_data.zip and Replication.zip). Its licence is IIL-1.0 and its terms of access read "Users are prohibited
# from using data acquired from the IDSC in the pursuit of any commercial or private ventures. The data will be used
# only for scholarly, research, educational purposes or replications." and require registration.
id: andre-2024
title: Actual and perceived support for climate action (Andre et al. 2024)
publisher: >-
  Peter Andre, Teodora Boneva, Felix Chopra and Armin Falk (SAFE and Goethe University Frankfurt, University of Bonn,
  University of Copenhagen); published in Nature Climate Change
landing_url: https://doi.org/10.1038/s41558-024-01925-3
description: >-
  A representative survey of nearly 130,000 people in 125 countries, run as part of the Gallup World Poll 2021/2022.
  Worldwide, 69% say they would be willing to contribute 1% of their household income every month to fight global
  warming, 86% endorse pro-climate social norms and 89% want their government to do more, while people underestimate
  how many of their compatriots are willing to contribute. National averages for each measure come from the paper's
  Supplementary Information; global averages are population-weighted averages of national shares.
