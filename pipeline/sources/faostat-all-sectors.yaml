artifacts:
  - id: emissions-totals
    url: https://bulks-faostat.fao.org/production/Emissions_Totals_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      Climate Change: Agrifood systems emissions: Emissions totals (GT). Zipped normalized CSV (latin-1): Area, Item,
      Element, Year, Source, Unit, Value, Flag, Note. The same file as faostat/emissions-totals; here we read the IPCC
      sector items (6821, 6817, 1711, 1707, 6818, 6819) and the all-sector total (6825), "FAO TIER 1" rows only.
  - id: emissions-indicators
    url: https://bulks-faostat.fao.org/production/Climate_change_Emissions_indicators_E_All_Data_(Normalized).zip
    format: zip
    description: >-
      Climate Change: Agrifood systems emissions: Emissions indicators (EM). Zipped normalized CSV: Area, Item,
      Element, Year, Unit, Value, Flag. FAO's shares of each item in the all-sector total including LULUCF (by
      CO2-equivalent and by gas, percent) and emissions per capita (t CO2eq per person), per value of agricultural
      production and per hectare of agricultural land, 1990-2023.
  - id: datasets-catalogue
    url: https://bulks-faostat.fao.org/production/datasets_E.json
    format: json
    description: >-
      FAOSTAT bulk-download catalogue: DatasetCode, DateUpdate, FileRows and FileLocation for every domain. The same
      file as faostat/datasets-catalogue. Supplies the vintage (DateUpdate) and {year} for the citation, after its
      FileRows is matched against the data rows of the GT or EM file.
    max_bytes: 5000000
status:
  state: active
  note: >-
    The emissions domains (GT, EM) were last updated 28 October 2025 with data to 2023. FAO's documentation names
    PRIMAP-hist v2.4 for the non-farm sectors, but the values are v2.7 (see the registry file's header); which version
    and terms apply is a question still to be asked of FAO. FAO is not on the January 2026 US withdrawal memorandum
    (FR Doc 2026-00976).
  us_federal: false
update_cadence: >-
  Annual, each October-November. DateUpdate in datasets_E.json changes with each release, but zips are sometimes
  re-uploaded later.
next_release:
  expected: 2026-10-31
  note: >-
    FAO's 2026 release calendar lists FAOSTAT Emissions totals (data to 2024) under October 2026 without a day; 31
    October is the end of that window. The PRIMAP-hist version and its terms must be re-checked at that release.
  url: https://www.fao.org/statistics/data-releases/upcoming-data-releases/en
