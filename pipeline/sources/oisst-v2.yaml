# NOAA 0.25-degree Daily Optimum Interpolation Sea Surface Temperature (OISST), version 2.1, NOAA NCEI.
# Evidence: docs/research/sources-ocean-and-ice.json ("NOAA 1/4 degree Daily Optimum Interpolation SST v2.1 (OISST)";
# verifier corrected the method paper's year to 2021 and rejected Climate Reanalyzer as a pipeline input).
#
# NCEI publishes one NetCDF file per day and no global-mean series, so the pipeline computes the area-weighted
# 60°S–60°N daily mean itself from the gridded files (Climate Reanalyzer's derived JSON returns HTTP 403 to non-browser
# clients and states no licence; it is not used). File pattern, one directory per month:
#   https://www.ncei.noaa.gov/data/sea-surface-temperature-optimum-interpolation/v2.1/access/avhrr/{YYYYMM}/oisst-avhrr-v02r01.{YYYYMMDD}.nc
#   ...and {YYYYMMDD}_preliminary.nc for roughly the last two weeks, replaced by the final file about 14 days later.
# Both artifacts are found through `discover` (envdash/discovery.py): each fetch reads the avhrr/ directory index,
# reads the monthly directories newest first (at most two) and takes the newest file of the kind wanted; the snapshot
# manifest records the exact URL. Two directories, because final files lag preliminary ones by about two weeks: early
# in a month the newest directory holds only preliminary files. On 2026-10-04 they resolved to
# 202609/oisst-avhrr-v02r01.20260919.nc and 202610/oisst-avhrr-v02r01.20261003_preliminary.nc (HTTP 200, about 1.5 MB
# each, ETag present); the first file, 198109/oisst-avhrr-v02r01.19810901.nc, also returned 200. A daily series needs
# every day's file, which one artifact per newest day does not give; that is for the transform's design.
id: oisst-v2
title: NOAA Daily Optimum Interpolation Sea Surface Temperature (OISST), version 2.1
publisher: NOAA National Centers for Environmental Information
landing_url: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
description: >-
  Daily sea-surface temperature on a global 0.25° grid from 1 September 1981, blending AVHRR satellite data with ship,
  buoy and Argo float measurements and filling gaps by optimum interpolation. Each daily file also carries an anomaly
  (its metadata says "Climatology is based on 1971-2000 OI.v2 SST"), an error estimate and sea-ice concentration.
  Files for roughly the last two weeks are preliminary and are replaced by final files; the site keeps that status and
  labels those days preliminary.
