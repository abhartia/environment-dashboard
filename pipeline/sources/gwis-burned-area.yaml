artifacts:
  - id: banf-world
    url: https://cprof.effis.emergency.copernicus.eu/api/v3/banf?level=AOI&value=WORLD&year=2025&yearFrom=2002&yearTo=2025&env=PROD
    format: json
    description: >-
      World. banfyear holds one row per year 2002-2025 with lc1..lc5 and lc_tot (hectares burned by land cover,
      MCD64A1) and ba_area_ha, ba_count, firesize (GlobFire; 0.0 in 2025, not processed). Also banfmonth,
      banfmonthlyavg, monthlyburnedareavshistorical and fire-size distributions.
    access:
      conditional: false
  - id: banf-africa
    url: https://cprof.effis.emergency.copernicus.eu/api/v3/banf?level=AOI&value=UN_AFR&year=2025&yearFrom=2002&yearTo=2025&env=PROD
    format: json
    description: Africa (UN continent UN_AFR), same structure as banf-world.
    access:
      conditional: false
  - id: banf-americas
    url: https://cprof.effis.emergency.copernicus.eu/api/v3/banf?level=AOI&value=UN_AME&year=2025&yearFrom=2002&yearTo=2025&env=PROD
    format: json
    description: Americas (UN continent UN_AME), same structure as banf-world.
    access:
      conditional: false
  - id: banf-asia
    url: https://cprof.effis.emergency.copernicus.eu/api/v3/banf?level=AOI&value=UN_ASI&year=2025&yearFrom=2002&yearTo=2025&env=PROD
    format: json
    description: Asia (UN continent UN_ASI), same structure as banf-world.
    access:
      conditional: false
  - id: banf-europe
    url: https://cprof.effis.emergency.copernicus.eu/api/v3/banf?level=AOI&value=UN_EUR&year=2025&yearFrom=2002&yearTo=2025&env=PROD
    format: json
    description: >-
      Europe (UN continent UN_EUR), same structure as banf-world. This is GWIS's MODIS-based Europe, not the EFFIS
      estimate (source effis), and the two differ.
    access:
      conditional: false
  - id: banf-oceania
    url: https://cprof.effis.emergency.copernicus.eu/api/v3/banf?level=AOI&value=UN_OCE&year=2025&yearFrom=2002&yearTo=2025&env=PROD
    format: json
    description: Oceania (UN continent UN_OCE), same structure as banf-world.
    access:
      conditional: false
status:
  state: active
  note: >-
    GWIS is run by the European Commission's Joint Research Centre, with Copernicus, GEO and NASA as partners. Its
    burned area depends entirely on NASA's MODIS MCD64A1 product, hence the US federal exposure. The app's bulk
    downloads returned 404 when checked on 4 October 2026, and the year range in these URLs must be extended by hand
    each year.
  us_federal: true
update_cadence: >-
  Annual for completed years; on 4 October 2026 the app showed 2002-2024 while the API already held 2025 land-cover
  values
