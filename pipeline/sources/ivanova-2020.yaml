#   - Crossref (api.crossref.org/works/10.1088/1748-9326/ab8589): licence http://creativecommons.org/licenses/by/4.0
#     for the version of record from 2020-08-20; volume 15, issue 9, article 093001.
#   - The licence quote below is on page 2 of the version-of-record PDF that the authors deposited on Zenodo (record
#     4106717, licence cc-by-4.0, DOI field = the article DOI): HTTP 200, 2,037,080 bytes, md5
#     dadf8184697204b76bf9b2b280d55788 as Zenodo lists it, sha256
#     f41eb020a2b60570445ca2795a82a51d9313be1ad3857f5c458b684beaf91d0e; IOP cover page "downloaded ... on 22/09/2020".
#     The Zenodo bytes never change. IOP's own PDF adds a cover page with the downloader's IP address and time, so
#     its sha256 differs on every download.
#   - iopscience.iop.org answered the first two scripted requests (article page, PDF) with HTTP 200, then sent every
#     request, including /article/10.1088/1748-9326/ab8589/data where the supplementary files are listed, to a
#     "Radware Bot Manager Captcha" page (302 to validate.perfdrive.com). The supplementary files are therefore
#     acquired by hand, which makes the whole source acquisition: manual.
#   - Supplementary files, named on the Internet Archive copy of the /data page (2023-11-25):
#     ERL_15_9_093001_suppdata.xlsx (the spreadsheet with every option) and ERL_15_9_093001_suppdata.pdf. IOP serves
#     both from content.cld.iop.org with signed URLs that expire.
#   - The paper's data availability statement covers the spreadsheet: "The data that support the findings of this
#     study are openly available in the supplementary spreadsheet. Please cite this article and its digital object
#     identifier (DOI) when making use of the data."
# No twin: Wynes & Nicholas (2017) is one of the studies Ivanova et al. reviewed (their reference 30), so it is not an
# independent measurement.
id: ivanova-2020
title: Mitigation potential of household consumption options (Ivanova et al. 2020)
publisher: >-
  Ivanova, Barrett, Wiedenhofer, Macura, Callaghan and Creutzig (University of Leeds, BOKU Vienna, Stockholm
  Environment Institute, MCC Berlin); published in Environmental Research Letters (IOP Publishing)
landing_url: https://doi.org/10.1088/1748-9326/ab8589
description: >-
  A systematic review of 53 studies published after 2011, which found 771 consumption options and summarised them as
  61 options in transport, housing, food and other consumption. For each option the paper reports the greenhouse gas
  mitigation potential in tonnes of CO2-equivalent per person per year: the mean, the median, the 25th and 75th
  percentiles and the range across studies. The paper's figures order options by median. The values come mostly from
  high-income settings, depend on context (grid mix, the car replaced, the starting diet) and are not additive.
  Footprint figures quoted for context (about 6 t per person worldwide, 13.4 t North America, 7.5 t Europe, 1.7 t
  Africa and Middle East) refer to 2011.
