# NOAA Global Surface Temperature Dataset (NOAAGlobalTemp), version 6.1.0, NOAA NCEI.
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("NOAA Global Surface Temperature (NOAAGlobalTemp
# v6.1.0) and Climate at a Glance"; verifier corrected the method-paper author order and noted that the annual file's
# error-variance columns are all -999).
#
# File names embed the month of the latest data (yyyymm) and only the current set is kept in the directory, so the
# URLs below go stale at each monthly release. Pattern, from 00_Readme_timeseries.txt:
#   https://www.ncei.noaa.gov/data/noaa-global-surface-temperature/v6.1/access/timeseries/
#     aravg.{ann|mon}.{land_ocean|land|ocean}.{south}.{north}.v6.1.0.{yyyymm}.asc
# The fetcher must read the directory listing and record the exact file name it took. Current set: 202608 (all HTTP
# 200 on 2026-10-04, Last-Modified 08 Sep 2026, ETag present).
# Not used: the Climate at a Glance CSV (stable URL, but a 1901-2000 base period and two decimals). Never mix the two
# baselines.
id: noaaglobaltemp-v6
title: NOAA Global Surface Temperature (NOAAGlobalTemp), version 6.1
publisher: NOAA National Centers for Environmental Information
landing_url: https://www.ncei.noaa.gov/products/land-based-station/noaa-global-temp
description: >-
  Monthly and annual land-ocean surface temperature anomalies from January 1850, for the globe and for latitude bands.
  Version 6.1.0 combines NOAA GHCN monthly land-station data with ERSST version 6 sea-surface temperatures and fills gaps
  with an artificial neural network. Anomalies are in kelvin (equal to degrees Celsius) relative to 1991–2020; the site
  rebases them to this dataset's own 1850–1900 mean. The annual files carry no uncertainty (every error-variance column
  is -999), and the current year's annual row averages only the months so far.
