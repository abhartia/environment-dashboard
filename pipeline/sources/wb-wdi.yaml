  no_endorsement: true
acquisition: automatic
artifacts:
  - id: countries
    url: https://api.worldbank.org/v2/country?format=json&per_page=400
    format: json
    description: >-
      Every economy and aggregate in the API (295 entries) with its ISO3 id, ISO2 code, name, region, income level
      and lending type; the source of the World Bank region and income groups.
    access: {conditional: false}
  - id: sp-pop-totl
    url: https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=20000&source=2
    format: json
    description: SP.POP.TOTL, "Population, total" (people), all economies and aggregates, 1960-2025, one page.
    access: {conditional: false}
  - id: ny-gdp-pcap-pp-kd
    url: https://api.worldbank.org/v2/country/all/indicator/NY.GDP.PCAP.PP.KD?format=json&per_page=20000&source=2
    format: json
    description: >-
      NY.GDP.PCAP.PP.KD, "GDP per capita, PPP (constant 2021 international $)", all economies and aggregates, values
      1990-2025, one page.
    access: {conditional: false}
  - id: eg-elc-accs-zs
    url: https://api.worldbank.org/v2/country/all/indicator/EG.ELC.ACCS.ZS?format=json&per_page=20000&source=2
    format: json
    description: >-
      EG.ELC.ACCS.ZS, "Access to electricity (% of population)", all economies and aggregates, values 1990-2024, one
      page.
    access: {conditional: false}
status:
  state: active
  note: >-
    Updated several times a year; last updated 13 July 2026 per the API. The World Bank is an international
