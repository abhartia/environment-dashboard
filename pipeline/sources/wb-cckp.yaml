# World Bank Climate Change Knowledge Portal (CCKP): ERA5 country temperature series, CMIP6 hot-day projections by
# country, and CMIP6 projections of seven measures for every country and every CCKP state or province.
# Evidence: docs/research/sources-country-and-local.json ("Climate Change Knowledge Portal (CCKP): ERA5 and CMIP6
# aggregated to countries, ADM1 and watersheds"; verifier corrected the terms URL and added the pass-through duty).
#
# Checked 2026-10-04: climateknowledgeportal.worldbank.org returns HTTP 403 to curl, so its pages were read in a
# browser. Its "Terms of Use" tab says "CCKP data is disseminated by the World Bank under its Open Data policy" and
# reproduces the World Bank Dataset Terms; its Metadata page says "All CCKP data adhere to CC-BY 4.0" and that the
# CMIP6 inputs were relaxed from CC BY-SA 4.0 to CC BY 4.0 in 2022 (PCMDI's CMIP6 terms page: all modelling groups on
# CC BY 4.0 since October 2022). The Terms tab still links the old dataset-terms URL, which now redirects (HTTP 301) to
# the general World Bank terms page (non-commercial, no derivatives for other materials), so terms_url points at the
# dataset terms page directly. The API (cckpapi.worldbank.org) needs no key and answered HTTP 200 for all 22 artifacts
# below with the pipeline's own client and User-Agent (envdash.fetch.USER_AGENT); it returns HTTP 403 to Python
# urllib's default User-Agent only. It sends no ETag or Last-Modified, so fetches are unconditional and change is
# detected by sha256.
#
# The ERA5 period code ends in the latest year ("1950-2025"); a 1950-2026 call returned an empty data array, so the URL
# changes when CCKP adds a year (about annually). Values are absolute °C keyed "YYYY-07" (the mid-year stamp of an
# annual value). CCKP publishes ERA5 climatologies for 1986-2005, 1991-2020 and 1995-2014 only (a 1951-1980 call
# returned no data). A 1951-1980 baseline would therefore be the site's own computation from the annual series; the
# baseline CCKP itself publishes is 1991-2020 (artifacts below).
#
# Checked 2026-10-16 (every country and region; the artifact_grids below). The area all_countries_subnationals returns
# every country and every CCKP state or province in one response. `envdash fetch -s wb-cckp` got HTTP 200 and data for
# all 270 collections registered: 102,429 to 116,256 B each, 30,395,255 B in all (hd35 2040-2059 SSP2-4.5 median
# 110,326 B, the size the research read on 2026-10-15). Content-Type application/json, still no ETag or
# Last-Modified; a second fetch of one file (tas anomaly 2040-2059 SSP2-4.5 median, 111,948 B) was byte-identical
# (sha256 1655c12b3566…). Every file holds the same 246 countries as the all_countries files (hd35 values identical
# to them in the four files compared) plus 3,527 to 3,530 regions, 32 of them DIS.* (areas the World Bank assigns to
# no country, named only by their code); one stamp ("{start}-07"); no null in any file; p10 <= median <= p90 for
# every key. Region codes are ISO3.{FAO GAUL country code}{n}: IND.11510 Delhi (GAUL 115), KEN.133…, USA.259…,
# with 2 to 10 digits after the dot (BES.7500175101); each region's prefix is a country in the same file, or DIS.
# The code set is the same in every file of one variable, but differs between variables in where Hong Kong, Macao
# and Taiwan sit: as units of China (CHN.33364910 "Hong Kong, SAR", CHN.1491879 "Macau, SAR", CHN.147295925 "Taiwan
# Sheng" in CCKP's xlsx) for hd35, tr26, hi39, txx, rx1day and (without Taiwan) cdd; as their own single region
# (HKG.33364910, MAC.1491879, TWN.147296925) for tas, rx1day and cdd, and TWN also for hi39 and txx. In rx1day both
# exist with different values (CHN.147295925 151.67 mm, TWN.147296925 123.49 mm, 2040-2059 SSP2-4.5 median).
#
# Warming is CCKP's `anomaly` product of tas (the S3 README lists anomaly among CCKP's products). The CCKP portal
# pages, the Metadata page included, still return HTTP 403 (Cloudflare) to scripts, so the reference period was read
# from CCKP's own netCDF of the same collection on its public S3 bucket (data/cmip6-x0.25/tas/ensemble-all-ssp245/
# anomaly-tas-annual-mean_cmip6-x0.25_ensemble-all-ssp245_climatology_median_2040-2059.nc, first 200 kB by HTTP
# range): "ensemble of anomaly of Daily Near-Surface Air Temperature with reference period 1995-2014". The API
# returns an empty data array for a 1995-2014 historical anomaly, so no baseline file is registered. The anomaly is
# not the difference of the two published medians (a median of per-model changes): India 1.18 °C against 25.61 -
# 24.42 = 1.19 °C; over all 3,773 areas the median gap is 0.04 °C.
#
# Definitions in the netCDF attributes of the same collections (2040-2059 SSP2-4.5 median files on the S3 bucket):
# hd35 "number of days with tasmax >= 35"; hi39 "days greater than or equal to threshold (39 degC)"; tr26 "number of
# intense tropical nights with 26 degC and higher" but also "number of days with tasmin > 26.0 C"; txx "maximum of
# daily maximum temperatures in period"; rx1day "monthly maxima of single day precipitation" (annual files; CCKP's
# docs label it "Average Largest 1-Day Precipitation"); cdd "longest consecutive sequence of dry days (<1mm) within
# annual data". CCKP's GitHub collection notes (docs/collections/cmip6-x0.25.md) write hd35 as "Tmax > 35°C" and tr26
# as "T-min > 26°C"; the Metadata page (read in a browser on 2026-10-05) says hd35 is ">= 35°C". The transform that
# reads these files quotes the Metadata page for each measure.
#
# Names: CCKP serves no CSV (`_format=csv` answers HTTP 200 with an empty text/html body). `_format=xlsx` gives
# code, name and value for every key (105,745 B for tas anomaly 2040-2059 SSP2-4.5 median; the rx1day file's 3,776
# codes are the union of all seven variables), but it is generated per request: two fetches 80 s apart differed in
# sha256 (0a119479ba26… and e9359a639b4e…) because docProps/core.xml stamps the request time and the zip stamps each
# member; every other member was byte-identical. It also leaves zero values blank. The portal's geonames.json sits
# behind the Cloudflare challenge (a person would have to download it, rule 7), so the names come from the API's xlsx
# instead (artifact subnational-names, the rx1day file, whose codes cover every variable's region files): its
# content_key xlsx-members leaves docProps/core.xml out of the fingerprint, so an unchanged workbook keeps its
# snapshot. Only the code and name columns are read (envdash/geo.py builds the region rows of
# pipeline/geo/entities.csv from them); its values are never read.
#
# Not registered, deliberately: CCKP's count-type products, the population counts (pop-x0.25 popcount) and the
# population-weighted heatwave person-days (popwgt …exposure). Their national totals are 2-3 times the sum of CCKP's
# own regions (read 2026-10-15/16): India's population 3,354,552,300 against 1,663,800,215 summed over its 35
# regions (2.02×) and its person-days 38.9 billion against 19.36 billion; PAK 2.03×; GBR, FRA, ESP and AUS 2.0×; PRT
# and BES 3.0×; UMI 7.0×. envdash/transforms/country/cckp.py refuses any URL naming them.
id: wb-cckp
title: Climate Change Knowledge Portal country climate data
publisher: World Bank Group
landing_url: https://climateknowledgeportal.worldbank.org/
description: >-
  Country and global aggregates of climate data prepared by the World Bank on its official boundaries. Observed: ERA5
  reanalysis annual mean near-surface air temperature for every country and territory from 1950, as absolute values in
  degrees Celsius, with CCKP's 1991–2020 climatology as the reference. Projected, from the bias-corrected, downscaled
  CMIP6 multi-model ensemble (median, 10th and 90th percentiles): the number of days a year with a daily maximum of
  35 °C or more for every country, for 1995–2014 and for 2040–2059 under five emissions scenarios; and, for every
  country and every state or province as CCKP draws them, seven measures for 2020–2039, 2040–2059, 2060–2079 and
  2080–2099 under SSP1-2.6, SSP2-4.5 and SSP5-8.5: hot days of 35 °C or more, tropical nights of 26 °C, days with a
  heat index of 39 °C or more, the hottest day, the wettest day and the longest dry spell (each also for the
  1995–2014 historical runs), and warming against 1995–2014. These are reanalysis and model aggregates over the land
  area of each country or region, not weather-station records, and not weighted by where people live.
