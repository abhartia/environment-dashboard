  title: World Development Indicators
  author:
    - {literal: The World Bank}
  issued: "2026-07-13"
  publisher: The World Bank
  version: "{version}"
  URL: https://datacatalog.worldbank.org/search/dataset/0037712/World-Development-Indicators
  # The World Bank's required attribution format, "The World Bank: Dataset name: Data source (if known)", with the
  # API's last-updated date as the version; WDI publishes no other suggested citation.
  text: The World Bank. World Development Indicators (last updated {version}). Accessed {date_accessed}.
