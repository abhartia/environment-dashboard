    United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects
    2024, Online Edition. CC BY 3.0 IGO.
  attribution_modified: >-
    Calculated by Environment Dashboard from United Nations, Department of Economic and Social Affairs, Population
