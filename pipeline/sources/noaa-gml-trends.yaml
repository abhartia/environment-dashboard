# NOAA Global Monitoring Laboratory greenhouse-gas trend files (CO2, CH4, N2O).
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("NOAA GML Trends in Atmospheric Carbon Dioxide").
# Licence evidence: the data-use statement in the '#' header of every trend file (terms_url below; the quote is checked
# against the file's text with the comment markers removed). GML's site-wide "Disclaimer and Terms of Reference"
# (https://gml.noaa.gov/about/disclaimer.html, HTTP 200, re-read 2026-10-04, also the terms_url of noaa-aggi) applies
# to these files too: public domain "so long as you do not 1) claim it is your own (e.g. by claiming copyright for
# NOAA information – see next paragraph), 2) use it in a manner that implies an endorsement or affiliation with NOAA,
# or 3) modify it in content and then present it as official government material", and "As required by 17 U.S.C.
# 403, third parties producing copyrighted works consisting predominantly of the material appearing in NOAA web pages
# must provide notice with such work(s) identifying the NOAA material incorporated and stating that such material is
# not subject to copyright protection." Hence no_endorsement, the notice, and "Not official NOAA material" on the
# modified credit line, as for noaa-aggi. The Mauna Loa values before May 1974 are Scripps measurements (C. David
# Keeling), so the notice names only the NOAA material.
id: noaa-gml-trends
title: Trends in atmospheric carbon dioxide, methane and nitrous oxide
publisher: NOAA Global Monitoring Laboratory
landing_url: https://gml.noaa.gov/ccgg/trends/
description: >-
  Monthly and annual mean concentrations measured at Mauna Loa Observatory, Hawaii, and averaged over NOAA's global
  network of marine surface sites. The Mauna Loa record before May 1974 was measured by C. David Keeling of the
  Scripps Institution of Oceanography.
citation:
  type: dataset
  title: Trends in globally-averaged CO2 determined from NOAA Global Monitoring Laboratory measurements
  author:
    - {family: Lan, given: X.}
    - {family: Tans, given: P.}
    - {family: Thoning, given: K. W.}
  issued: "2026"
  publisher: NOAA Global Monitoring Laboratory
  version: "{version}"
  DOI: 10.15138/9N0H-ZH07
  URL: https://gml.noaa.gov/ccgg/trends/gl_data.html
  text: >-
    Lan, X., Tans, P. and K.W. Thoning: Trends in globally-averaged CO2 determined from NOAA Global Monitoring
    Laboratory measurements. Version {version} https://doi.org/10.15138/9N0H-ZH07
licence_class: open
licence:
  name: Public domain (work of the US federal government)
  spdx: null
  url: https://www.copyright.gov/title17/92chap1.html#105
evidence:
  terms_url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_mlo.csv
