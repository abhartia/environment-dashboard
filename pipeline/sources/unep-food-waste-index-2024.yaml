# UNEP Food Waste Index Report 2024 (SDG 12.3.1b): food waste at household, food service and retail level in 2022,
# global and by country.
# Evidence: docs/research/sources-food-land-nature.json ("UNEP Food Waste Index Report 2024 (SDG 12.3.1b) via UN SDG
# API"); verdict "corrected", final_redistribution noncommercial-only.
# Class decision: noncommercial. The report's own notice (quoted below) allows reproduction "in whole or in part and in
# any form for educational or non-profit services" with acknowledgement, and forbids resale or any commercial use
# without UNEP's written permission. That is a custom non-commercial licence that permits derived values and
# downloads on this non-commercial site, carrying those terms, so display-only is not needed. The same page adds: "The
# use of information from this document for publicity or advertising is not permitted." (in notice). The owner
# confirmed on 2026-10-08 that this standard UNEP notice is class noncommercial for every UNEP report, so
# unep-egr-2025 and unep-agr-2025 carry the same class, licence name and notice.
# How the terms were read: unep.org and wedocs.unep.org answer scripted requests with HTTP 403 (a Cloudflare
# challenge), so the report is downloaded by hand and terms_check is manual (quarterly check by a person). The quote
# was first copied on 2026-10-04 from Internet Archive captures of the old wedocs bitstream URL (the March 2024 copy).
# On 2026-10-06 it was checked word for word against PDF page 2 of the August 2024 re-save, downloaded by hand from the
# item page (Download > English; 21,703,685 bytes, MD5 c673a628d92861c8c09f4d2bc3d492e5, 193 pages), which carries the
# same notice. The notice is only in the file: the item page states no terms (its one rights field is
# dc.rights.accessLevel "Public" in Wayback capture 20261006110225 of it), so terms_url and licence.url
# point at the English file the repository serves now (bitstream 5c6e505d-e1d3-4731-b5b8-4ecb9693a056), the URL the
# snapshot was downloaded from. landing_url stays the item page.
# Route rejected: the UN SDG Global Database API (unstats.un.org/sdgapi, series AG_FOOD_WST and AG_FOOD_WST_PC) carries
# the same 2022 values (World ALL 1,051,962,676 t; 131.91 kg per person), but that site is governed by the UN Terms of
# Use (footer link www.un.org/en/aboutun/terms/: personal, non-commercial use, no redistribution or derivative works),
# not by UNEP's notice. So the numbers come from UNEP's own PDF, acquired by hand.
# mirror_raw is false: the PDF contains maps, photos and illustrations under other copyrights ("© Maps, photos and
# illustrations as specified"), so the unmodified file is not re-hosted.
id: unep-food-waste-index-2024
title: Food Waste Index Report 2024
publisher: United Nations Environment Programme (UNEP), with WRAP
landing_url: https://wedocs.unep.org/handle/20.500.11822/45230
description: >-
  Estimates of food waste (food and associated inedible parts such as bones and peels) in 2022 at household, food
  service (out-of-home consumption) and retail level: global tonnes and kilograms per person per year, averages by
  income group and region, and household estimates by country with a confidence rating (many country values are
  extrapolated). SDG indicator 12.3.1b, with UNEP as custodian. The 2019 estimates of the 2021 report used different
  data and methods, so the two editions are not a trend.
