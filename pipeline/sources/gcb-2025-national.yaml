# CO2, final v1.0 data on ICOS.
# Evidence: docs/research/sources-emissions.json and docs/research/sources-solutions-and-action.json (both "corrected":
# pin the ICOS v1.0 PIDs; cite "Supplemental data of Global Carbon Budget 2025", not the file name).
# Checked 2026-10-04:
#   - meta.icos-cp.eu: loCXyssaalv6DPdO6Qdj90qQ = National_Fossil_Carbon_Emissions_2025_v1.0.xlsx, 755,198 bytes;
#     milTbWkl0G-MSpdYG3IBIfzy = National_LandUseChange_Carbon_Emissions_2025_v1.0.xlsx, 1,271,678 bytes. Both submitted
#     2026-05-17, latestVersion = itself, licence "ICOS CCBY4 Data Licence" (baseLicence CC BY 4.0).
#   - Same ICOS click-through as gcb-2025-global: a plain GET to /licence_accept?ids=... sets CpLicenseAcceptedFor=<pid>;
#     with it both GETs return 200 (sha256 968097cacb1a6a5bfa0cf74ee90763f74a90ef10499e060ab43d1a74c671d46b and
#     9a29536d6925d06f8c4a97581b720121fcf219732c240e970bc24167d74e38d1, matching the PID hashes). HEAD -> 404;
#     GET with If-None-Match -> 304.
#   - The plan listed this file as manual because of the click-through. It is automatic here: nothing blocks automated
#     access, and the mechanism is the same as for the global file, which the plan fetches automatically. Not yet run
#     from a GitHub runner.
#   - Fossil sheets: Territorial Emissions (1850-2024), Consumption Emissions and Emissions Transfers (1990-2024; country
#     values stop in 2023), Regions. Land-use change sheets: BLUE, OSCAR, LUCE (1850-2024), one per bookkeeping model;
#     the file has no combined series.
#   - Per-sheet "Cite as" lines (required by the GCP terms quoted in gcb-2025-global): territorial = Friedlingstein et
#     al.; consumption and transfers = updated from Peters, Davis & Andrew (2012); each land-use model = its own paper.
id: gcb-2025-national
title: "Global Carbon Budget 2025: national fossil and land-use change carbon dioxide emissions"
publisher: Global Carbon Project
landing_url: https://www.icos-cp.eu/GCP/2025
description: >-
  Fossil carbon dioxide emissions by country: territorial emissions from 1850 to 2024, and consumption-based emissions
  with the emissions transferred through trade from 1990 (country values to 2023), plus the country lists of each
  region. Also land-use change carbon dioxide emissions by country from 1850 to 2024, from each of three bookkeeping
  models (BLUE, OSCAR and LUCE) separately. Values are in million tonnes of carbon per year; multiply by 3.664 for
  carbon dioxide. National values exclude international aviation and shipping, which the world total includes.
