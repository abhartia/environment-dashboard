# HadCRUT5 global surface temperature (Met Office Hadley Centre and University of East Anglia Climatic Research Unit).
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("HadCRUT5 (Met Office Hadley Centre / UEA CRU)").
id: hadcrut5
title: HadCRUT5 near-surface temperature anomalies
publisher: Met Office Hadley Centre and University of East Anglia Climatic Research Unit
landing_url: https://www.metoffice.gov.uk/hadobs/hadcrut5/
description: >-
  Monthly and annual near-surface temperature anomalies from January 1850, blending the CRUTEM5 land air temperature
  and HadSST4 sea-surface temperature datasets, with statistical infilling of data-sparse regions. Global and
  hemispheric means come with the 2.5% and 97.5% limits of a 200-member ensemble plus a coverage uncertainty.
  Anomalies are relative to 1961–1990.
