# IPCC AR6 Working Group I Figure SPM.3 data, archived at CEDA: the IPCC's assessment, for each of the 45 inhabited
# AR6 reference regions, of the type of observed change since the 1950s in hot extremes, heavy precipitation and
# agricultural and ecological drought, and of its confidence in a human contribution to that change.
# Evidence: docs/research/sources-extremes-2026-10-12.json (research[0] candidates[1], verification[0] verdicts[1];
# verdict "confirmed": row counts reproduce every tally printed on the published figure, SPM p. 10).
# Licence evidence checked 2026-10-12: the CEDA catalogue record (HTTP 200) states the licence quoted below, and
# 00README_catalogue_and_licence.txt in the data directory repeats it. The directory's License.txt reads "This work is
# licensed under a Creative Commons Attribution 4.0 International License." No file restricts redistribution or
# derivatives. The IPCC's hexagon figure itself stays display-only under ipcc.ch/copyright (ipcc-ar6-wg1-spm); only
# counts of these rows are published, never the artwork or a regional map.
# Artifacts checked 2026-10-12 (all HTTP 200 from dap.ceda.ac.uk with an ETag; version directory v20221116, the
# newest of v20210809, v20220104 and v20221116; catalogue status "Completed", DOI published 2023-07-03):
#   SPM3_panel_a.csv 3,747 bytes, ETag "6374ff57-ea3", Last-Modified 16 Nov 2022
#   SPM3_panel_b.csv 5,125 bytes, ETag "6374ff58-1405"
#   SPM3_panel_c.csv 5,404 bytes, ETag "6374ff58-151c"
# Each is BADC-CSV with CRLF line endings: metadata rows ("comments,G,years 1950 to 2021", "last_revised_date,G,
# 2021-08-09"), then a data block of 45 rows with the region code, the type of observed change and the confidence in
# human contribution. Quirks: panel a writes "Low agreement in type of change" where panels b and c (and the printed
# figure) write "Low agreement in the type of change"; each file declares coordinate_variable 2 twice (the second is
# column 3, whose long_name is numbered 3); panel c's long_name 2 reads "agricultural and ecological change" for
# drought; the region list in the comments names MED under Europe and Africa and CAR under Central America and Small
# Islands (45 distinct codes, one row each).
# citation.text: CEDA's "Citable as" text, then the report citation CEDA asks to include, both as printed on the
# catalogue record.
id: ipcc-ar6-wg1-spm3
title: IPCC AR6 WGI Figure SPM.3 data
publisher: IPCC Working Group I Technical Support Unit; archived by the NERC EDS Centre for Environmental Data Analysis
landing_url: https://catalogue.ceda.ac.uk/uuid/dc6c126c95b1445d8e66d6b9f62054d4/
description: >-
  The data behind Figure SPM.3 of the IPCC Sixth Assessment Report (Working Group I): the synthesis of assessed
  observed and attributable regional changes. For each of the 45 inhabited AR6 reference regions, assessed for the
  region as a whole from the 1950s to the present (the files say "years 1950 to 2021"): the type of observed change
  (Increase, Decrease, Low agreement in the type of change, or Limited data and/or literature) and the confidence in
  a human contribution to it (High, Medium, Low due to limited agreement, or Low due to limited evidence). Panel a:
  hot extremes; panel b: heavy precipitation; panel c: agricultural and ecological drought. Expert assessment
  categories, not measured magnitudes.
