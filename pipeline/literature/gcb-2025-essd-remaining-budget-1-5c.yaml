# Global Carbon Budget 2025 (Friedlingstein et al. 2026, ESSD 18, 3211-3288), executive summary: the remaining carbon
# budget for a 50 % likelihood of limiting warming to 1.5 C, from the beginning of 2026.
# The build checks that `quote` appears on PDF page 5 (printed page 3215) of the snapshot of gcb-2025-essd/article-pdf.
# docs/research/sources-emissions.json (headline_number_checks 10): the paper states both 50 GtC and 170 GtCO2 (the
# GtC figure is rounded, so 50 x 3.664 is not the published value). The same check notes that IGCC 2025 (Forster et al.
# 2026, source igcc-2025) gives 130 GtCO2 from the beginning of 2026 by the IPCC method; a page showing this value
# shows that one too.
