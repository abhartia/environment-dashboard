# US Energy Information Administration, "Levelized Costs of New Generation Resources in the Annual Energy Outlook
# 2026" (April 2026): the report and its figure-data workbook.
# Evidence: docs/research/sources-zero-green-premium-2026-10-08.json (candidate rank 1), re-checked 2026-10-08.
# Licence: EIA "Copyrights and Reuse" page (the same terms as eia-international; a HEAD request gets an Akamai 503, so
# the weekly check uses GET). Every table of the workbook carries the line "Data source: U.S. Energy Information
# Administration, Annual Energy Outlook 2026" (NEMS model output); no third-party data is credited.
# citation.text is EIA's requested acknowledgement form, verbatim apart from the date: the page's example is
# "Source: U.S. Energy Information Administration (Oct 2008)." The report's cover is dated April 2026.
# Why this source: it is the only open, downloadable table found that puts new clean and new fossil power plants on
# one basis (same model, online year 2031, 25 supply regions, 2025 dollars, 30-year cost recovery, after-tax WACC of
# 7.27%), before and after US tax credits. EIA itself warns (report p. 5) that "Direct comparisons of LCOE or LCOS
# across technologies are misleading as a method to assess the economic competitiveness", so the site shows the rows
# side by side with that caveat and computes no difference between them.
id: eia-aeo-2026
title: Levelized Costs of New Generation Resources in the Annual Energy Outlook 2026
publisher: U.S. Energy Information Administration
landing_url: https://www.eia.gov/outlooks/aeo/electricity_generation/index.php
description: >-
  EIA's estimates of the levelised cost of electricity (LCOE) and of storage (LCOS) for new power plants entering
  service in 2031 in the AEO2026 Counterfactual Baseline case, in 2025 dollars per megawatt-hour: advanced nuclear,
  biomass, natural gas combined-cycle with and without carbon capture, geothermal, offshore and onshore wind,
  hydroelectric, solar photovoltaic (standalone and with a battery), combustion turbines and battery storage. Each is
  given as a simple average of the 25 US electricity supply regions and, where new capacity is built in 2031, a
  capacity-weighted average; with the regional minimum and maximum; before tax credits ("Total system LCOE") and
  including the levelised tax credit and the 45Q captured-carbon credit as modified by the One Big Beautiful Bill Act
  of 2025. Laws and regulations effective as of December 2025 only. These are model projections of the cost to build
  and run a plant, not of the value of its output to the grid (EIA pairs them with the levelised avoided cost, LACE),
  and plants run at different capacity factors (combined-cycle 40%, with carbon capture 87%).
