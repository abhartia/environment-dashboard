status:
  state: active
  note: >-
    Daily products are current (the daily DHW file for 3 October 2026 was posted on 4 October). The status page was
    last updated on 2 June 2026, when NOAA said the fourth global bleaching event likely ended in 2025. The FY2027 US
    budget request (April 2026) proposes terminating NOAA's Coral Reef Conservation Program, while listing "Maintain
    ecological forecasting for coral bleaching via the coral reef watch program (ongoing)" among its objectives.
