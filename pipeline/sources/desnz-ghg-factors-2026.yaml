id: desnz-ghg-factors-2026
title: "Greenhouse gas reporting: conversion factors 2026"
publisher: Department for Energy Security and Net Zero (UK Government)
landing_url: https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026
description: >-
  Emission factors in kilograms of CO2-equivalent per unit of activity, for UK organisations reporting their
  emissions: fuels per litre, tonne and kWh; UK and overseas electricity per kWh; passenger cars per kilometre by size
  and fuel; flights per passenger-kilometre by haul and seat class, with and without the radiative-forcing uplift;
  hotel stays per night by country; and more, each with separate CO2, CH4 and N2O factors and separate well-to-tank
  rows. One row per factor with a stable factor ID. These are UK reporting averages for 2026, not universal values.
