# UNEP Adaptation Gap Report 2025: Running on empty. Adaptation finance needs and modelled adaptation costs of
# developing countries by 2035, and international public adaptation finance flows from developed to developing
# countries, 2019-2023, as printed in the report.
# Evidence: docs/research/sources-zero-levers-and-adaptation-2026-10-08.json, item 6 ("Adaptation Gap Report 2025:
# Running on empty (main report)" and "Adaptation Gap Report 2025: Online Annexes").
# Class decision: noncommercial, by the owner's decision of 2026-10-08 that UNEP's standard notice is class
# noncommercial for every UNEP report (as unep-food-waste-index-2024 and unep-egr-2025). The notice on PDF page 2
# (quoted below; it continues "No use of this publication may be made for resale or any other commercial purpose
# whatsoever without prior permission in writing from the United Nations Environment Programme.") allows reproduction
# "in whole or in part and in any form for educational or non-profit services" with acknowledgement. The same page
# says "The use of information from this document for publicity or advertising is not permitted." (in notice) and
# "© Maps, photos and illustrations as specified", so the PDF is not re-hosted (mirror_raw false).
# How the terms were read: wedocs.unep.org, unep.org and doi.org's target answer scripts with HTTP 403 or a Cloudflare
# challenge (2026-10-08), so terms_check is manual and both artifacts are downloaded by hand. The research pass read
# the quote on PDF page 2 of the 4 November 2025 revision of AGR2025.pdf (15,336,689 bytes, sha256
# 7aae2efd6169f64163c6e4624df3d0b1754a9ba26493cc0060b77420e73f79cf, 98 pages) and of AGR2025_Online_Annexes.pdf
# (1,162,685 bytes, sha256 d62c387c331d97ddb80c523bfe0dac0d62de0a57f789bd0e8b328acc69580a8f, 60 pages), which
# carries the same notice. The person who downloads the files checks page 2 of each against this quote.
# Where the flow numbers come from: UNEP does not measure them itself. Online annex 4.B (annexes PDF p. 48, printed
# 45) says they "have been obtained from the Organisation for Economic Co-operation and Development (OECD)
# Development Assistance Committee (DAC)'s Climate-Related Development Finance (CRDF) data set (recipients'
# perspective)", as commitments at 2023 constant prices, with Rio-marker coefficients (100 per cent principal, about
# 40 per cent significant) and only the share of multilateral finance attributed to developed countries. The OECD's
# own terms for that data set could not be read (www.oecd.org returns 403 to scripts), so the values are taken from
# UNEP's report under UNEP's notice, and the OECD origin is stated in each flow value's provenance.
# citation.text: the "Suggested citation" on PDF page 2 (the extracted text splits "A daptation" and the DOI; both are
# joined here).
id: unep-agr-2025
title: "Adaptation Gap Report 2025: Running on empty"
publisher: United Nations Environment Programme (UNEP)
landing_url: https://doi.org/10.59117/20.500.11822/48798
description: >-
  UNEP's annual assessment of progress in adapting to climate change. The 2025 edition estimates what adapting will
  cost developing countries each year by 2035, from two lines of evidence (modelled costs, and the finance needs
  countries state in their national adaptation plans and nationally determined contributions), and compares it with
  the international public finance for adaptation that developed countries commit to developing countries, tracked
  for 2019-2023 from the OECD's Climate-Related Development Finance data set. Values are taken from the report's
  printed text, each with its page.
