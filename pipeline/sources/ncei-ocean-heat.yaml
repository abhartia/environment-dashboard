# NOAA NCEI global ocean heat content basin time series (Levitus, Boyer et al.; NCEI Accession 0164586).
# Evidence: docs/research/sources-ocean-and-ice.json ("NOAA NCEI Global Ocean Heat Content (Levitus/Boyer basin time
# series; NCEI Accession 0164586)"); verifier verdict "confirmed" (values, DOI, use agreement). The verifier's headline
# check adds that 2025 is the record-high level of 0-2000 m heat content but the 2024-to-2025 gain (22.2 ZJ) is not a
# record annual gain in this file (2017: +27.9 ZJ).
# Licence evidence checked 2026-10-04: the Ocean Heat Content CDR use agreement (UseAgreement_01B-41.pdf, HTTP 200,
# 22,692 bytes) states the CDR Program Open Data Policy quoted below and "urges" (does not require) an acknowledgement
# and citation; it names the developers as scientists "at the National Centers for Environmental Information", so the
# data are also a US federal government work. The NCEI archive record for accession 0164586 (where doi:10.7289/V53F4MVP
# resolves; latest archive version v26.26, published 2026-07-28) gives only the citation and a liability disclaimer as
# use constraints.
# Artifacts checked 2026-10-04 (all HTTP 200 with ETag and Last-Modified, all answer If-None-Match with 304):
#   yearly/h22-w0-700m.dat 4,104 bytes, Last-Modified 6 Jul 2026: 1955.500 -3.201 to 2025.500 22.845.
#   yearly/h22-w0-2000m.dat 1,254 bytes, Last-Modified 6 Jul 2026: 2005.500 10.171 to 2025.500 32.533.
#   pentad/pent_h22-w0-700m.dat and pent_h22-w0-2000m.dat 3,876 bytes each, Last-Modified 6 Jul 2026: 1957.5
#     (1955-59) to 2023.5 (2021-25); 0-2000 m 2023.5 = 29.480.
#   yearly/h22-a0-2000m.dat, h22-p0-2000m.dat, h22-i0-2000m.dat 1,254 bytes each, Last-Modified 6 Jul 2026.
#   The 3-month files (3month/h22-w0-2000m1-3.dat etc.) run to 2026.125 (January-March 2026); the older
#   3month/h22-w0-2000m.dat stops at 2010.5 (Last-Modified 9 Oct 2020) and is not used.
# citation.text: the NCEI "Cite as" text from the accession record, with "[indicate subset used]" filled by the
# product page's title and "[date]" by {date_accessed}, then the literature citation from the use agreement, verbatim.
id: ncei-ocean-heat
title: Global ocean heat content basin time series
publisher: NOAA National Centers for Environmental Information (NCEI)
landing_url: https://www.ncei.noaa.gov/access/global-ocean-heat-content/
description: >-
  Ocean heat content anomaly in units of 10^22 joules (1 unit = 10 zettajoules), with standard errors, for the 0-700 m
  and 0-2000 m layers of the World Ocean and its Atlantic, Pacific and Indian basins, from in situ ocean temperature
  profiles. Columns: year + 0.5 (or the middle of a five-year period), then World (or
  basin), Northern and Southern Hemisphere values, each with its standard error. Yearly 0-700 m values start in 1955,
  yearly 0-2000 m values in 2005; earlier 0-2000 m values exist only as five-year (pentadal) means from 1955-59. Values
  are anomalies from NCEI's long-term climatology, so they describe change, not total heat.
