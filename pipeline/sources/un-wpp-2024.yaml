acquisition: automatic
artifacts:
  - id: demographic-indicators-medium
    url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Demographic_Indicators_Medium.csv.gz
    format: csv.gz
    description: >-
      WPP2024_Demographic_Indicators_Medium.csv.gz (gzip-compressed CSV): one row per location and year, estimates
      1950-2023 and medium projection 2024-2100, with total population (thousands) and the other demographic
      indicators. 16,557,272 bytes compressed.
  - id: demographic-indicators-definitions
    url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Demographic_Indicators_notes.csv
    format: csv
    description: >-
      WPP2024_Demographic_Indicators_notes.csv: each indicator's code, topic, full name and unit (for example
      TPopulation1July, "Total Population, as of 1 July", thousands). 4,370 bytes.
  - id: togo-interim-update
    url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/WPP2024_CSV_files_update.zip
    format: zip
    description: >-
      WPP2024_CSV_files_update.zip (19 January 2026): eleven CSV files with Togo's revised estimates and medium
      projection, including WPP2024_Demographic_Indicators_Medium_Update.csv (same columns as the main file). 943,827
      bytes.
status:
  state: active
  note: >-
    WPP 2024 was released on 11 July 2024; an interim update for Togo followed on 19 January 2026. The next revision,
    planned for 2026, has been postponed to 11 July 2027. A UN product, not a US federal programme.
  us_federal: false
update_cadence: Biennial revisions (the 2026 revision postponed to July 2027), with occasional interim updates
next_release:
  expected: 2027-07-11
  note: Next World Population Prospects revision, as announced on the WPP downloads page (Interim Update tab).
  url: https://population.un.org/wpp/downloads?folder=Standard%20Projections&group=Interim%20Update
twins: []
