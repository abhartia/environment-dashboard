# Climate Action Tracker (Climate Analytics and NewClimate Institute): COP30 Global Temperature Update, 13 November 2025
# (the CAT Thermometer, emissions gaps, and global emissions and temperature pathways to 2100).
# Evidence: docs/research/sources-impacts.json ("Climate Action Tracker (CAT) Warming Projections Global Update (COP30,
# Nov 2025)"; verdict "confirmed") and docs/research/sources-solutions-and-action.json ("Climate Action Tracker: CAT
# Thermometer ..."; verdict "confirmed", use CAT's own suggested citation).
# Checked 2026-10-04:
#   - climateactiontracker.org/about/legal/ -> 200 with the terms quoted below ("Copyright © 2009-2026 by Climate
#     Analytics and NewClimate Institute. All rights reserved."). Every sheet of the xlsx repeats them for the file:
#     "Copyright © 2025 by Climate Analytics and NewClimate Institute. All rights reserved." and "You are authorised to
#     view, download, print and distribute the copyrighted content from this data file subject to the following
#     condition: Any reproduction, in full or in part, must credit Climate Analytics and NewClimate Institute, include
#     a copyright notice and must not be used for commerical purposes." (sic).
#   - Class no-derivatives (corrected 2026-10-04 from noncommercial). The terms start from "All rights reserved" and
#     grant only four acts, to "view, download, print and distribute" the content, on condition that "Any
#     reproduction, in full or in part" credits CAT, carries the copyright notice and is non-commercial. Nothing
#     grants a right to adapt, modify or build on the content, so under "All rights reserved" every adaptation stays
#     with the owners: these are CC BY-NC-ND-like terms, not CC BY-NC. The site therefore shows CAT's published values
#     verbatim (the rounded table values, with CAT's own labels), computes nothing from them (no differences,
#     re-baselining, interpolation, unit changes or new aggregates) and offers no download of them. The class keeps
#     the values out of data/, downloads and the public R2 bucket; mirror_raw is false because the model allows no
#     public raw mirror for this class (the terms would allow distributing the unmodified file; it is archived in the
#     private bucket instead). attribution_modified is null because no modified version may exist. The licence_quote
#     starts at "All rights reserved." so the weekly terms check does not break when the page's year range
#     ("Copyright © 2009-2026") moves on.
#   - Rounding: the CAT Thermometer, Global Emissions and GMT sheets say: "We include the unrounded values to assist
#     with the preparation of graphics, however if you are reproducing the numerical values, please adhere to the
#     displayed rounded values in the tables." The tables show warming to 0.1 °C and emissions gaps as whole-number
#     GtCO2e ranges (2030 targets gap 26 – 29; implementation gap 29 – 32 in 2030 and 31 – 37 in 2035).
#   - xlsx -> 200, 1,165,847 bytes, Last-Modified 13 Nov 2025, ETag "c95fceea86569263ba2e163314ae8999b6605470";
#     If-None-Match -> 304. sha256 44044cda8f851f77d6ca0eeb0750848fb6ee32bab50939df2cc2363e63a8c6c1. Linked from
#     /global/cat-thermometer/ ("Last update: 13 November 2025"); /global/temperatures/ now redirects to
#     /global/emissions-pathways/. CAT Thermometer sheet, 2100 warming in °C (lower / median / upper): Policies &
#     action 2.1 / 2.6 / 3.3; 2030 & 2035 targets only 2.1 / 2.6 / 3.2; Pledges & targets 1.8 / 2.2 / 2.8; Optimistic
#     1.5 / 1.9 / 2.4 (MAGICC7).
#   - citation.text: the "Suggested citation" on /global/cat-thermometer/.
id: cat-2025-thermometer
title: "Climate Action Tracker: the CAT Thermometer, November 2025 (COP30 global update)"
publisher: Climate Action Tracker (Climate Analytics and NewClimate Institute)
landing_url: https://climateactiontracker.org/global/cat-thermometer/
description: >-
  Projected global warming in 2100, in degrees Celsius above pre-industrial levels, under four sets of assumptions:
  current policies and action, only the 2030 and 2035 national targets, all pledges and targets, and an optimistic
  case in which every net-zero announcement is met. Each comes with a lower bound, median and upper bound from the
  MAGICC7 climate model. The file also gives the 2030 and 2035 emissions gaps to a 1.5 °C pathway (GtCO2e), global
  emissions to 2100 and warming by decade for each case. Published 13 November 2025, at COP30.
