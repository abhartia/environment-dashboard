    description: >-
      The English report (191 pages): Table 1 and Table 23 give global food waste in 2022 by sector (tonnes and kg per
      person per year); Annex 3 lists household estimates by country (M49 code, kg per person per year, tonnes per
      year, confidence). Country food service and retail tables are in the report's separate Appendix, which is not
      registered here. A person opens
      https://wedocs.unep.org/handle/20.500.11822/45230 in a web browser, downloads
      food_waste_index_report_2024.pdf (the English file, not the _PT or _SP translations), and records it with
      `uv run envdash snapshot add --source unep-food-waste-index-2024 --file food_waste_index_report_2024.pdf`.
