# IMBIE 2026: reconciled mass balance of the Greenland and Antarctic ice sheets, 1971/1979 to 2023 (IMBIE3).
# Evidence: docs/research/sources-ocean-and-ice.json ("IMBIE 2026: Mass balance of the Greenland and Antarctic Ice
# Sheets from the 1970s to 2023 (IMBIE3)"); verifier verdict "confirmed" (OGL v3.0, no access restrictions; 10 files
# dated 2026-07-06; Greenland -6196.15 +/- 467.35 Gt and Antarctica -4779.47 +/- 513.03 Gt cumulative to December 2023;
# the mm files use the mass-balance sign, so the site flips it for "added to sea level"; the C3S ice-sheet figure CSV
# repeats IMBIE rows and is an extension, not an independent series).
# Licence evidence checked 2026-10-04: the UK Polar Data Centre record GB/NERC/BAS/PDC/02074 (HTTP 200) states the
# constraints quoted below; DataCite for doi:10.5285/128c5e33-5224-4197-82f0-19dcc95b80a0 gives rights "Open Government
# Licence V3.0" (version 1.0, DOI created 2026-07-07); every CSV repeats "# license:" with the OGL v3 URL. OGL v3 asks
# for the provider's attribution statement (the citation below) or, failing one, "Contains public sector information
# licensed under the Open Government Licence v3.0", and a link to the licence; it also forbids implying official status
# or endorsement (hence no_endorsement). The data paper (Otosaka et al. 2026, Scientific Data 13, 1301,
# doi:10.1038/s41597-026-08088-0, published 16 Sep 2026) is CC BY 4.0 per Crossref.
# Artifacts checked 2026-10-04: the RAMADDA JSON listing (entry 128c5e33-5224-4197-82f0-19dcc95b80a0) has 10 files,
# all created 2026-07-06T10:07:40Z; each URL below returned HTTP 200 text/csv with the listed byte count and
# Last-Modified 6 Jul 2026, no ETag, and the server ignores If-Modified-Since (HTTP 200), so conditional: false.
# Rows are monthly (Greenland from 1971-07-01, Antarctic regions from 1979-01-01, all to 2023-12-01).
# The CSV headers credit ESA EOEP-5, the ESA Climate Change Initiative and the NASA Cryosphere Program.
# citation.text: the "# citation:" line of the CSVs (the same as the UK Polar Data Centre record), verbatim.
id: imbie-2026
title: Mass balance of the Greenland and Antarctic ice sheets from the 1970s to 2023 (IMBIE 2026)
publisher: IMBIE Team (led from Northumbria University); archived by the NERC EDS UK Polar Data Centre
landing_url: https://data.bas.ac.uk/full-record.php?id=GB/NERC/BAS/PDC/02074
description: >-
  Reconciled estimates of ice sheet mass change from 45 independent satellite surveys (altimetry, gravimetry and the
  input-output method): monthly rate of mass change (Gt per year), cumulative mass anomaly (Gt) and its split into
  surface mass balance and ice dynamics, each with a one-sigma uncertainty, for Greenland (July 1971 to December 2023)
  and for Antarctica as a whole, West and East Antarctica and the Antarctic Peninsula (January 1979 to December 2023).
  A parallel set of files gives the same in millimetres of sea level equivalent, signed as mass balance (negative
  means sea level rise). Ends in December 2023; anything later would come from another source, shown separately.
