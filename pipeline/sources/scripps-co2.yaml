# Scripps CO2 Program, Mauna Loa: in situ monthly CO2 and flask delta-13C of CO2.
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("Scripps CO2 Program"); verifier verdict "corrected"
# (full SIO citation, flask delta-13C starts Feb 1980, the Maunakea relocation note).
# Checked 2026-10-04: station page HTTP 200; both artifacts HTTP 200 with ETag and Last-Modified.
#   monthly_in_situ_co2_mlo.csv: 87,054 bytes, Last-Modified 21 Sep 2026; header "Baseline data in this file through
#     19-Sep-2026 from archive dated 21-Sep-2026 07:50:26"; Aug 2026 = 427.31 ppm. The station column (column 11) reads
#     MKO (Maunakea) for Dec 2022, Jan 2023 and Feb 2023 only and MLO for every other month, although the header still
#     says "Since December 2022 sampling has temporarily been relocated to MaunuaKea" (sic).
#   monthly_flask_c13_mlo.csv: 55,926 bytes, Last-Modified 2 Jul 2026, but the header still reads "Flask data from
#     archive dated 06-Jun-2025 10:00:45"; first value Feb 1980, last value Dec 2024 = -8.71 per mil.
# The file header also offers a peer-reviewed alternative citation: Keeling et al. (2005), "Atmospheric CO2 and 13CO2
# exchange with the terrestrial biosphere and oceans from 1978 to 2000: observations and carbon cycle implications",
# pp. 83-113 in Ehleringer, Cerling and Dearing (eds.), A History of Atmospheric CO2..., Springer.
id: scripps-co2
title: Scripps CO2 Program atmospheric CO2 and carbon-13 records at Mauna Loa
publisher: Scripps Institution of Oceanography, UC San Diego (Scripps CO2 Program)
landing_url: https://scrippsco2.ucsd.edu/data/atmospheric-co2-data/sampling-station-records/mauna-loa-observatory-hawaii/
description: >-
  The original Keeling Curve programme. Monthly mean CO2 from continuous in situ measurements at Mauna Loa Observatory,
  Hawaii, from March 1958, on the 2012 SIO manometric mole fraction scale, and the monthly carbon-13 to carbon-12
  ratio (delta-13C, per mil) of CO2 in flask samples from February 1980. The falling delta-13C is the isotopic
  signature of carbon from fossil fuels and plants. Measured independently of NOAA's Mauna Loa record. Months from
  December 2022 to February 2023 were measured on nearby Maunakea after the 2022 Mauna Loa eruption, as the file's
  station column records. Missing values are -99.99. The vintage is the archive date in each file's header.
