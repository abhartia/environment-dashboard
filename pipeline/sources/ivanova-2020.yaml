# Ivanova et al. (2020), Environ. Res. Lett. 15 093001: the greenhouse gas mitigation potential of 61 household
# consumption options, synthesised from 53 studies.
# Evidence: docs/research/sources-solutions-and-action.json ("Ivanova et al. 2020 ..."); verdict "corrected": there is
# no "7,000 data points" figure (the method is 53 studies, 771 original options, 61 summarised options); the footprints
# of about 6 t (world), 13.4 t (North America), 7.5 t (Europe) and 1.7 t (Africa and Middle East) are for 2011; the
# paper ranks options by MEDIAN, so every chart says whether it shows means or medians. final_redistribution
# open-attribution.
