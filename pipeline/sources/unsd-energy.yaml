# UN Statistics Division Energy Statistics Database, through the UNdata SDMX web service (dataflow DF_UNDATA_ENERGY).
# Evidence: docs/research/sources-energy.json (verification.missing_sources, item 1, "UNSD Energy Statistics Database
# / Energy Balances"), re-checked 2026-10-04. The independent, non-US twin of eia-international.
# Licence: two UNSD statements apply and the stricter one is used.
#   - UNSD's own Energy Statistics data page (terms_url, GET 200 on 2026-10-04) adds "the use is not for profit".
#   - The UNdata terms (https://data.un.org/Host.aspx?Content=UNdataUse, GET 200) say: "All data and metadata provided
#     on UNdata’s website are available free of charge and may be copied freely, duplicated and further distributed
#     provided that UNdata is cited as the reference." The research verifier classed the source open on this text
#     alone; the producer's dataset page is narrower, so the class is noncommercial.
# UNSD publishes no citation string; the UNdata record page credits "Source: Energy Statistics Database | United
# Nations Statistics Division", which citation.text reproduces. {version} is the "Last update in UNdata" date.
# The UNdata bulk "Download" handler stops at 100,000 records (Total Electricity alone has 213,801), so the SDMX API
# documented on the UNSD page (https://data.un.org/WS, dataflow DF_UNDATA_ENERGY, agency UNSD) is used instead.
id: unsd-energy
title: Energy Statistics Database
publisher: United Nations Statistics Division
landing_url: https://unstats.un.org/unsd/energystats/data/
description: >-
  Annual production, trade, transformation and consumption of 75 energy commodities for 245 countries and areas
  (M49 codes), 1990 to 2024, compiled from the UNSD Annual Questionnaire on Energy Statistics. Values are in the
  commodity's own unit (metric tons with a unit multiplier, terajoules, gigawatt-hours or cubic metres) with a
  CONVERSION_FACTOR column to terajoules; OBS_STATUS is A (normal value) or E (estimated value). UNSD's energy
  balances follow the UN International Recommendations for Energy Statistics (physical energy content); this
  dataflow holds the flows of each commodity, not a total across fuels. The latest year is partial: total
  energy supply has values for 227 areas in 2023 and 198 in 2024, total electricity production for 226 in 2023 and
  114 in 2024, and some 2024 totals omit a component (China's 2024 "Total Electricity" production, 3,712,612 GWh, is
  the sum of hydro, nuclear, solar and wind with no thermal value). Values are used as published, never filled.
