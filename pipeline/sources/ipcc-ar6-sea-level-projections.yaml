# sea-level projections by SSP scenario behind IPCC AR6 WGI Chapter 9.
# Evidence: docs/research/sources-impacts.json ("IPCC AR6 Sea Level Projections (global, regional, tide-gauge
# locations)"; verdict "confirmed") and docs/research/sources-ocean-and-ice.json ("IPCC AR6 Sea Level Projections
# (FACTS; NASA/IPCC Sea Level Projection Tool)").
