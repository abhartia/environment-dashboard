# Every country and every CCKP state or province in one file per variable, period, scenario and statistic (expanded
# by envdash/registry.py into 270 ordinary artifacts; see the 2026-10-16 note at the top). Labels are CCKP's own
# wording from the netCDF attributes of the same collections on its S3 bucket, with °C and mm spelled out.
  - id: subnational-names
    url: https://cckpapi.worldbank.org/cckp/v1/cmip6-x0.25_climatology_rx1day_climatology_annual_2040-2059_median_ssp245_ensemble_all_mean/all_countries_subnationals?_format=xlsx
    format: xlsx
    content_key: xlsx-members
    description: >-
      CCKP's names of every country and every CCKP state or province, as the columns code and name of the API's xlsx
      for the rx1day 2040–2059 SSP2-4.5 median collection, whose codes cover every region file of the seven variables
      registered here (246 countries, 3,530 regions on 2026-10-16). Its value column is not read.
    access: {conditional: false}
artifact_grids:
  # 1995–2014 reference period, CMIP6 historical runs: 6 variables × 3 statistics = 18.
  - id: cmip6-{variable}-{period}-{scenario}-{statistic}-subnat
    url: https://cckpapi.worldbank.org/cckp/v1/cmip6-x0.25_climatology_{variable}_climatology_annual_{period}_{statistic}_{scenario}_ensemble_all_mean/all_countries_subnationals?_format=json
    format: json
    description: >-
      CMIP6 multi-model ensemble {statistic_label}, {period_label} reference period ({scenario_label}): {variable_label},
      for every country and every CCKP state or province (all_countries_subnationals).
    access: {conditional: false}
    values:
      variable: &absolute-variables
        hd35: "hot days, the number of days a year with a daily maximum temperature of 35 °C or more (hd35)"
        tr26: "intense tropical nights, the number of nights a year with 26 °C and higher (tr26)"
        hi39: "the number of days a year with a heat index of 39 °C or more (hi39)"
        txx: "the hottest day of the year, the maximum of daily maximum temperatures in °C (txx)"
        rx1day: "the wettest day, the largest single-day precipitation in millimetres (rx1day)"
        cdd: "the longest run of consecutive dry days (under 1 mm of precipitation) in the year (cdd)"
      period:
        1995-2014: 1995–2014
      scenario:
        historical: historical runs
      statistic: &statistics
        median: median
        p10: 10th percentile
        p90: 90th percentile
  # 2020–2039 to 2080–2099 under the low, middle and very high emissions scenarios: 6 × 4 × 3 × 3 = 216.
  - id: cmip6-{variable}-{period}-{scenario}-{statistic}-subnat
    url: https://cckpapi.worldbank.org/cckp/v1/cmip6-x0.25_climatology_{variable}_climatology_annual_{period}_{statistic}_{scenario}_ensemble_all_mean/all_countries_subnationals?_format=json
    format: json
    description: >-
      CMIP6 multi-model ensemble {statistic_label}, {period_label} under {scenario_label}: {variable_label}, for every
      country and every CCKP state or province (all_countries_subnationals).
    access: {conditional: false}
    values:
      variable: *absolute-variables
      period: &future-periods
        2020-2039: 2020–2039
