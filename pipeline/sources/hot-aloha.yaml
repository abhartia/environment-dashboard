# Evidence: docs/research/sources-ocean-and-ice.json ("Hawaii Ocean Time-series (HOT) Station ALOHA surface CO2 system
# data product"); verifier verdict "confirmed" (file header, first and last rows, data policy text and NSF award
# acknowledgement; the verifier prefers an OLS trend over 1989-vs-2024 endpoints because the endpoint result depends on
# the base year).
# Licence evidence checked 2026-10-04: the HOT Data Access page (HTTP 200) states the open-access commitment quoted
# below and says "The following should be cited in publications:" the NSF award sentence carried here as the notice.
# Its other requests are courtesies: contact the team to avoid duplicated effort, consider collaboration, send a
# preprint and reprint. There is no formal licence and no clause restricting copying, modification or
# redistribution, so the class is open with a raw mirror, as for other open data without a licence document
# (compare bereiter-2015-co2). NSF award 2241005, "Hawaii Ocean Time-series (HOT): 2023-2028", University of Hawaii,
# runs 1 August 2023 to 31 July 2028 (NSF award API, 2026-10-04).
# Artifacts checked 2026-10-04: HOT_surface_CO2.txt HTTP 200, 46,975 bytes, ETag "b77f-647be0be1fe1b", Last-Modified
# 6 Jan 2026, answers If-None-Match with 304; header "Last updated 1 January 2026 by J.E. Dore"; cruises 1 (31-Oct-88,
# pHcalc_insitu 8.1097) to 355 (20-Dec-24, 8.0550). HOT_surface_CO2_readme.pdf HTTP 200, 573,080 bytes, Last-Modified
# 6 Jan 2026. Per the readme, a few early DIC and TA values were filled from C. D. Keeling's parallel Station ALOHA
# programme (notes codes a and b), pH is on the total scale, and missing values are -999.
# citation.text: the "cite as adapted from" reference in the file header and readme, verbatim. Crossref confirms
# doi:10.1073/pnas.0906044106 (PNAS 106(30), 12235-12240, 28 July 2009); pnas.org answers scripts with HTTP 403.
id: hot-aloha
title: Hawaii Ocean Time-series surface CO2 system data, Station ALOHA
publisher: Hawaii Ocean Time-series, School of Ocean and Earth Science and Technology, University of Hawai'i at Mānoa
landing_url: https://hahana.soest.hawaii.edu/hot/hotco2/hotco2.html
description: >-
  Surface seawater carbonate chemistry at Station ALOHA, north of Oahu, Hawaii: one mean (0-30 dbar) per HOT cruise,
  roughly monthly from October 1988, of temperature, salinity, dissolved inorganic carbon, total alkalinity, measured
  and calculated pH (total scale, at 25 °C and in situ), CO2 partial pressure, aragonite and calcite saturation states
  and carbonate ion. Calculated pH (pHcalc_insitu) gives the longest continuous record; measured pH starts later. One
  open-ocean station, so it shows the trend at that site, not a global average. Cruises per year vary (5 in 2022).
  Some early carbon values were taken from Scripps' parallel ALOHA measurements, flagged in the notes column.
