artifacts:
  - id: aggi-table
    url: https://gml.noaa.gov/aggi/AGGI_Table.csv
    format: csv
    description: >-
      Annual global effective radiative forcing by gas group (W/m2), total, CO2-equivalent (ppm), AGGI (1990 = 1) and
      annual change (% of 1990 forcing), from 1979. Header: Year,CO2,CH4,N2O,CFC*,HCFCs,HFCs*,Total,Total,1990 =
      1,change *.
  - id: annual-mean-mole-fractions
    url: https://gml.noaa.gov/aggi/NOAA_Annual_Mean_MoleFractions.csv
    format: csv
    description: >-
      Global annual mean dry-air mole fractions of the 22 gases used in the AGGI (CO2 ppm, CH4 and N2O ppb, halocarbons
      ppt), with "nd" for no data and trailing citation rows. The HFC-23 column is AGAGE data (Prinn et al. 2018).
