# EDGAR 2026 GHG booklet ("GHG emissions of all world countries - 2026 Report") spreadsheets, JRC.
# Evidence: docs/research/sources-emissions.json and docs/research/sources-country-and-local.json (EDGAR entries; the
# emissions verdict is "corrected" to noncommercial-only with ND, and the country verdict notes the ND restriction).
# Class no-derivatives: every GHG total, sector total, per-capita and per-GDP value in these files includes IEA-EDGAR
# CO2, which is CC BY-NC-ND 4.0. Only verbatim published values may be shown: no shares, sums, per-capita or rebasing
# computed by us, and no download or mirror. EDGAR CH4, N2O and F-gases on their own are EU-owned and CC BY 4.0.
# Checked 2026-10-04:
#   - dataset_ghg2026 and report_2026: HEAD -> 404, GET -> 200. Both pages carry the identical terms quoted below.
#   - The booklet's own "Citations and references" sheet words the IEA part more strictly: "Users of IEA-EDGAR CO2 data
#     should contact the IEA at compliance@iea.org for permission to use." The web page says to contact the IEA only
#     "if they wish to use such data outside the terms of the CC-BY-NC-ND 4.0 licence". Verbatim display on this
#     non-commercial site is within NC-ND.
#   - jeodpp .../EDGAR_2026_GHG/copyright.txt is the generic EC notice (CC BY 4.0, no IEA carve-out). The more specific
#     booklet and page terms govern.
#   - Booklet: 200, 4,767,596 bytes, Last-Modified 3 Sep 2026, sha256
#     bb77a0da5735925b3a6a64be63dade9e71b57174d5ec6c7eff872274df00f88c. Sheets: info, Citations and references,
#     GHG_totals_by_country, GHG_by_sector_and_country (by substance: CO2, GWP_100_AR5_CH4, _N2O, _F-gases),
#     GHG_per_GDP_by_country, GHG_per_capita_by_country, LULUCF_macroregions, LULUCF_countries. Fossil-CO2-only booklet:
#     200, 1,550,592 bytes, Last-Modified 3 Sep 2026. If-Modified-Since -> 304 on both.
#   - Report PDF (booklet/GHG_emissions_of_all_world_countries_booklet_2026report.pdf, linked from report_2026 as
#     "GHG emissions of all world countries - 2026 Report"): checked 2026-10-05, 200, 6,465,096 bytes, Last-Modified
#     9 Sep 2026, If-Modified-Since -> 304. 301 pages. It states the gas shares of the 2025 world total (PDF page 11)
#     and, in Annex 5 (PDF page 75), the World profile: gas shares and the change by sector (2025 vs 1990, 2005 and
#     2024). The report_2026 web page is not registered: its HTML carries a new nonce on every request, so every fetch
#     would be a new vintage.
#   - attribution_modified is deliberately null: this class allows no transformation beyond extracting the published
#     values, so the plain attribution applies.
id: edgar-2026-ghg
title: "EDGAR 2026: greenhouse gas emissions of all world countries"
publisher: European Commission, Joint Research Centre (JRC), with the International Energy Agency (IEA) for fossil CO2
landing_url: https://edgar.jrc.ec.europa.eu/report_2026
description: >-
  Greenhouse gas emissions of every country from 1970 to 2025, in million tonnes of CO2-equivalent (IPCC AR5 GWP-100):
  totals, totals by sector and gas, per person and per unit of GDP (from 1990), and land use, land-use change and
  forestry by country and by region. A second workbook gives fossil carbon dioxide alone, by country and sector. Totals
  exclude land use, land-use change and forestry. The values for 2025 are fast-track estimates. The fossil carbon dioxide
  component is IEA-EDGAR CO2, licensed CC BY-NC-ND 4.0, so only the published values are used, exactly as published.
