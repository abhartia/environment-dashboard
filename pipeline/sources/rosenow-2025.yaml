# Rosenow, Barnes, Galvin, O'Mara & Lowes (2025), iScience 28, 111784: the total cost of ownership of a heat pump and
# of a gas boiler for an average home in Great Britain, under business as usual and under levy and tariff scenarios.
# Evidence: docs/research/sources-zero-green-premium-papers-2026-10-08.json ("Rosenow et al. 2025 ..."); verdict
# "use". Green Premium work of 2026-10-08.
# Checked 2026-10-08:
#   - cell.com and ScienceDirect do not serve scripts. The article is read from the publisher's article XML that
#     Europe PMC serves (PMC11803245, HTTP 200 application/xml, 132,326 bytes, sha256
#     06688ab35231f1bbb4815d63dc4160763a30ceb96de21bc0faf26bc18576cf87; two downloads gave the same bytes). Its
#     <license> element carries the licence quoted below (ali:license_ref https://creativecommons.org/licenses/by/4.0/),
#     and its <article-id pub-id-type="doi"> is 10.1016/j.isci.2025.111784.
#   - The article's own numbers are used: Table 2 (lifetime cost of ownership by scenario). The inputs (MCS
#     installation costs, DESNZ price projections, Ofgem price cap) are named in the key resources table; the table's
#     totals are the authors' calculation. The Excel file with all calculations is on Mendeley Data
#     (doi:10.17632/xdzxmt2zg6.1, CC BY 4.0 per DataCite); it is not registered because the article states the values.
#   - The article says the heat pump case assumes "grant support for heat pump installs at the current BUS levels"
#     (the Boiler Upgrade Scheme) without printing the amount, so the amount is not stated here either.
id: rosenow-2025
title: Lifetime cost of a heat pump and a gas boiler in Great Britain (Rosenow et al. 2025)
publisher: >-
  Jan Rosenow, Jacob Barnes, Ray Galvin, Samuel O'Mara and Richard Lowes (University of Oxford, University of
  Cambridge, Gemserv, University of Exeter); published in iScience (Cell Press)
landing_url: https://doi.org/10.1016/j.isci.2025.111784
description: >-
  The total cost of ownership over 15 years of an air-source heat pump (seasonal efficiency 2.9, the median of the
  Electrification of Heat trial) and of a gas boiler (85% efficiency) for a typical home in Great Britain: installation
  cost, minus the Boiler Upgrade Scheme grant for the heat pump, plus running costs discounted at 3.5% a year. The
  central case and four sensitivity cases are given under business as usual, alongside scenarios that move levies
  between electricity, gas and general taxation or add a carbon tax on gas.
