#     factors may also be used for other purposes. Regardless of this, their usage is at the users' own risk."
# Factors already include the 8% great-circle distance uplift for flights (methodology paper); the radiative-forcing
# ("With RF") and "Without RF" rows are both published and both are shown. Factor IDs (e.g. 21_316_3170_11_1) are
