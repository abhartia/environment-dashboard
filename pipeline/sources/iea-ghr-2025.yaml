# IEA, Global Hydrogen Review 2025 (September 2025; revised October 2025): statements of the cost gap between
# low-emissions and conventional ammonia, methanol and steel in 2024.
# Evidence: docs/research/sources-zero-green-premium-2026-10-08.json (candidate rank 10), re-checked 2026-10-08
# against the downloaded PDF (the research's reading of pages 51-52 is printed pages 51-52, PDF pages 53-54).
# iea.org pages block scripts; the PDF is served to scripts from the IEA's blob host, and nothing is read from iea.org
# or any copy of it.
# Licence, read 2026-10-08 in the PDF (page 287 of 288, the colophon; terms_url): quoted below; page footers read
# "IEA. CC BY 4.0." The IEA Notice obligations are as recorded in iea-gevo-2026 and iea-etp-2026.
# What the quoted sentences rest on: Figure 2.9 "Levelised cost of production of selected materials by technology,
# 2024" (PDF page 55), credited "IEA. CC BY 4.0." with no third-party source line. Its notes: energy costs are
# regional end-user prices for industry including taxes and charges; "Costs shown here do not include explicit
# financial support but may include financial support embedded in individual cost components (e.g. fossil fuel
# subsidies)"; the CO2 element "represents the cost increase if a USD 100/t CO2 tax were in place".
# Third-party material in this report, not used: Figure 3.8 and the USD 0.8-4.6/kg unabated gas hydrogen range
# (BloombergNEF and Argus), Figure 2.4 (cost premium on end products), and every figure whose source line names
# Argus Media Group, BloombergNEF, S&P Global or McKinsey & Company. The raw PDF holds that material, so it is not
# re-hosted (mirror_raw false) and its tests run on the snapshot.
id: iea-ghr-2025
title: Global Hydrogen Review 2025
publisher: International Energy Agency
landing_url: https://www.iea.org/reports/global-hydrogen-review-2025
description: >-
  The IEA's yearly review of hydrogen production, demand, trade, investment and policy. Chapter 2 states the cost gap
  in 2024 between low-emissions and conventional production of ammonia (European Union: around 25% with carbon capture
  and 120-220% from electrolysis; as little as 5% and 75-160% if a CO2 cost of USD 100 per tonne applied), methanol
  (China: around 70% with carbon capture and 160% from electrolysis, compared with unabated coal; India: 100% for
  electrolytic methanol compared with unabated natural gas) and steel (hydrogen direct reduced iron 50-140% above
  blast furnaces and 20-80% above unabated natural gas DRI, depending on the region). Values are quoted with their
  page.
