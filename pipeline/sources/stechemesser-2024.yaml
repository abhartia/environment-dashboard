# Stechemesser et al. (2024), Science 385:884-892, "Climate policies that achieved major emission reductions: Global
# evidence from two decades": replication data and code on Zenodo (version v4), CC BY 4.0.
# Evidence: docs/research/sources-solutions-and-action.json ("Stechemesser et al. 2024 (Science) ..."); verdict
# "confirmed" (issue date 2024-08-23, online 2024-08-22; the PIK climate-policy-explorer host serves an expired TLS
# certificate, so it is not linked). final_redistribution open-attribution.
# Checked 2026-10-04:
#   - Zenodo record 12773811: version v4, published 2024-07-18, licence cc-by-4.0, 41 files, the latest version of
#     concept 10.5281/zenodo.10046709 (/versions/latest resolves to itself). Each file URL below answered a ranged GET
#     with HTTP 206. Zenodo ignores If-Modified-Since, so conditional is false; the pinned version never changes.
#   - The Science article itself carries no open licence (Crossref lists none; science.org answers HTTP 403 to
#     scripts), so only the Zenodo deposit is used, never text or figures from the article.
#   - The results that list the successful policy interventions and their effect sizes are R data files
#     (Policy_out.RDS 1,285,199 bytes, Break_detection_results.RDS 1,265,170 bytes). Policy_out.RDS is registered
#     (format rds, checked 2026-10-05): a tibble of 8 rows (developed "AC1" and developing "AC6" country samples x 4
#     sectors) whose list-columns hold each sample's detected negative breaks (country, year, coefficient, time
#     confidence interval) and the policies matched to each break within the statistical, 2-year and 3-year windows
#     (03_policy_matching.R). 69 breaks in all; 59 have an OECD-coded policy within 2 years and 4 more an EU policy
#     from EU_policies_label_df.csv, which 06_Fig_4.R's notes add by hand: 63 matched, 6 unmatched.
#     The Zenodo "files-archive" zip is not a substitute: it is generated per request and its sha256 differs on every
#     download (two downloads 3 seconds apart, 41,398,538 bytes each, different hashes).
#   - Upstream terms. The policy data are the OECD Climate Actions and Policies Measurement Framework (CAPMF), a
#     pre-release the authors obtained in July 2023 (README.txt), and OECD IPAC data for the US (March 2023). OECD
#     terms for data (www.oecd.org/en/about/terms-conditions.html, read in the Internet Archive copy of 2026-10-04
#     because the live page returns HTTP 403 to scripts): "you can extract from, download, copy, adapt, print,
#     distribute, share and embed Data for any purpose, even for commercial use. You must give appropriate credit to
#     the OECD". That is attribution-only, so the class stays open, with the OECD credit in the notice. 147 of the
#     1,108 rows of OECD_data_preprocessed.csv (source "add-on") were coded by the authors from the IEA Policies and
#     Measures Database and NewClimate Institute's Climate Policy Database (02_preprocess_oecd_data.R): facts of
#     policy adoption (country, instrument, sector, year).
id: stechemesser-2024
title: Climate policies that achieved major emission reductions (Stechemesser et al. 2024), replication data
publisher: >-
  Stechemesser, Koch, Mark, Dilger, Klösel, Menicacci, Nachtigall, Pretis, Ritter, Schwarz, Vossen and Wenzel (PIK,
  MCC Berlin, OECD and others); article in Science, data and code on Zenodo
landing_url: https://doi.org/10.5281/zenodo.12773811
description: >-
  Replication package for an ex-post evaluation of about 1,500 climate policies in 41 countries from 1998 to 2022 in
  four sectors (buildings, electricity, industry, transport). Structural breaks in sectoral emissions were detected
  with machine learning and matched to policies adopted or tightened around them; the paper identifies 63 successful
  interventions with total emission reductions of 0.6 to 1.8 billion tonnes of CO2 over the sample, and finds that
  pricing within policy mixes did best. The registered files hold the coded policy adoptions and tightenings by
  country, sector and year, the instrument names and categories, and the country lists. The policy coding is a July
  2023 pre-release of the OECD CAPMF, which differs from the current OECD data.
