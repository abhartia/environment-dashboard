# IPCC AR6 Working Group I Figure SPM.1 data, archived at CEDA: 2000 years of global surface temperature (panel a)
# and observed versus simulated warming with and without human influence (panel b).
# Evidence: docs/research/sources-atmosphere-and-temperature.json ("IPCC AR6 WGI Figure SPM.1 data"); verifier
# verdict "confirmed", adding that panel b's model columns end in 2019 and the 2020 row holds the fill value 1.00E+20.
# Licence evidence checked 2026-10-04: the CEDA catalogue record (HTTP 200) states the licence quoted below; every
# BADC-CSV file repeats it in its "rights" row, the dataset's License.txt reads "This work is licensed under a
# Creative Commons Attribution 4.0 International License", and 00README_catalogue_and_licence.txt says the same.
# Artifacts checked 2026-10-04 (all HTTP 200 from dap.ceda.ac.uk with ETag; files dated 16 Nov 2022, version
# directory v20221116, catalogue "This dataset has been completed"):
#   panel_a/SPM1_1-2000_recon.csv 45,757 bytes; panel_a/SPM1_1850-2020_obs.csv 3,790 bytes;
#   panel_a/spm1_6500_recon.csv 1,618 bytes; panel_b/gmst_changes_model_and_obs.csv 20,028 bytes.
# citation.text: CEDA's "Citable as" text, then the report citation CEDA asks to include, both verbatim. The report
# has since been published (Cambridge University Press, 2021, pp. 3-32, doi:10.1017/9781009157896.001); CEDA still
# prints "In Press".
id: ipcc-ar6-wg1-spm1
title: IPCC AR6 WGI Figure SPM.1 data
publisher: IPCC Working Group I Technical Support Unit; archived by the NERC EDS Centre for Environmental Data Analysis
landing_url: https://catalogue.ceda.ac.uk/uuid/0b2759059ad6474098e40dad73e0a8ec/
description: >-
  The data behind Figure SPM.1 of the IPCC Sixth Assessment Report (Working Group I). Panel a: global surface
  temperature change relative to 1850-1900 for years 1-2000 CE, reconstructed from paleoclimate archives (PAGES2k
  Consortium 2019, decadal smoothed, with 5th-95th percentile range), the observed 1850-2020 series (decadal smoothed),
  and the very likely range for the warmest multi-century period in more than 100,000 years (around 6,500 years ago).
  Panel b: annual observed warming 1850-2020 against CMIP6 simulations with human and natural forcings and with natural
  forcings only (ensemble mean and 5-95% range; model columns end in 2019, and the 2020 model values are the fill value
  1.00E+20). Model ranges are simulations, not observations. Files are BADC-CSV: metadata rows, then a data block.
