#     nutrition data came from AGES and the Österreichische Nährwerttabelle; those are not used.
id: falkenberg-2023
title: Prices of plant-based and conventional mince and sausages in Austria (Falkenberg et al. 2023)
publisher: >-
  Christof Falkenberg, Alena Trexler, Christian Garaus and Siegfried Pöchtrager (University of Natural Resources and
  Life Sciences, Vienna); published in Foods (MDPI)
landing_url: https://doi.org/10.3390/foods12112211
description: >-
  Prices, ingredients and nutrition of the 38 plant-based mince and 36 plant-based sausage products sold by the
  nationwide supermarket chains in Vienna in May 2022, compared with conventional minced meat and sausages in the same
  shops. Table 3 gives the mean, standard deviation, median, minimum and maximum price per kilogram in euros for each
  product group. Retail prices in one city and month; conventional meat is not split by species.
