# The State of Carbon Dioxide Removal, 3rd Edition (2026): the data of chapter 7, "Current levels of CDR".
# Evidence: docs/research/sources-zero-levers-and-adaptation-2026-10-08.json, candidates "3. Capture what's left: CCS
# and direct air capture", item "The State of Carbon Dioxide Removal, 3rd Edition (2026): chapter 7 and chapter 3
# data".
# Licence, read 2026-10-08 (GET 200 to the pipeline's client):
#   - Data portal footer (terms_url): "©2026 SoCDR Reports licensed under CC BY 4.0", and above the chapter files
#     "Credit for figure use: 'The State of Carbon Dioxide Removal, 3rd Edition'".
#   - Full report PDF (https://www.stateofcdr.org/asset/State-of-Carbon-Dioxide-Removal-Edition-3_June-2026.pdf, p. 5):
#     "© 2026. The State of Carbon Dioxide Removal report is licensed under a CC BY 4.0 license."
#   Neither statement names the data files themselves; they are the report's chapter data, published beside it on
#   the same portal, so they are taken as covered. To be confirmed with the editors (docs/sources.md).
# Open question, recorded and not resolved: the chapter 7 technical annex says that "For active projects not listed on
# registries, we use the annual delivered CDR reported in CDR.fyi". CDR.fyi's own terms
# (https://www.cdr.fyi/terms-of-service) give no "right to extract, reuse, re-host, or republish data outside the
# Site". A CDR.fyi author (Alexander Rink) co-wrote chapter 7, but whether the report's CC BY grant covers those
# values is unconfirmed. The novel CDR rows are published here under the report's CC BY 4.0 with that caveat.
# Not used: the chapter 3 file (investment rows from the commercial Net Zero Insights database); the chapter 7
# country rows (their maps use GADM boundaries, rejected in this registry; only numbers would be used, and only world
# rows are needed now); the chapter 7 pipeline estimates.
# Errata (https://www.stateofcdr.org/asset/Errata-in-SoCDR-ED3_July_26-1.pdf, Last-Modified 27 Jul 2026, read
# 2026-10-08) list no change to chapter 7.
id: state-of-cdr-3
title: The State of Carbon Dioxide Removal, 3rd Edition (chapter 7 data)
publisher: The State of Carbon Dioxide Removal (University of Oxford Smith School and partners)
landing_url: https://www.stateofcdr.org/data-portal/3rd-edition
description: >-
  Chapter 7 of The State of Carbon Dioxide Removal, 3rd Edition (2026), "Current levels of CDR": carbon dioxide
  removal actually delivered each year. Novel CDR is removal into durable storage by newer methods (biochar, BECCS,
  direct air capture with storage, enhanced weathering, mineral products, biomass burial and others), compiled
  project by project from registries, government data and CDR.fyi, 2017 to 2025; direct air capture counts only where
  the CO2 is shown to reach durable storage. Conventional CDR is removal by managed forests (afforestation,
  reforestation and forest management), from three bookkeeping models (BLUE, LUCE, OSCAR) and their mean, 2005 to
  2024. Values are in million tonnes of CO2 a year.
