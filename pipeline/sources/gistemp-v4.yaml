  - id: glb-monthly
    url: https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv
    format: csv
    description: >-
      Global land-ocean temperature index: monthly, seasonal and annual (J-D) anomalies from January 1880, °C relative
      to 1951–1980. Two header lines; "***" marks months not yet reported.
  - id: zonal-annual
    url: https://data.giss.nasa.gov/gistemp/tabledata_v4/ZonAnn.Ts+dSST.csv
    format: csv
