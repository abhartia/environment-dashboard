id: bereiter-2015-co2
title: Antarctic ice cores revised 800,000-year CO2 composite
publisher: NOAA NCEI World Data Service for Paleoclimatology (data by Bereiter et al., University of Bern and partners)
landing_url: https://www.ncei.noaa.gov/access/paleo-search/study/17975
description: >-
  Atmospheric CO2 (ppm, with one-sigma uncertainty) from air trapped in Antarctic ice, stitched together from Law Dome,
  Dome C, WAIS Divide, Siple Dome, Talos Dome, EPICA Dronning Maud Land and Vostok, from 805,669 years before 1950 to
  2001. Gas age is in years before 1950 (AD = 1950 - age); the most recent 1,800 years come from Law Dome (Rubino et
  al. 2013). Ice-core air is smoothed over decades to centuries, so brief spikes would not show. Replaces the Luthi et
  al. (2008) composite. Static: no updates expected.
