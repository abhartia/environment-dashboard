title: Remaining carbon budget for 1.5 °C from the start of 2026 (Global Carbon Budget)
description: >-
  How much more carbon dioxide could be emitted from the beginning of 2026 for an even (50 percent) chance of
  limiting global warming to 1.5 °C, according to the Global Carbon Budget 2025: 170 billion tonnes, which the paper
  puts at around 4 years of emissions at the 2025 level.
