  - id: stocktake-2025-csv
    url: https://zenodo.org/api/records/17143240/files/Data_finalised_for_Zenodo_16_09(Sheet1).csv/content
    format: csv
    description: >-
      Data_finalised_for_Zenodo_16_09(Sheet1).csv: one row per entity (4,083), cp1252-encoded, with the target
      fields, the Tracker's analysis flags (data_is_nzt, "No target at all", end-target year bands, "4P" criteria) and
      GDP, population and emissions context columns. About 8.5 MB.
    access:
