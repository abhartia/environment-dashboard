# Global Carbon Budget 2025: global carbon dioxide sources and sinks (the "bathtub"), final v1.0 data on ICOS.
# Evidence: docs/research/sources-emissions.json ("Global Carbon Budget 2025: national fossil CO2 ..."). The verdict there
# is "corrected": pin the ICOS v1.0 object PIDs, not the globalcarbonbudget.org/download links (Nov 2025 pre-release).
# Checked 2026-10-04:
#   - meta.icos-cp.eu/objects/qSjPBsV1drZnYdH-yCJMmkGn: Global_Carbon_Budget_2025_v1.0.xlsx, 480,363 bytes, submitted
#     2026-05-17, latestVersion = itself, licence "ICOS CCBY4 Data Licence" (baseLicence CC BY 4.0).
#   - GET data.icos-cp.eu/objects/<pid> -> 302 to /licence?ids=...; that page's "Yes, I accept" link is
#     /licence_accept?ids=..., which answers 302 + Set-Cookie CpLicenseAcceptedFor=<pid>. GET with the cookie -> 200,
#     480,363 bytes, sha256 a928cf06c57576b66761d1fec8224c9a41a781eb63442afc03ba902858dd64a9 (matches the PID hash).
#     HEAD -> 404, but a GET with If-None-Match -> 304, so conditional GETs work.
#   - Acquisition is automatic: the click-through is a plain GET with no login or captcha, ICOS says originals "can be
#     performed anonymously" after licence acceptance (github.com/ICOS-Carbon-Portal/data README), and the licence
#     accepted is the CC BY 4.0 quoted below. Not yet run from a GitHub runner.
#   - Sheets: Summary, Global Carbon Budget (1959-2024), Historical Budget (1750-2024), Fossil Emissions by Category
#     (1850-2024), Land-Use Change Emissions, Atmospheric Growth, Ocean Sink, Terrestrial Sink, Cement Carbonation Sink.
#     The file has no 2025 projection; the 2025 figure (+1.0%) exists only in the ESSD paper.
#   - The file's Summary still cites the ESSD discussion paper (essd-2025-659). The ICOS page and the object description
#     cite the final paper (ESSD 18, 3211-3288, 2026), which is used here.
#   - The GCP terms in the file and on the ICOS page: "The use of data is conditional on citing the original data
#     sources. Full details on how to cite the data are given at the top of each page." Those per-sheet citations are in
#     obligations.notice.
id: gcb-2025-global
title: "Global Carbon Budget 2025: global sources and sinks of carbon dioxide"
publisher: Global Carbon Project
landing_url: https://www.icos-cp.eu/GCP/2025
description: >-
  The yearly global carbon dioxide budget from 1959 to 2024: emissions from fossil fuels and industry (before the cement
  carbonation sink is subtracted) and from land-use change, and where that carbon went (growth in the atmosphere, the
  ocean sink, the land sink and the cement carbonation sink), with the budget imbalance. A historical budget runs from
  1750, and fossil emissions are split by fuel from 1850. Values are in billion tonnes of carbon per year; multiply by
  3.664 for carbon dioxide. The atmospheric growth comes from NOAA Global Monitoring Laboratory measurements, and from
  Scripps Institution of Oceanography measurements at Mauna Loa and the South Pole for 1959 to 1980.
