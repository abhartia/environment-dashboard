# Scarborough et al. (2023), Nature Food 4, 565-574: daily dietary environmental footprints of vegans, vegetarians,
# fish-eaters and low, medium and high meat-eaters in the UK (EPIC-Oxford cohort), standardized to 2,000 kcal.
# We use the open-access article's tables and its source data files only.
# Evidence: docs/research/sources-food-land-nature.json ("Scarborough et al. (2023) diet-group impacts, Nature Food");
# verdict "corrected" (the GWP20 high-meat/vegan ratio is 5.4x, not 5.1x), final_redistribution open-attribution.
# NOT the ORA dataset (doi:10.5287/ora-5zebayaog, Results_21Mar2022.csv): its DataCite rights are
# rioxx all-rights-reserved and ORA terms allow one copy for private non-commercial study. The code repository
# github.com/PeteScarbs/environment-impact-of-diets has no licence. Neither is ingested.
# Terms checked 2026-10-04: Europe PMC full-text XML (PMC10365988, HTTP 200 application/xml) <license> element, quoted
# below; the same paragraph appears under "Rights and permissions" on nature.com and on the PDF's last page. Crossref
# (api.crossref.org/works/10.1038/s43016-023-00795-w) gives license https://creativecommons.org/licenses/by/4.0 for
# both the version of record and text mining, from 2023-07-20.
# The source data workbooks are listed on the article page under "Source data" ("Source data are provided with this
# paper"); we treat them as part of the article and its CC BY 4.0 licence.
# Artifacts checked 2026-10-04:
# - Article PDF: nature.com answers HTTP 303 to idp.nature.com (a cookie check) and, after the redirects, HTTP 200
#   application/pdf, 1,422,647 bytes, 10 pages; Tables 3 and 4 extract cleanly with pdftotext -layout. The redirect
#   chain adds a one-time query string, so conditional is false.
# - Source Data Fig. 2 (MOESM3) and Fig. 3 (MOESM4) on media.springernature.com: HTTP 200 directly, 9,819 and 10,525
#   bytes, ETag and Last-Modified 2023-10-26.
# The Europe PMC JATS XML holds the same tables in machine-readable form and needs no redirects, but Artifact.format
# has no "xml" value, so it is not registered as an artifact here.
id: scarborough-2023
title: Environmental impacts of UK diet groups (Scarborough et al. 2023)
publisher: University of Oxford (Scarborough, Clark, Springmann et al.), published in Nature Food
landing_url: https://doi.org/10.1038/s43016-023-00795-w
description: >-
  Daily dietary footprints per person for six self-reported diet groups among 55,504 UK adults in the EPIC-Oxford
  cohort, standardized to 2,000 kcal, from food-level life-cycle data (about 570 studies) with sourcing variation:
  greenhouse gas emissions (kg CO2e per day under GWP100, GTP100 and GWP20, and CO2, CH4 and N2O separately), land
  use (m2 per day), water use (m3 per day), eutrophication (g PO4e per day) and biodiversity (10^-12 species extinctions
  per day). Medians with 95% uncertainty intervals from a 1,000-iteration Monte Carlo. UK diets in a health-conscious
  cohort, not a global average; cross-sectional, published once.
