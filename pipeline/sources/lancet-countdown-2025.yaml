id: lancet-countdown-2025
title: "Lancet Countdown 2025: heat-related deaths, work hours lost to heat and heatwave exposure"
publisher: Lancet Countdown on Health and Climate Change (led by University College London)
landing_url: https://lancetcountdown.org/explore-our-data/
description: >-
  Indicator data behind the 2025 report of the Lancet Countdown on health and climate change. Indicator 1.1.5:
  deaths attributable to heat (number and share of all deaths), 1990 to 2021, for the world, WHO regions, Lancet
  Countdown regions and Human Development Index groups, with no country values. Indicator 1.1.3: potential work hours
  lost to heat, in total and for services, manufacturing, agriculture and construction, 1990 to 2024, for the world,
  regions, HDI groups and 219 countries. Indicator 1.1.1, two workbooks: heatwave days per person observed in 2020 to
  2024 compared with a modelled climate without human-caused warming, for the world and 220 countries; and heatwave
  days experienced by infants and people over 65, 1980 to 2024. Heat mortality is modelled, not counted.
