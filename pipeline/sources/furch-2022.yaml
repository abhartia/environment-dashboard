# Furch, Konečný & Krobot (2022), Scientific Reports 12, 10661: the life cycle cost of passenger cars with petrol,
# diesel, CNG, hybrid and battery electric drives on the Czech market.
# Evidence: docs/research/sources-zero-green-premium-papers-2026-10-08.json ("Furch et al. 2022 ..."); verdict "use
# with caveat" (fuel and electricity unit prices are not tabulated with sources). Green Premium work of 2026-10-08.
# Checked 2026-10-08:
#   - The article is read from its JATS XML on Europe PMC (PMC9226055, HTTP 200 application/xml, 119,716 bytes); the
#     <license> element carries the licence quoted below. nature.com serves the same article.
#   - Table 1 is the authors' own life cycle cost model (equations 18-20) for one car model per drive on the Czech
#     market in 2022, over 400,000 km and 15 years. Its "Life cycle specific costs LCCS" row prints no unit; equation
#     20 defines it as the life cycle cost (euros) divided by the service life (kilometres).
#   - The electric car's battery: Table 1's electric column lists "Accumulator battery costs" of 18,184, and the text
#     (p. 13) states "if the vehicles were operated up to a range of 400,000 kms, the specific cost of an electric
#     vehicle without battery replacement is €0.21, for an electric vehicle with battery replacement is €0.25". The
#     table's electric value is published as printed with that sentence in its note; the text's rounded values are
#     not published.
id: furch-2022
title: Life cycle cost of passenger cars by drive type, Czech market (Furch et al. 2022)
publisher: >-
  Jan Furch, Vlastimil Konečný and Zdeněk Krobot (University of Defence, Brno); published in Scientific Reports
landing_url: https://doi.org/10.1038/s41598-022-14715-8
description: >-
  A life cycle cost model for passenger cars applied to six cars offered on the Czech market in 2022 (petrol, diesel,
  petrol and CNG, plug-in hybrid, mild hybrid and battery electric): purchase price, fuel or electricity, fluids,
  tyres, batteries, mandatory costs and corrective and preventive maintenance over 400,000 km and 15 years, in euros,
  and per kilometre. One car model per drive; not a market average.
