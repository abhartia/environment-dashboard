# along warming pathways reaching 1.5 to 3.5 °C by 2100.
# Evidence: docs/research/sources-consequences-2026-10-11.json ("Grant et al. 2025 ..."; verdicts "corrected" and
# "confirmed"), and the extremes critic in docs/research/sources-extremes-2026-10-12.json. "So what" work of
# 2026-10-12 (children born today).
# Checked 2026-10-12:
#   - The article is read from its JATS XML on Europe PMC (PMC12058528, the publisher's own deposit in PMC's
#     "npgopen" domain): HTTP 200 application/xml, 112,126 bytes, sha256
#     4224ab518159b19d8ca09c2cdc673d6e34ccb24d674c8df6bcca0a53c341ad3c; two downloads gave the same bytes; Europe PMC
#     sends no Last-Modified or ETag. Its <license> element carries the licence quoted below (ali:license_ref
