  note: >-
    NCEI updates the file about monthly (the 4 September 2026 release runs to the week of 31 August 2026) and removes
    the previous one; the fetch finds the new name from the directory listing. The record depends on the US National Ice
    Center's IMS charts and NOAA's CDR Program; the FY2027 US budget request (April 2026) proposes cutting NCEI by $17.8
    million.
