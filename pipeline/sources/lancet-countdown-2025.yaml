    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.5_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.5, heat-related mortality: sheets DATA GUIDANCE, Global, WHO, LC and HDI with Year, AF (percent of
