[project]
name = "envdash"
version = "0.1.0"
description = "Environment Dashboard data pipeline: fetch, snapshot, transform, validate and export every published number with its provenance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "polars>=1.30",
    "boto3>=1.38",
    "zstandard>=0.23",
    "openpyxl>=3.1",
    "typer>=0.16",
    "pypdf>=6.19.0",
    "netcdf4>=1.7.4",
    "pyreadr>=0.5.7",
]

[project.scripts]
envdash = "envdash.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typography (en dashes, °C, subscript ₂) is deliberate in user-facing strings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["envdash"]
known-local-folder = ["support", "make_fixture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "snapshot: needs full raw snapshots (local cache or R2); run by the weekly routine and locally, not in CI",
    "network: fetches from the internet",
]
addopts = "-m 'not snapshot and not network'"
