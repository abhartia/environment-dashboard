  note: >-
    Updated daily (the 4 October 2026 file runs to 3 October). The landing page says the data set was "recently
    downgraded to a 'Basic' Level of Service" because of funding limitations: data integrity is still verified, but
    support is limited. Funded by NOAA; Version 4 (released July 2025) moved to AMSR2 input from 1 January 2025.
  us_federal: true
