artifacts:
  - id: heat-mortality-1-1-5
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.5_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.5, heat-related mortality: sheets DATA GUIDANCE, Global, WHO, LC and HDI with Year, AF (percent of
      deaths attributable to heat) and AN (deaths attributable to heat), 1990-2021. No country sheet.
  - id: work-hours-lost-1-1-3
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.3_PWHL_Data-Download_2025-Lancet-Countdown-Report_v2-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.3, potential work hours lost: sheets Country, Global, WHO and HDI, 1990-2024. Hours lost by sector
      (WHL200Serv, WHL300Manuf, WHL400sunAgr, WHL400sunConstr) and in total (TotalSunAgCon), in thousands of hours,
      plus hours lost per worker (TotalSunWHLpp).
  - id: heatwave-days-attributable-1-1-1
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.1_Attributable_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.1, heatwave days per person: Observed, Counterfactual (without human-caused warming) and
      Attributable_to_CC, for each year 2020-2024, on a country sheet and a global sheet.
  - id: heatwave-exposure-vulnerable-1-1-1
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.1_Vulnerable_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.1, heatwave exposure of infants under 1 and adults over 65: total person-days and average days per
      person, 1980-2024, on Country, Global, WHO, LC and HDI sheets (the Global sheet also has over-75s).
  - id: air-pollution-deaths-3-2-1
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-3.2.1_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 3.2.1, mortality from ambient air pollution by sector and fuel (IIASA GAINS model): sheets Global, HDI
      Level, Lancet Countdown Region and WHO Region, 2007-2022, one row per year and sector (power plants, industry,
      transport, households, waste, agriculture, other) with deaths attributable to PM2.5 from coal, liquids and gas,
      biomass and other sources. The Global sheet also has deaths per 100,000 people and PM2.5 concentrations. No
      country sheet.
  - id: wildfire-smoke-deaths-1-2-1
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.2.1_Mortality_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.2.1, fire smoke (mortality workbook): deaths due to fire-originated PM2.5 (column Mortality),
      2003-2024, on Country, Global, WHO, LC and HDI sheets.
  - id: drought-land-share-1-2-2
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.2.2_Data-Download_2025-Lancet-Countdown-Report.xlsx
    format: xlsx
    description: >-
      Indicator 1.2.2, drought: percent of land area with at least 1, 3, 6 or 12 months of extreme drought (SPEI-6,
      against 1986-2005) in each year, on Country (1950-2024), Global (1951-2024, long format), WHO, LC and HDI sheets.
  - id: extreme-precipitation-1-2-3
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.2.3_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.2.3, extreme precipitation (ERA5-Land): sheet Event_Global, the land-area-weighted average count of
      daily events above the 1961-1990 99th percentile in each year of 1961-1990 and 1995-2024; sheet Land_Global, the
      share of land with more or fewer such events than in 1961-1990 in rolling windows of nine or ten years.
