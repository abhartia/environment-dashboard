# Naturvårdsverket: consumption-based greenhouse gas emissions per person and year in Sweden, by consumption area.
# Evidence: docs/research/sources-ghg-food-personal-2026-10-05.json (research need C, rank 1; verifier verdict
# adopt-with-changes; every verifier problem is handled below or in the transform).
# Checked 2026-10-05:
#   - https://www.naturvardsverket.se/om-oss/om-webbplatsen/struktur-och-funktion/ -> 200. Under 'Upphovsrätt' >
#     'Öppna data' it carries the first sentence of licence_quote. The same section says most photographs and
#     illustrations on the site are protected by copyright, and the link policy asks that the Naturvårdsverket logo is
#     not used.
#   - https://www.scb.se/vara-tjanster/oppna-data/ -> 200 with the CC0 sentence quoted second. The statistics page
#     names 'ANSVARIG MYNDIGHET: Statistikmyndigheten SCB' and carries the Sveriges officiella statistik logo: the
#     figures are SCB official statistics, so the CC0 on SCB's open data is the firmer basis, and the third-party funder
#     clause of Naturvårdsverket's terms does not apply.
#   - The quote spans two pages, so the weekly run cannot match it at one terms_url: terms_check is manual (a person
#     re-reads both pages each quarter).
#   - The page: HTTP 200, 231,605 bytes; no ETag or Last-Modified (conditional false). Two curl fetches a minute apart
#     gave the same bytes (sha256 da4e1b4d…), while envdash fetch got ac383cb0… of the same length: the site's
#     navigation menu marks a different item 'isActive' between requests. The data payload is identical in both, so
#     an occasional new snapshot with unchanged values is expected. The page model is the
#     JSON in <script id="__model_data" type="application/json">; its content.highChartsOptions is a JSON string whose
#     data.csv holds the series: header '"null";"Transporter ";"Livsmedel ";"Boende ";"Övrigt ";"Offentlig konsumtion
#     ";"Investeringar ";"Totalt "', rows 2008-2023, y-axis 'Ton koldioxidekvivalenter per person'. lastReviewed
#     2025-10-28 ('Granskad: 28 oktober 2025'). The page says 'Nästa uppdatering: Hösten 2026 (med data t.o.m. 2024)'.
# mirror_raw is false: the open-data clause and SCB's CC0 cover the statistics, not the page's own text, and the page
# names its photographs and illustrations as copyright-protected. Fixtures therefore hold only the bytes of the data.csv
# payload (tests/fixtures/naturvardsverket-consumption-footprint/), never the page text.
id: naturvardsverket-consumption-footprint
title: Konsumtionsbaserade växthusgasutsläpp per person och år (consumption-based greenhouse gas emissions per person)
publisher: Naturvårdsverket (Swedish Environmental Protection Agency); official statistics from Statistics Sweden (SCB)
landing_url: https://www.naturvardsverket.se/data-och-statistik/konsumtion/vaxthusgaser-konsumtionsbaserade-utslapp-per-person/
description: >-
  The greenhouse gas footprint of an average person in Sweden, in tonnes of carbon dioxide equivalent per person per
  year, 2008-2023: the emissions, in Sweden and abroad, from producing everything used in Sweden, divided among its
  population. Split into six parts that do not overlap: household transport, food, housing and other household
  consumption, plus public consumption (schools, hospitals, agencies) and investment (buildings, machinery, valuables
  and stocks), which are not personal choices. Built by SCB's environmental accounts with an environmentally extended
  input-output model. International flights are undercounted (only jet fuel bought in Sweden, no stopovers, no
  high-altitude effect). Sweden only.
