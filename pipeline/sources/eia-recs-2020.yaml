# US Energy Information Administration, 2020 Residential Energy Consumption Survey (RECS), Table CE2.1: annual
# household site fuel consumption, totals and averages.
# Evidence: docs/research/sources-zero-space-and-power-2026-10-08.json (question b, rank 3).
# Licence: EIA "Copyrights and Reuse" page, as for eia-international. The table's own footer credits only EIA ("Data
# source: U.S. Energy Information Administration, Office of Energy Demand and Integrated Statistics, Forms EIA-457A,
# D, E, F, & G of the 2020 Residential Energy Consumption Survey").
# citation.text is EIA's requested acknowledgement form ("Source: U.S. Energy Information Administration (Oct 2008)."
# on the same page), with the table's final release date (March 2024, printed in the workbook).
# Checked 2026-10-08: ce2.1.xlsx GET 200, 37,081 bytes, Last-Modified Mon 25 Mar 2024, ETag "80265728ed7eda1:0",
# sha256 14c8a8c29b419eae27a477347cf70569720544ce51d441e391f4e97d540ef7ff. The technical documentation PDF: GET 200,
# 681,860 bytes, Last-Modified Wed 21 May 2025, sha256
# fdc47fbc71fb0a90ca229e42b6f501a6ea95f8a085377e05c334d45640ac7ebf; page 13 says the consumption estimates cover
