title: Life-cycle emissions of a battery electric car in the EU (ICCT)
description: >-
  Greenhouse gas emissions over the whole life of a medium-size battery electric car sold in the European Union in
  2025, per kilometre driven: making the car and its battery, producing the electricity it uses on the EU's projected
  average grid mix for 2025-2044, maintenance and recycling. The ICCT estimates it at 63 grams of CO2-equivalent per
  kilometre, 73 percent less than a comparable petrol car.
