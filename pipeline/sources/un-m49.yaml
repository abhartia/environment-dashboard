# UN Statistics Division, Standard country or area codes for statistical use (M49): numeric codes, ISO alpha-2 and
# alpha-3 codes, and the region, sub-region and intermediate-region hierarchy, with LDC, LLDC and SIDS flags.
# Evidence: docs/research/sources-country-and-local.json ("UN M49 Standard country or area codes for statistical use
# (and the SDG GeoArea tree API)"); verdict "confirmed", final_redistribution unclear, with the mitigation adopted
# here: store only the factual code-to-region mapping, with citation.
# Checked 2026-10-04:
#   - https://unstats.un.org/unsd/methodology/m49/overview/: HTTP 200 text/html, 1,721,575 bytes, 1,494 <tr> rows (the
#     table in six languages), no ETag or Last-Modified (conditional false). No dataset licence on the page; its footer
#     links "© 2026 United Nations" and "Terms of Use" (http://www.un.org/en/aboutun/terms/, which redirects to the
#     page quoted below).
#   - UN website Terms of Use: permission is for "personal, non-commercial use, without any right to resell or
#     redistribute them or to compile or create derivative works therefrom". So the class is display-only: the page is
#     never mirrored or downloaded from the site, and no UN text or table is republished. The codes and the region each
#     code belongs to are used as facts, inside the pipeline's entity crosswalk, credited to UNSD; as a display-only
#     source, nothing from it is exported to data/ in its own right.
#   - Not registered: the SDG GeoArea tree API (https://unstats.un.org/SDGAPI/v1/sdg/GeoArea/Tree, HTTP 200 JSON),
#     which carries the same codes in SDG regional groupings; the M49 page alone gives the hierarchy the site uses.
#   - UNSD publishes no recommended citation for the online table; the citation below uses the page title and URL.
id: un-m49
title: Standard country or area codes for statistical use (M49)
publisher: United Nations Statistics Division
landing_url: https://unstats.un.org/unsd/methodology/m49/
description: >-
  The United Nations standard list of countries and areas for statistics: three-digit M49 codes with ISO 3166-1
  alpha-2 and alpha-3 codes, grouped into regions, sub-regions and intermediate regions (for example Africa >
  Sub-Saharan Africa > Eastern Africa), with flags for Least Developed Countries, Landlocked Developing Countries and
  Small Island Developing States. Used only as a join key and for "compare with your region" groupings; M49 regions
  differ from World Bank regions.
