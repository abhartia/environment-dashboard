# IEA, The Role of E-fuels in Decarbonising Transport (December 2023; revised January 2024): the statement of how much
# more a containership running on e-ammonia or e-methanol would cost to own and operate in 2030.
# Evidence: docs/research/sources-zero-green-premium-2026-10-08.json (candidate rank 11), re-checked 2026-10-08
# against the downloaded PDF.
# iea.org pages block scripts; the PDF is served to scripts from the IEA's blob host, and nothing is read from iea.org
# or any copy of it.
# Licence, read 2026-10-08 in the PDF (page 75 of 76, the colophon; terms_url): quoted below; page footers read
# "IEA. CC BY 4.0." The IEA Notice obligations are as recorded in iea-gevo-2026 and iea-etp-2026.
# What the statement rests on: Figures 5.6 and 5.7 (PDF pages 56-57), both credited "IEA. CC BY 4.0." with no
# third-party source line. Figure 5.7's assumptions: a 9,600 TEU containership with a 58 MW engine at 16 knots,
# 100,000 nautical miles a year; heavy fuel oil USD 15/GJ; levelised cost of ammonia USD 30/GJ and of methanol
# USD 35/GJ in 2030 (point-source CO2); port charges and handling fees excluded.
# Not used: one figure on PDF page 47 carries a third-party "All rights reserved" line. The raw PDF is therefore not
# re-hosted (mirror_raw false) and its tests run on the snapshot.
id: iea-efuels-2023
title: The Role of E-fuels in Decarbonising Transport
publisher: International Energy Agency
landing_url: https://www.iea.org/reports/the-role-of-e-fuels-in-decarbonising-transport
description: >-
  The IEA's assessment of electricity-based fuels (e-kerosene, e-methanol, e-ammonia) for aviation and shipping: their
  production costs, resource needs and the investment required for a 10% share by 2030. Its executive summary states
  that the total cost of ownership of a containership running entirely on e-ammonia or e-methanol would be 75% higher
  than a conventional containership on fossil fuels (2030, IEA analysis). Quoted with its page.
