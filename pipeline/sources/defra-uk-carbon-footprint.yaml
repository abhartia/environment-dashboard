# Defra: UK and England's carbon footprint to 2023 (consumption-based greenhouse gas emissions, 1990-2023).
# Evidence: docs/research/sources-ghg-food-personal-2026-10-05.json (research need C, rank 2; verifier verdict adopt;
# every verifier problem is handled below or in the transform).
# Checked 2026-10-05:
#   - GOV.UK content API (https://www.gov.uk/api/content/government/statistics/uks-carbon-footprint) -> 200: title
#     "UK and England's carbon footprint to 2023", first published 2012-12-13, change history "Annual update."
#     2026-06-30T08:30:07Z, then corrections on 2026-07-07 (text under Figure 4) and 2026-07-24 (England dataset), so
#     public_updated_at 2026-07-24. Attachments: the UK dataset ODS (98,019 bytes) and the figures and tables ODS
#     (36,646 bytes), both application/vnd.oasis.opendocument.spreadsheet, at per-revision media URLs (a corrected file
#     gets a new media id, so these URLs pin the 30 June 2026 release).
#   - The licence is stated in the UK dataset itself (Cover_sheet, 'Copyright'), quoted below. terms_url is that file;
#     its text cannot be matched by the weekly page check (an OpenDocument spreadsheet is a zip), so terms_check is
#     manual, and the transform also refuses any vintage whose Cover_sheet no longer carries the quote. The GOV.UK
#     page footer adds "All content is available under the Open Government Licence v3.0, except where otherwise
#     stated".
#   - Methods (UK_and_England_s_Carbon_Footprint_Summary_of_Methods_2026.pdf, per the verifier): GWP100 from the IPCC
#     Fifth Assessment Report (AR5); produced by the University of Leeds with a multi-regional input-output model
#     (EXIOBASE v3.8.3 and FIGARO v2025 for the rest of the world); no third-party licence exception is stated.
# ArtifactFormat has no 'ods': an OpenDocument spreadsheet is a zip package (its first member is 'mimetype'), so the
# artifacts are declared as zip and read member by member (content.xml).
id: defra-uk-carbon-footprint
title: UK and England's carbon footprint to 2023
publisher: Department for Environment, Food & Rural Affairs (Defra); data produced by the University of Leeds
landing_url: https://www.gov.uk/government/statistics/uks-carbon-footprint
description: >-
  The UK's carbon footprint: greenhouse gas emissions caused by what UK residents, government and businesses' capital
  investment consume, wherever in the world the emissions happen, plus households' own emissions from heating homes
  and driving. In thousand tonnes of carbon dioxide equivalent (and tonnes per person for the total), 1990-2023, split
  by final demand, by household product (34 COICOP groups) and, for 2023, by broad category of end use. Estimated by
  the University of Leeds with a multi-regional input-output model; 1990-1996 are more uncertain, and every annual
  release revises earlier years. Flights have no separate figure. UK only.
