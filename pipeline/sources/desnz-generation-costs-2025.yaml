# UK Department for Energy Security and Net Zero, Electricity Generation Costs 2025: the report and its Annex A.
# Evidence: docs/research/sources-zero-green-premium-2026-10-08.json (candidate rank 2), re-checked 2026-10-08.
# Licence: the report's page 2 (terms_url) quotes OGL v3.0 "except where otherwise stated" and asks for permission for
# "third-party copyright information" it identifies; none is identified on the Annex A tables. The renewable cost
# inputs were commissioned from Arup and the hydrogen-to-power inputs from Baringa and are published by DESNZ as Crown
# copyright; fuel and carbon prices are DESNZ's own assumptions; gas CCUS capture-plant capex is DESNZ internal
# analysis with WSP, the other gas CCUS components come from the 2020 Generation Costs Report.
# GOV.UK content API (2026-10-08): first published 2026-01-14; updated 2026-03-18 "Inclusion of LCOE Totals row in
# Annex A."
# Why this source: a twin of eia-aeo-2026 for the United Kingdom. Annex A gives, in one table per commissioning year
# and on one set of assumptions (real 2024 pounds, DESNZ central fuel and carbon prices), the levelised cost of
# unabated gas plants and of gas with carbon capture at the same illustrative load factors of 5% and 30% (baseload is
# 93% for unabated gas and 88% for gas CCUS), next to renewables and hydrogen plants. Totals include carbon costs (UK
# ETS price plus the Carbon Price Support), which Annex A publishes as their own row, so both are shown. DESNZ's own
# caution, report section 5: "It is not appropriate to present LCOEs comparatively when technologies play very
# different roles in the power system."
id: desnz-generation-costs-2025
title: Electricity Generation Costs 2025
publisher: Department for Energy Security and Net Zero (UK)
landing_url: https://www.gov.uk/government/publications/electricity-generation-costs-2025
description: >-
  DESNZ's estimates of the levelised cost of electricity for new plants in the United Kingdom commissioning in 2030,
  2035, 2040, 2045 and 2050, in real 2024 pounds per megawatt-hour, split into pre-development, construction, fixed and
  variable operation and maintenance, fuel, carbon, CO2 transport and storage, decommissioning, steam revenue and
  additional costs, with the total. Technologies: large-scale solar, onshore wind, fixed and floating offshore wind,
  gas CCGT, gas OCGT (300 and 760 MW) and gas reciprocating engines at 5%, 30% and 93% load factors, gas with
  post-combustion carbon capture (CCUS) at 5%, 30% and 88%, hydrogen turbines (CCHT, OCHT) and engines, tidal stream
  and deep geothermal. All are 'Nth of a kind' unless marked first of a kind (FOAK). Component cells are rounded to
  whole pounds and may not sum to the total; some are printed as '<1'. Fuel and carbon costs follow DESNZ's central
  fossil fuel price and carbon price assumptions.
