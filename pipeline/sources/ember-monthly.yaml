acquisition: automatic
artifacts:
  # HEAD 200 on 2026-10-04: 28,333,064 bytes, Last-Modified Fri 18 Sep 2026, ETag from Google Cloud Storage.
  - id: generation-monthly-global
    url: https://files.ember-energy.org/public-downloads/generation/outputs/release_generation_monthly_global.csv
    format: csv
    description: >-
      One row per area, month and source, with generation, share, emissions and intensity as columns. The
      Europe-only file (release_generation_monthly_lower.csv, net generation) is not used.
status:
