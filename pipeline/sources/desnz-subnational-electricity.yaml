# UK Department for Energy Security and Net Zero (DESNZ), Subnational electricity consumption statistics, Great
# Britain, 2005 to 2024 (Accredited Official Statistics).
# Evidence: docs/research/sources-zero-space-and-power-2026-10-08.json (question b, rank 4).
# Checked 2026-10-08:
#   - GOV.UK content API
#     (https://www.gov.uk/api/content/government/statistics/regional-and-local-authority-electricity-consumption-statistics):
#     organisation Department for Energy Security and Net Zero; updated 2025-12-18 with the change note "Updated with
#     Sub-national electricity consumption statistics and distribution 2024 tables."; attachment "Subnational
#     electricity consumption statistics 2005 to 2024", the xlsx below (2,103,254 bytes).
#   - The workbook: HTTP 200, ETag "69426e90-2017d6", Last-Modified Wed 17 Dec 2025, sha256
#     9d40814a23f87b2b028dd39da05b47d0e67e843473ec6ec4a8a0f93167666429. Its cover sheet: "Publication date: 18 December
#     2025", "Next update: December 2026". The asset URL is per revision, so it pins this edition.
#   - The licence sentence is in the GOV.UK page footer (the link text "Open Government Licence v3.0" sits inside it).
#     DESNZ gives no specific attribution statement, so OGL v3's default applies: "Contains public sector information
#     licensed under the Open Government Licence v3.0."
#   - Third-party content: the household counts behind the mean per household are ONS, Welsh Government and National
#     Records of Scotland estimates (cover sheet), all Crown copyright under the same licence; Wales 2024 households
#     are DESNZ's own projections from 2023.
# Electricity years (cover sheet): half-hourly meters cover the calendar year; non-half-hourly meters (almost all
# homes) cover February to January ("the 2024 electricity year was February 2024 to January 2025"). Both spans of the
# 2024 year are 366 days. Northern Ireland is not covered.
id: desnz-subnational-electricity
title: Subnational electricity consumption, Great Britain
publisher: Department for Energy Security and Net Zero (UK Government)
landing_url: https://www.gov.uk/government/statistics/regional-and-local-authority-electricity-consumption-statistics
description: >-
  Metered electricity consumption in Great Britain (England, Scotland and Wales) by country, region and local
  authority, one sheet per year from 2005 to 2024: numbers of meters, total consumption in gigawatt-hours, mean and
  median consumption per meter in kilowatt-hours for domestic and non-domestic meters, and, from 2012, mean domestic
  consumption per household. Built from meter-level consumption data supplied by electricity data aggregators.
  Domestic and most non-domestic meters are counted over February to January, half-hourly meters over the calendar
  year.
