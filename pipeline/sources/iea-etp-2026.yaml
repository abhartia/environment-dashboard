# IEA, Energy Technology Perspectives 2026 (March 2026; revised April and July 2026): statements of the production
# cost premium of near-zero emissions steel, cement and urea over conventional production.
# Evidence: docs/research/sources-zero-green-premium-2026-10-08.json (candidate rank 3), re-checked 2026-10-08.
# iea.org pages return 403 with "cf-mitigated: challenge" to scripts; the report PDF is served to scripts from the
# IEA's own blob host (iea.blob.core.windows.net). Nothing is read from iea.org pages or from any copy of them: the
# chart series embedded in iea.org chapter pages (for example Figure 7.15) are not used.
# Licence, read 2026-10-08 in the PDF itself (page 387 of 388, the colophon; terms_url): quoted below. Every page
# footer reads "IEA. CC BY 4.0." The colophon adds "Unless otherwise indicated, all material presented in figures and
# tables is derived from IEA data and analysis."
# The IEA "Notice for CC-licensed Content" (recorded in iea-gevo-2026 from its Internet Archive copy of 2026-10-02;
# iea.org blocks scripts) adds: no IEA logo, visual identity or cover images and no suggestion of IEA endorsement; the
# preferred attribution "IEA 202[X]; [Title name], [URL], License: [relevant CC license e.g. CC BY 4.0]"; third-party
# components are not licensed; and adaptations must carry the derived-work disclaimer, reproduced verbatim in
# obligations.derived_disclaimer.
# Third-party material in this report, not used: the SAF cost dashboard (its method note cites Argus), Figure 1.11
# (built on BloombergNEF and Argus data), and Figures 2.2, 4.10, 7.14 and 7.21-7.28 (BloombergNEF, S&P Global, CRU
# and others). The statements used are IEA's own levelised cost of production analysis: the dashboard method notes
# (pages 162-163) say conventional and near-zero routes are compared per region and that "Costs do not include any
# explicit policy supports, e.g. carbon pricing or subsidies"; Figure 1.17 (urea, page 73) is credited "IEA. CC BY
# 4.0." and says "The cost of carbon pricing is included in the LCOP".
# The PDF is 33,223,886 bytes, above the 20 MB the weekly terms check used to accept; fetch.TERMS_MAX_BYTES was
# raised to 40 MB for it.
# Because the PDF holds third-party figures that the CC licence does not cover, the raw file is not re-hosted
# (mirror_raw false), and its tests run on the snapshot (-m snapshot), not on a committed fixture.
id: iea-etp-2026
title: Energy Technology Perspectives 2026
publisher: International Energy Agency
landing_url: https://www.iea.org/reports/energy-technology-perspectives-2026
description: >-
  The IEA's report on clean energy technologies, their supply chains and the cost of making low-emissions materials.
  It states, in its own words, how much more near-zero emissions steel and cement are expected to cost to produce
  than conventional steel and cement in 2035 in the Stated Policies Scenario (STEPS) without policy support (steel
  about 20-145% higher, USD 125-600 per tonne of crude steel; cement 75-150%, USD 50-175 per tonne), and the cost
  premium of low-emissions urea in Japan in 2035 (about 80%, about 55% with imported low-emissions ammonia). Values are
  projections, quoted with their page; unless stated otherwise the report's US dollars are real 2024 dollars at market
  exchange rates.
