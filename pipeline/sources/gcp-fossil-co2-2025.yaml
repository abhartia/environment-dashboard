# The Global Carbon Project's fossil CO2 emissions dataset, 2025v15 (Andrew & Peters), flat CSV files on Zenodo.
# Evidence: docs/research/sources-emissions.json ("The Global Carbon Project's fossil CO2 emissions dataset 2025v15";
# verdict confirmed).
# Checked 2026-10-04:
#   - Zenodo API record 17417124: version 2025v15, published 2025-10-22, license cc-by-4.0, 7 files.
#     /api/records/17417124/versions/latest -> 301 to 17417124 itself, so no newer version exists.
#   - DataCite 10.5281/zenodo.17417124 rights: "Creative Commons Attribution 4.0 International".
#   - Every artifact URL: ranged GET -> 206 (sizes below). HEAD -> 200 with Last-Modified; a GET with If-Modified-Since
#     -> 304. Zenodo's Last-Modified is the storage date (17 Sep 2026), not the publication date.
#   - citation.text is the producer's own citation string, copied from the "Territorial Emissions" sheet of
#     National_Fossil_Carbon_Emissions_2025_v1.0.xlsx (gcb-2025-national). The per-field "citation" in the metadata
#     JSON still reads "Friedlingstein et al 2020 (DOI: 10.5194/essd-12-3269-2020)", an older paper.
id: gcp-fossil-co2-2025
title: The Global Carbon Project's fossil CO2 emissions dataset, 2025 release
publisher: Global Carbon Project (Robbie M. Andrew and Glen P. Peters, CICERO)
landing_url: https://zenodo.org/records/17417124
description: >-
  Fossil carbon dioxide emissions by country and year from 1750 to 2024, in million tonnes of carbon dioxide, split into
  coal, oil, gas, cement, flaring and other carbonates, with emissions per person and the population series used for
  them. These are territorial emissions, the same national series as the Global Carbon Budget 2025, with international
  aviation and international shipping as separate entries. The cement carbonation sink is not subtracted, so the world
  total is higher than the Global Carbon Budget's headline fossil figure.
