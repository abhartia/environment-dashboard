id: wb-carbon-pricing-2026
title: State and Trends of Carbon Pricing 2026
publisher: World Bank
landing_url: https://www.worldbank.org/en/publication/state-and-trends-of-carbon-pricing
description: >-
  The World Bank's annual review of carbon taxes, emissions trading systems and carbon crediting worldwide: the
  instruments in force, the share of global greenhouse gas emissions they cover, prices (US dollars per tonne of
  CO2-equivalent) and the revenue they raise. The 2026 edition uses data up to 1 April 2026; its executive summary
  states that direct carbon pricing covers 29 percent of global greenhouse gas emissions through 87 implemented
  policies, and that government revenues from these instruments rose to over US$ 107 billion in 2025. Coverage is not
  the same as price level. Values are quoted as the report states them, with the page.
