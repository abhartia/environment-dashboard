# Ember monthly electricity data (global file): generation, shares, lifecycle emissions and intensity by month.
# Evidence: docs/research/sources-energy.json ("Ember – Monthly Electricity Data"), re-checked 2026-10-04.
# Licence: the Creative Commons page linked from every ember-energy.org footer (GET 200 on 2026-10-04); the API spec
# at https://api.ember-energy.org/v1/openapi.json declares "CC-BY-4.0 (data)". citation.text is the example
# attribution given verbatim in that spec's "License and Attribution" section. Ember publishes no version label:
# {version} is the file's HTTP Last-Modified date.
id: ember-monthly
title: Monthly electricity data
publisher: Ember
landing_url: https://ember-energy.org/data/monthly-electricity-data/
description: >-
  Monthly electricity generation by source (terawatt-hours), share of generation, lifecycle emissions (MtCO2e) and
  emissions intensity (gCO2e per kWh) for 88 countries and 11 regions, from December 1998 at the earliest; the World
  series runs from January 2019. Values are provisional and revised often. The World total is Ember's estimate built
  from the countries it covers. Recent months cover fewer countries: in the file of 18 September 2026, "Total
  generation" has values for 71 countries in May 2026, 64 in June, 56 in July and 38 in August, and the World series
  ends in July 2026. Each month is shown with the number of countries behind it. Emissions are lifecycle
  CO2-equivalent, not combustion CO2.
citation:
  type: dataset
  title: Monthly electricity data
  author:
    - {literal: Ember}
  issued: "2026"
  publisher: Ember
  version: "{version}"
  URL: https://ember-energy.org/data/monthly-electricity-data/
  text: Monthly electricity generation data, Ember
