artifacts:
  - id: global-annual
    url: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/analysis/diagnostics/HadCRUT.5.2.0.0.analysis.summary_series.global.annual.csv
    format: csv
    description: >-
      Global (NH+SH)/2 annual mean anomaly, °C relative to 1961–1990, with the 2.5% and 97.5% limits, from 1850.
      The last row is the current year so far.
  - id: global-monthly
    url: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/analysis/diagnostics/HadCRUT.5.2.0.0.analysis.summary_series.global.monthly.csv
    format: csv
    description: >-
      Global (NH+SH)/2 monthly mean anomaly, °C relative to 1961–1990, with the 2.5% and 97.5% limits, from
      January 1850. Used to tell complete years from the partial current year.
