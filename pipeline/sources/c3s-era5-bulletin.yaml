# Copernicus Climate Change Service (C3S) Climate Bulletin: monthly global-mean surface air temperature from ERA5.
# Evidence: docs/research/sources-atmosphere-and-temperature.json (verification.missing_sources item 1, "C3S Climate
# Bulletin monthly global ERA5 CSV", and the corrections to "Copernicus C3S ERA5 global temperature and Climate Pulse").
#
# The file moves every month. Pattern seen on the bulletin pages:
#   https://climate.copernicus.eu/sites/default/files/{upload YYYY-MM}/C3S_Bulletin_temp_{data YYYYMM}_Fig1b_timeseries_anomalies_ref1991-2020_global_allmonths_DATA.csv
# The folder is the month the file was uploaded (normally the month after the data month), and the site's CMS
# sometimes appends "_0" to a re-uploaded file name (the August 2026 Fig8 file is "..._DATA_0.csv"), so the fetcher
# should take the link from the month's bulletin page (https://climate.copernicus.eu/surface-air-temperature-{month}-{year},
# e.g. surface-air-temperature-august-2026, under "Data (all months)") rather than build it. Current file: data to
# August 2026, "Last updated: 03 Sep 2026", HTTP 200 on 2026-10-04 (Last-Modified 09 Sep 2026, ETag present). The
# September 2026 name under 2026-10/ returned HTTP 404 on 2026-10-04 (not yet published).
#
# Licence: the CSV and climate.copernicus.eu carry no licence statement of their own. The file header names its data
# source as ERA5 monthly averaged data on the C3S Climate Data Store, whose catalogue entry is licensed CC BY 4.0 (the
# quote below). The CDS "Citation and attribution" text for that dataset adds, "In addition to the requirements of the
# applicable license(s)", a Copernicus attribution and the EC/ECMWF disclaimer, so both are obligations here. Those
# two lines also satisfy clause 5 of the Licence to use Copernicus Products (rev. 12), should C3S treat the Bulletin
# file as a Copernicus Product under that licence instead.
id: c3s-era5-bulletin
title: C3S Climate Bulletin global surface air temperature (ERA5)
publisher: Copernicus Climate Change Service (C3S), implemented by ECMWF for the European Commission
landing_url: https://climate.copernicus.eu/climate-bulletin
description: >-
  Monthly global-mean surface air temperature from the ERA5 reanalysis since January 1940, as published with each
  monthly C3S Climate Bulletin: the absolute value, the 1991–2020 monthly climatology, the anomaly from 1991–2020, the
  C3S offset between 1991–2020 and 1850–1900 (offset_pi, 0.80 to 0.96 °C depending on the month) and the anomaly from
  1850–1900 (ano_pi). The offset is C3S's estimate from HadCRUT5, NOAAGlobalTemp and Berkeley Earth, because ERA5
  starts in 1940; the site uses ano_pi as published and says so. The latest months come from preliminary ERA5 data.
