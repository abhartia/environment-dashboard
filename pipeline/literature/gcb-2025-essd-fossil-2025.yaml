title: Fossil carbon dioxide emissions projected for 2025 (Global Carbon Budget)
description: >-
  The Global Carbon Project's projection of carbon dioxide emissions from fossil fuels and industry in 2025, made from
  data for part of the year: 38.1 billion tonnes, 1.0 percent more than in 2024 (range 0.2 to 1.7 percent). It is net
  of the carbon dioxide that cement takes back up as it ages (the cement carbonation sink), like the paper's headline
  value for 2024.
