id: arnaiz-del-pozo-2022
title: Levelised cost of blue and green ammonia (Arnaiz del Pozo & Cloete 2022)
publisher: >-
  Carlos Arnaiz del Pozo (Universidad Politécnica de Madrid) and Schalk Cloete (SINTEF Industry); published in Energy
  Conversion and Management (Elsevier)
landing_url: https://doi.org/10.1016/j.enconman.2022.115312
description: >-
  A techno-economic assessment of ammonia production. Two conventional natural-gas plants with CO2 capture (the KBR
  Purifier process and the Linde Ammonia Concept), the KBR plant without capture, an advanced blue plant (gas
  switching reforming, GSR) and an optimised green plant (wind and solar power, electrolysers, storage) share one
  ammonia synthesis loop and one cash-flow method, which gives the levelised cost of ammonia in euros per tonne
  (2020 euros, Western Europe cost basis). The natural-gas plants are costed at European energy prices with a CO2 tax
  of 100 euros per tonne; the green plants use technology costs for 2050 in northern Germany, southern Spain and Saudi
  Arabia. A modelled comparison, not market prices.
