acquisition: automatic
artifacts:
  - id: global-annual
    url: https://www.metoffice.gov.uk/hadobs/hadsst4/data/data/HadSST.4.2.0.0_annual_GLOBE.csv
    format: csv
    description: >-
      Global annual SST anomaly from 1850, K relative to 1961–1990, with total, uncorrelated, correlated, bias and
      coverage uncertainties (1σ) and the 95% bias-uncertainty range. Complete years only.
  - id: global-monthly
    url: https://www.metoffice.gov.uk/hadobs/hadsst4/data/data/HadSST.4.2.0.0_monthly_GLOBE.csv
    format: csv
    description: >-
      Global monthly SST anomaly from January 1850, K relative to 1961–1990, with the same uncertainty columns. Runs
      to August 2026 on 2026-10-04.
status:
  state: active
  note: >-
    Updated monthly. UK government (Met Office) dataset, not exposed to US federal cuts, though its main input
    (ICOADS) is maintained by NOAA and partners. The version is part of each file's URL, so a new version means a
    registry edit.
  us_federal: false
update_cadence: Monthly; a new minor version about once a year
twins: [oisst-v2]
