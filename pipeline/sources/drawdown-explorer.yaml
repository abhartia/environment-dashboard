# Project Drawdown, Drawdown Explorer: per-solution assessment spreadsheets and the assessment methodology, as
# deposited by Project Drawdown on Zenodo (community "pdexplorer"), CC BY 4.0.
# Evidence: docs/research/sources-solutions-and-action.json ("Drawdown Explorer: solutions table and per-solution
# assessment spreadsheets"); verdict "corrected": cite methodology version 10.5281/zenodo.20865531 (June 2026,
# concept 10.5281/zenodo.15692853), not the stale 18037237 the explorer page links; all community records are
# cc-by-4.0. final_redistribution open-attribution.
# Checked 2026-10-04:
#   - Zenodo community pdexplorer: 39 records, every one licence cc-by-4.0 (all three API pages read): the methodology
#     (record 20865531, "Web Version of Methodology - June 2026.pdf", 3,230,671 bytes, md5
#     40683efb831dd76c65c781c4163aee11) and 38 solution spreadsheets. Each record below is its concept's latest
#     version (/versions/latest resolves to itself), and each file URL answered a ranged GET with HTTP 206. Zenodo
#     ignores If-Modified-Since, so conditional is false; pinned record versions never change.
#   - DataCite for 10.5281/zenodo.20865531: rights "Creative Commons Attribution 4.0 International".
#   - The licence quote is Project Drawdown's own FAQ (https://drawdown.org/explorer/faqs, HTTP 200), which also says
#     "All of the data, spreadsheets, GIS map layers, and other resources powering the Drawdown Explorer are freely
#     available" through each solution page's "Methods and Supporting Data" link (the Zenodo records).
#   - drawdown.org's generic Terms of Use forbid reuse of "any Content not owned by you ... without the prior consent
#     of the owner"; the FAQ grant and the CC BY 4.0 deposits are the producer's specific terms for these files.
#   - The website's CSV export (drawdown.org/explorer-solutions-table-export.csv) is not registered: it carries no
#     licence of its own, so only the Zenodo deposits are used.
#   - Not mirrored: the spreadsheets embed third-party input tables (for example FAOSTAT series and literature values
#     such as Poore & Nemecek 2018 in "Improve Diets"), which the CC BY deposit cannot relicense. The site uses the
#     "results" sheet (Drawdown's own effectiveness, adoption, impact and cost results).
#   - The FAQ asks users to "give credit to Project Drawdown, link to the appropriate page(s), and cite our work", so
#     each solution card links to its Drawdown Explorer page and its Zenodo DOI.
#   - The community grows (newest records 2026-08-18); re-list https://zenodo.org/api/communities/pdexplorer/records at
#     each review and add new solutions as new artifacts.
id: drawdown-explorer
title: Drawdown Explorer solution assessments
publisher: Project Drawdown
landing_url: https://drawdown.org/explorer
description: >-
  Project Drawdown's assessments of climate solutions at global scale. Each solution spreadsheet gives the adoption
  unit, effectiveness (tonnes of CO2-equivalent avoided or removed per adoption unit per year, on 100-year and 20-year
  warming potentials, with percentiles), current and achievable adoption, the resulting climate impact range (gigatonnes
  of CO2-equivalent per year), cost per tonne (US dollars of 2023) and the literature each value comes from, against a
  2023 baseline. Potentials are ranges and are not additive across solutions; this methodology differs from the 2017
  and 2020 Drawdown tables, which are not comparable. Used for system-level solution cards that sit behind personal
  actions.
