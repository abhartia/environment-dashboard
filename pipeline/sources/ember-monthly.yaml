  note: >-
    Updated about twice a month. The landing page still says "Last Updated 28/07/2026" while the file was last
    modified on 18 September 2026, so the file date is the version. Not exposed to US federal cuts.
  us_federal: false
update_cadence: Rolling updates about twice a month
research_ref: docs/research/sources-energy.json#Ember – Monthly Electricity Data
