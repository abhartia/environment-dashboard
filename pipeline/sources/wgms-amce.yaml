# WGMS annual mass-change estimates for the world's glaciers (AMCE), version 2026-02-10: hydrological years 1976-2025.
# Evidence: docs/research/sources-ocean-and-ice.json ("WGMS Annual mass-change estimates for the world's glaciers
# (AMCE, version 2026-02-10)"); verifier verdict "confirmed" (143 files; 2025: -408.101 Gt, sigma 67.223; cumulative
# -9583.132 Gt, sigma 617.629; 26.436 +/- 1.704 mm sea level equivalent; the README carries the citation). The CSV's
# one-sigma uncertainty for 2025 (67 Gt) differs from the +/-132 Gt in WGMS's Nature Reviews Earth & Environment
# summary; the CSV value is the one shown.
# Licence evidence checked 2026-10-04: WGMS data policy page (HTTP 200, "last change 12/06/2023") quoted below; it also
# says "The use of data and information from WGMS requires acknowledgement of the WGMS and/or the original investigators
# and sponsoring agencies", which the citation satisfies. The AMCE landing page (where the DOI resolves) gives "Rights:
# Open access under the requirement of correct citation" and names WGMS and the Copernicus Climate Change Service (C3S)
# as publishers; the terms of this WGMS distribution are the ones that apply here. DataCite's rightsList for the DOI is
# empty.
# Artifact checked 2026-10-04: HTTP 200, 53,589,520 bytes, ETag "331b610-64b93f5a76d99", Last-Modified 24 Feb 2026,
# answers If-None-Match with 304; sha256 b88c2355650142160594c96dcb800e3fb58d82abbebd0ab2d976a458153e2ecc. The zip
# holds README.md, global.csv, global_grid.nc4, region/*.csv and glacier/*.csv (143 files, 489 MB unpacked); global.csv
# runs 1976 (+12.432 Gt) to 2025 (-408.101 Gt). Each release has its own DOI and file name, so a new release means a
# new URL here.
# citation.text: the two citations in the zip's README.md ("Please cite the dataset" and "the related publication"),
# verbatim.
id: wgms-amce
title: Annual mass-change estimates for the world's glaciers (version 2026-02-10)
publisher: World Glacier Monitoring Service (WGMS), University of Zurich
landing_url: https://wgms.ch/mass_change_estimates/
description: >-
  Annual glacier mass change for every glacier, 19 glacier regions (Southern Andes split in two), a 0.5-degree grid and
  the world, for hydrological years 1976-2025: metres water equivalent, gigatonnes and millimetres of sea level
  equivalent, each with a one-sigma uncertainty, plus glacier area. Made by combining multi-year satellite
  elevation-change estimates with annual field measurements from the WGMS Fluctuations of Glaciers database.
  Hydrological years run from 1 October in the Northern Hemisphere, 1 April in the Southern Hemisphere and 1 January in
  the tropics, labelled by the year they end. In global.csv, mass loss is negative in Gt and positive in mm of sea level
  equivalent. The latest year is revised in the next release.
