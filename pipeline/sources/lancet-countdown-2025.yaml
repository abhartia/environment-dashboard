  - id: work-hours-lost-1-1-3
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.3_PWHL_Data-Download_2025-Lancet-Countdown-Report_v2-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.3, potential work hours lost: sheets Country, Global, WHO and HDI, 1990-2024. Hours lost by sector
      (WHL200Serv, WHL300Manuf, WHL400sunAgr, WHL400sunConstr) and in total (TotalSunAgCon), in thousands of hours,
      plus hours lost per worker (TotalSunWHLpp).
  - id: heatwave-days-attributable-1-1-1
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.1_Attributable_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.1, heatwave days per person: Observed, Counterfactual (without human-caused warming) and
      Attributable_to_CC, for each year 2020-2024, on a country sheet and a global sheet.
  - id: heatwave-exposure-vulnerable-1-1-1
    url: https://lancetcountdown.org/wp-content/uploads/2025/10/Indicator-1.1.1_Vulnerable_Data-Download_2025-Lancet-Countdown-Report-1.xlsx
    format: xlsx
    description: >-
      Indicator 1.1.1, heatwave exposure of infants under 1 and adults over 65: total person-days and average days per
      person, 1980-2024, on Country, Global, WHO, LC and HDI sheets (the Global sheet also has over-75s).
