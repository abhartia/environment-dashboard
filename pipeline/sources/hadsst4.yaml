  type: article-journal
  title: "An Ensemble Data Set of Sea Surface Temperature Change from 1850: The Met Office Hadley Centre HadSST.4.0.0.0 Data Set"
  author:
    - {family: Kennedy, given: J. J.}
    - {family: Rayner, given: N. A.}
    - {family: Atkinson, given: C. P.}
    - {family: Killick, given: R. E.}
  issued: "2019"
  container-title: "Journal of Geophysical Research: Atmospheres"
  volume: "124"
  version: "HadSST.{version}"
  DOI: 10.1029/2018JD029867
  URL: https://doi.org/10.1029/2018JD029867
  # Both citations the terms page asks for, verbatim.
  text: >-
    Kennedy, J. J., Rayner, N. A., Atkinson, C. P., & Killick, R. E., 2019. An Ensemble Data Set of Sea Surface
    Temperature Change from 1850: The Met Office Hadley Centre HadSST.4.0.0.0 Data Set. Journal of Geophysical
    Research: Atmospheres, 124. https://doi.org/10.1029/2018JD029867. Sandford, C., and Rayner, N., 2026. Addressing
    the World War 2 Warm Anomaly in HadSST.4.2.0.0. International Journal of Climatology.
    https://doi.org/10.1002/joc.70388.
