id: lovering-2022
title: Land-use intensity of electricity (Lovering et al. 2022)
publisher: >-
  Lovering, Swain, Blomqvist and Hernandez (University of Michigan, Breakthrough Institute, University of California
  Davis); published in PLOS ONE (Public Library of Science)
landing_url: https://doi.org/10.1371/journal.pone.0270155
description: >-
  A synthesis of land use per unit of electricity for nuclear, geothermal, wind, residue and dedicated biomass,
  natural gas, hydroelectric dams, coal, concentrating solar and ground-mounted solar panels, in hectares occupied per
  terawatt-hour generated in a year (ha/TWh/y). Table 1 gives the median, mean, interquartile range (the width from
  the 25th to the 75th percentile, not the two quartiles), standard error and number of sites for each. Coal, natural
  gas, nuclear and dedicated biomass include the land used to mine, grow, process or transport their fuel; land to
  make panels, turbines and plants, transmission lines and offshore areas are not counted. Wind and natural gas have
  two values: the land physically occupied (footprint) and the whole area inside the site's boundary (spacing).
  Rooftop solar is assigned zero by assumption. Nuclear, wind and ground-mounted solar sites are in the United
  States, coal sites in the United States and Canada, dams in 80 countries.
