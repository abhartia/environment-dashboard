      downloads AGR2025.pdf, checks that page 2 carries the notice quoted in this entry, and records it with
      `uv run envdash snapshot add --source unep-agr-2025 --artifact report-pdf --file AGR2025.pdf
      --url "<the link it was downloaded from>" --note "downloaded by <who> from https://wedocs.unep.org/handle/20.500.11822/48798"`.
