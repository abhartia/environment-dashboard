id: rajalehto-helo-2025
title: Monthly cost of ownership of diesel, biomethane and electric trucks in Finland (Rajalehto & Helo 2025)
publisher: >-
  Clara Rajalehto and Petri Helo (University of Vaasa); published in the Journal of Cleaner Production (Elsevier)
landing_url: https://doi.org/10.1016/j.jclepro.2025.145524
description: >-
  A case study of heavy trucks (64-tonne combinations, 40 pallets) run by one Finnish food logistics company on
  comparable routes from January to October 2023: a Volvo FH6x4 on diesel, a Volvo FH6x4 on liquid biomethane (LBG)
  and a Volvo FH Electric, all leased for five years. The monthly total cost of ownership (leasing, insurance, labour,
  energy and an emissions cost at the EU ETS price) is simulated 1,000 times per truck from the measured consumption,
  daily distances and energy prices. Subsidies are not modelled separately. One company's trucks; not a market
  average.
