#     inputs of a heatwave-only re-run, which bundles third-party files).
id: grant-2025
title: Unprecedented lifetime exposure to climate extremes by birth year (Grant et al. 2025)
publisher: >-
  Luke Grant, Inne Vanderkelen, Lukas Gudmundsson, Erich Fischer, Sonia I. Seneviratne and Wim Thiery (Vrije Universiteit
  Brussel, Environment and Climate Change Canada, KU Leuven, Royal Meteorological Institute of Belgium and ETH Zurich);
  published in Nature (Springer Nature)
landing_url: https://doi.org/10.1038/s41586-025-08907-1
description: >-
  A modelled projection of how many people born each year from 1960 to 2020 will live through more heatwaves, crop
  failures, river floods, droughts, wildfires and tropical cyclones in their lifetime than the 99.99th percentile of
  lifetimes simulated in a pre-industrial climate ("unprecedented lifetime exposure"), along warming pathways that
  reach 1.5 to 3.5 °C above 1850-1900 by 2100. Extremes come from the ISIMIP2b simulations (four CMIP5 climate models
  and, for every extreme except heatwaves, impact models), combined with population, cohort sizes and country-average
  life expectancy. It is a statistical definition of an unusual lifetime, not a count of deaths or of harm.
